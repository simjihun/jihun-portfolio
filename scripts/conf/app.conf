# =========================================
# 앱 환경 설정 파일 템플릿
# 실제 운영용 파일은 서버의 /home/jihun/conf/app.conf 에만 존재하며,
# 값을 채운 실제 파일은 절대 이 레포에 커밋하지 않는다 (.gitignore에서도 별도 차단).
# 서버에서는 비밀번호가 들어가므로 권한을 제한할 것: chmod 600 conf/app.conf
# =========================================

# 서비스 포트 (EC2 보안그룹에 열려있는 포트)
SERVER_PORT=8080

# === AWS RDS(MySQL) 연동 ===
# 미설정 시 H2(인메모리)로 동작한다.
SPRING_PROFILES_ACTIVE=prod
DB_HOST=
DB_NAME=msgdb
DB_USER=admin
DB_PASSWORD=

# === 외부 API 연동 (각 기능별 미설정 시 해당 기능만 조용히 비활성화되고 나머지는 정상 동작) ===

# Google Gemini — AI 뉴스 매일 3줄 브리핑 (https://aistudio.google.com)
GEMINI_API_KEY=

# 네이버 클라우드플랫폼 Maps — 지도 표시 (https://console.ncloud.com, AI·NAVER API > Application)
NAVER_MAP_CLIENT_ID=
NAVER_MAP_CLIENT_SECRET=

# 카카오 Local API — 맛집 검색 + 부동산 단지 좌표 지오코딩 (https://developers.kakao.com)
KAKAO_API_KEY=

# 국토교통부 아파트매매 실거래가 상세자료 OpenAPI 서비스키(Encoding 키) (https://data.go.kr)
REALESTATE_API_KEY=
