server:
  # 환경변수 SERVER_PORT가 있으면 그 값을, 없으면 8081 사용 (로컬 개발용)
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      # 비공개 회원 영역 세션 유지시간. remember-me 쿠키(24h)와 맞춰 24시간으로 설정.
      timeout: 24h

spring:
  application:
    name: jihun-portfolio

  # @Scheduled 작업들을 위한 스레드풀. 기본값이 1개라, 뉴스 수집(30분 간격)처럼 오래 걸릴 수 있는
  # 작업 하나가 늦어지면 뉴스 AI 브리핑(매일 7시)·AWS 빌링 갱신(매일 자정)·주식 AI 브리핑(9/15/21시)
  # 같은 다른 스케줄 작업들이 전부 그 뒤에서 굶는 문제가 있었다(news_briefing이 2주 넘게 한 번도
  # 안 쌓인 원인). 서로 독립된 별도 스레드에서 돌도록 여유 있게 늘려둔다.
  task:
    scheduling:
      pool:
        size: 5

  datasource:
    # 인메모리 H2 → 앱을 끄면 데이터가 사라짐 (로컬 개발용)
    url: jdbc:h2:mem:portfoliodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # 비밀번호 재설정 인증번호 이메일 발송 (MAIL_USERNAME 미설정 시 발송 없이 로그로만 남고 기능은 비활성 응답을 반환)
  # 운영 서버에서는 conf/private.conf 에서 주입한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  worker:
    count: 5               # 발송 워커 쓰레드 개수
    send-delay-ms: 1000    # 발송 시뮬레이션 소요 시간(ms)
    max-retry: 2           # 발송 실패 시 자동 재시도 횟수

  security:
    # 전화번호·이메일 암호화 및 조회용 해시, remember-me 쿠키 서명에 함께 쓰는 키. 운영 서버에서는 conf/private.conf 에서 주입한다.
    encryption-key: ${APP_ENCRYPTION_KEY:local-dev-only-change-me}

  aws:
    # 관리자 대시보드의 프리티어 잔여일수 계산용(선택). 형식 YYYY-MM-DD, 미설정 시 잔여일수 대신 안내 문구만 표시.
    # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY는 AWS SDK가 환경변수에서 자동으로 읽으므로 여기 별도 바인딩 불필요.
    account-created-date: ${ACCOUNT_CREATED_DATE:}
