server:
  # 환경변수 SERVER_PORT가 있으면 그 값을, 없으면 8081 사용 (로컬 개발용)
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: jihun-portfolio

  datasource:
    # 인메모리 H2 → 앱을 끄면 데이터가 사라짐 (로컬 개발용)
    url: jdbc:h2:mem:portfoliodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # 비밀번호 재설정 인증번호 이메일 발송 (MAIL_USERNAME 미설정 시 발송 없이 로그로만 남고 기능은 비활성 응답을 반환)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  worker:
    count: 5               # 발송 워커 쓰레드 개수
    send-delay-ms: 1000    # 발송 시뮬레이션 소요 시간(ms)
    max-retry: 2           # 발송 실패 시 자동 재시도 횟수

  security:
    # 전화번호·이메일 암호화 및 조회용 해시에 쓰는 키. 반드시 운영 환경변수로 별도 값을 넣을 것(APP_ENCRYPTION_KEY).
    encryption-key: ${APP_ENCRYPTION_KEY:local-dev-only-change-me}

  admin:
    # 최초 관리자 계정 부트스트랩(서버 시작 시 없으면 1회 생성). 운영에서는 반드시 환경변수로 지정.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
