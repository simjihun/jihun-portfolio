<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 · hunit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<style>
.sandbox-note{color:var(--dim);font-size:12.5px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.dash-note{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}
.chart-wrap{height:170px;margin-top:4px}
.credit-box{display:flex;gap:10px;margin-bottom:14px}
.credit-box .cell{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.credit-box .cell .k{font-size:11.5px;color:var(--mut);margin-bottom:4px}
.credit-box .cell .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--green)}
.credit-box .cell .v.warn{color:var(--red)}
.ft-item{padding:9px 0;border-bottom:1px solid var(--line)}
.ft-item:last-child{border-bottom:0}
.ft-item .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.ft-item .svc{color:var(--ink)}
.ft-item .pct{font-family:var(--mono);color:var(--mut)}
.ft-bar{height:5px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.ft-bar-fill{height:100%;background:var(--amber);border-radius:999px}
.ft-bar-fill.warn{background:var(--red)}
.today-box{display:flex;gap:10px;margin-bottom:10px}
.today-box .cell{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.today-box .cell .k{font-size:11.5px;color:var(--mut);margin-bottom:3px}
.today-box .cell .v{font-family:var(--mono);font-size:18px;font-weight:700}
/* DB 정보 테이블은 base.css의 table{min-width:560px}를 상속받으면 좁은 2단 레이아웃에서
   불필요하게 가로 스크롤이 생긴다 — 이 테이블만 내용에 맞춰 폭을 쓰도록 재정의 */
.dash-table-wrap table{min-width:0;width:100%;table-layout:auto}
.dash-table-wrap{overflow-x:visible}
</style>
</head>
<body style="padding-top:0">
<div id="private-nav"></div>

<main>
  <header class="page"><h1>대시보드</h1></header>

  <div id="adminPanels" style="display:none">
    <div class="dash-grid">
      <div class="panel">
        <h2>☁️ AWS 인스턴스</h2>
        <div class="dash-kv" id="awsInfo"><div class="empty">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>🗄️ DB 정보</h2>
        <div class="dash-kv" id="dbInfo"><div class="empty">불러오는 중...</div></div>
        <div class="dash-table-wrap">
          <table>
            <thead><tr><th>테이블</th><th>행 수</th><th>용량(MB)</th></tr></thead>
            <tbody id="dbTables"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <h2>💳 프리티어 · 크레딧</h2>
        <div id="creditBox"></div>
        <div id="freeTierList"><div class="empty">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>📈 최근 7일 비용(원)</h2>
        <div class="today-box" id="todayBox"></div>
        <div class="chart-wrap"><canvas id="costChart"></canvas></div>
        <div class="dash-note" id="costNote"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>기능 모음</h2>
    <div class="sandbox-note">여기에 앞으로 개발할 기능들이 하나씩 추가될 예정입니다.</div>
  </div>
</main>

<script src="/js/private-nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const won = n => '₩' + Math.round(n).toLocaleString('ko-KR');

async function initDashboard(){
  const me = await fetch('/api/auth/me').then(r => r.json()).catch(() => ({ authenticated: false }));
  if (!me.authenticated) return; // private-nav.js가 /login으로 이미 보냄
  const isAdmin = (me.roles || []).includes('ROLE_ADMIN');
  if (!isAdmin) return;
  $('adminPanels').style.display = 'block';
  loadAws();
  loadDb();
  loadFreeTier();
  loadCredits();
  loadCost();
}

function kvRow(k, v){
  return `<div class="dash-kv-row"><span class="k">${esc(k)}</span><span class="v">${esc(v ?? '-')}</span></div>`;
}

async function loadAws(){
  const data = await fetch('/api/admin/dashboard/aws').then(r => r.json()).catch(() => null);
  if (!data) { $('awsInfo').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }
  if (!data.available) {
    $('awsInfo').innerHTML = `<div class="empty">${esc(data.message)}</div>`;
    return;
  }
  $('awsInfo').innerHTML = [
    kvRow('인스턴스 ID', data.instanceId),
    kvRow('인스턴스 타입', data.instanceType),
    kvRow('리전', data.region),
    kvRow('가용영역', data.availabilityZone),
    kvRow('퍼블릭 IP', data.publicIp),
    kvRow('프라이빗 IP', data.privateIp),
    kvRow('AMI ID', data.amiId)
  ].join('');
}

async function loadDb(){
  const data = await fetch('/api/admin/dashboard/database').then(r => r.json()).catch(() => null);
  if (!data) { $('dbInfo').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }
  $('dbInfo').innerHTML = [
    kvRow('호스트', data.host),
    kvRow('포트', data.port),
    kvRow('DB명', data.database)
  ].join('') + (data.connected === false ? `<div class="dash-note">${esc(data.message)}</div>` : '');

  const tables = data.tables || [];
  $('dbTables').innerHTML = !tables.length
    ? '<tr><td colspan="3" class="empty">테이블 정보가 없습니다.</td></tr>'
    : tables.map(t => `<tr><td>${esc(t.name)}</td><td>${t.rows == null ? '-' : t.rows.toLocaleString()}</td><td>${t.sizeMb ?? '-'}</td></tr>`).join('');
}

/* ===== 계정 크레딧 잔액·소진 예상일 — 유료 API라 서버가 6시간 캐시 ===== */
async function loadCredits(){
  const data = await fetch('/api/admin/dashboard/credits').then(r => r.json()).catch(() => null);
  if (!data || !data.available) {
    $('creditBox').innerHTML = `<div class="dash-note">${esc(data ? data.message : '크레딧 정보를 불러오지 못했습니다.')}</div>`;
    return;
  }
  const basisLabel = data.dateBasis === 'exhaust' ? '소진 예상' : '만료';
  const days = data.daysRemaining;
  const warn = days != null && days <= 14 ? 'warn' : '';
  $('creditBox').innerHTML = `<div class="credit-box">
    <div class="cell">
      <div class="k">남은 크레딧</div>
      <div class="v">${won((data.totalRemainingKrw ?? 0))} <span style="font-size:11px;color:var(--dim);font-weight:400">($${esc(data.totalRemaining)})</span></div>
    </div>
    <div class="cell">
      <div class="k">${basisLabel}까지</div>
      <div class="v ${warn}">${days != null ? days + '일' : '-'}</div>
    </div>
  </div>
  ${data.targetDate ? `<div class="dash-note">${basisLabel}일: ${esc(data.targetDate)} (현재 사용 속도 기준 AWS 예측치)</div>` : ''}`;
}

/* ===== 프리티어 사용량 — 무료 API라 매번 최신값 조회.
   대부분의 항목이 0%인 건 정상이다 — Glue/SQS/SNS/KMS 등은 EC2·RDS 기반 개인 사이트에서
   거의 쓰지 않는 서비스라 실제 사용량이 거의 없는 것뿐이지 조회가 잘못된 게 아니다. ===== */
async function loadFreeTier(){
  const data = await fetch('/api/admin/dashboard/free-tier').then(r => r.json()).catch(() => null);
  if (!data) { $('freeTierList').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }
  if (!data.available) {
    $('freeTierList').innerHTML = `<div class="empty">${esc(data.message)}</div>`;
    return;
  }
  const all = data.items || [];
  const used = all.filter(it => (it.percent ?? 0) > 0).slice(0, 8);
  if (!used.length) {
    $('freeTierList').innerHTML = `<div class="empty">현재 유의미하게 사용 중인 프리티어 항목이 없습니다.</div>
      <div class="dash-note">AWS Glue·SQS·SNS·KMS 등은 이 사이트(EC2+RDS)에서 거의 쓰지 않는 서비스라 0%로 나오는 게 정상입니다. 실제로 사용 중인 EC2·RDS는 프리티어 한도(750시간/월 등)와 별개로 위 "AWS 인스턴스"·"DB 정보" 패널에서 확인하세요.</div>`;
    return;
  }
  $('freeTierList').innerHTML = used.map(it => {
    const pct = it.percent ?? 0;
    const warn = pct >= 80 ? 'warn' : '';
    return `<div class="ft-item">
      <div class="top"><span class="svc">${esc(it.service)} · ${esc(it.usageType)}</span><span class="pct">${pct}%</span></div>
      <div class="ft-bar"><div class="ft-bar-fill ${warn}" style="width:${Math.min(pct, 100)}%"></div></div>
    </div>`;
  }).join('');
}

/* ===== 최근 7일 일별 비용(원화) — 유료 API라 서버가 6시간 캐시. 프론트는 그 결과를 그대로 그리기만 함 ===== */
let costChart = null;
async function loadCost(){
  const data = await fetch('/api/admin/dashboard/cost').then(r => r.json()).catch(() => null);
  if (!data || !data.available) {
    $('costNote').textContent = data ? data.message : '불러오지 못했습니다.';
    return;
  }
  const points = data.points || [];
  const labels = points.map(p => p.date.substring(5));
  const amountsKrw = points.map(p => p.amountKrw);

  // 오늘/어제 하이라이트 — points는 날짜 오름차순이라 배열 끝 2개가 최신
  const today = points[points.length - 1];
  const yesterday = points[points.length - 2];
  $('todayBox').innerHTML = `
    <div class="cell"><div class="k">오늘</div><div class="v">${won(today ? today.amountKrw : 0)}</div></div>
    <div class="cell"><div class="k">어제</div><div class="v">${won(yesterday ? yesterday.amountKrw : 0)}</div></div>
  `;

  Chart.defaults.color = '#7E8DA9';
  Chart.defaults.borderColor = '#243149';
  Chart.defaults.font.family = "'JetBrains Mono',monospace";
  Chart.defaults.font.size = 10;
  if (costChart) costChart.destroy();
  costChart = new Chart($('costChart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: '일별 비용(원)', data: amountsKrw, backgroundColor: 'rgba(242,169,59,.55)', borderRadius: 3, barPercentage: .6 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false } },
      // min:0을 명시해 0 아래로 내려가지 않게 고정 — beginAtZero만으로는 데이터에 음수가 섞이면
      // 축이 그 아래로 확장돼 기준선이 가운데로 밀려 보인다(이전에 보이던 문제).
      scales: { y: { beginAtZero: true, min: 0, ticks: { callback: v => won(v) } } }
    }
  });
  const total = amountsKrw.reduce((a, b) => a + b, 0);
  $('costNote').textContent = `최근 7일 합계 ${won(total)} · 원/달러 환율 약 1,380원 고정 환산(실시간 환율 아님, 대략적인 참고용) · 6시간마다만 갱신됩니다(Cost Explorer 호출당 과금이라 서버에서 캐시). 오늘 데이터는 AWS 쪽 집계가 하루 이상 늦게 반영되는 경우가 많아 실제보다 낮게 보일 수 있습니다.`;
}

initDashboard();
</script>
</body>
</html>
