<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 · hunit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<style>
.sandbox-note{color:var(--dim);font-size:12.5px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.dash-note{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}
.chart-wrap{height:180px;margin-top:4px}
.expiry-box{display:flex;align-items:baseline;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.expiry-box .num{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--amber)}
.expiry-box .label{font-size:12.5px;color:var(--mut)}
.ft-item{padding:9px 0;border-bottom:1px solid var(--line)}
.ft-item:last-child{border-bottom:0}
.ft-item .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.ft-item .svc{color:var(--ink)}
.ft-item .pct{font-family:var(--mono);color:var(--mut)}
.ft-bar{height:5px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.ft-bar-fill{height:100%;background:var(--amber);border-radius:999px}
.ft-bar-fill.warn{background:var(--red)}
</style>
</head>
<body style="padding-top:0">
<div id="private-nav"></div>

<main>
  <header class="page"><h1>대시보드</h1></header>

  <div id="adminPanels" style="display:none">
    <div class="dash-grid">
      <div class="panel">
        <h2>☁️ AWS 인스턴스</h2>
        <div class="dash-kv" id="awsInfo"><div class="empty">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>🗄️ DB 정보</h2>
        <div class="dash-kv" id="dbInfo"><div class="empty">불러오는 중...</div></div>
        <div class="dash-table-wrap table-scroll">
          <table>
            <thead><tr><th>테이블</th><th>행 수</th><th>용량(MB)</th></tr></thead>
            <tbody id="dbTables"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <h2>💳 프리티어 사용량</h2>
        <div id="ftExpiry"></div>
        <div id="freeTierList"><div class="empty">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>📈 최근 14일 비용(USD)</h2>
        <div class="chart-wrap"><canvas id="costChart"></canvas></div>
        <div class="dash-note" id="costNote"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>기능 모음</h2>
    <div class="sandbox-note">여기에 앞으로 개발할 기능들이 하나씩 추가될 예정입니다.</div>
  </div>
</main>

<script src="/js/private-nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function initDashboard(){
  const me = await fetch('/api/auth/me').then(r => r.json()).catch(() => ({ authenticated: false }));
  if (!me.authenticated) return; // private-nav.js가 /login으로 이미 보냄
  const isAdmin = (me.roles || []).includes('ROLE_ADMIN');
  if (!isAdmin) return;
  $('adminPanels').style.display = 'block';
  loadAws();
  loadDb();
  loadFreeTier();
  loadCost();
}

function kvRow(k, v){
  return `<div class="dash-kv-row"><span class="k">${esc(k)}</span><span class="v">${esc(v ?? '-')}</span></div>`;
}

async function loadAws(){
  const data = await fetch('/api/admin/dashboard/aws').then(r => r.json()).catch(() => null);
  if (!data) { $('awsInfo').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }
  if (!data.available) {
    $('awsInfo').innerHTML = `<div class="empty">${esc(data.message)}</div>`;
    return;
  }
  $('awsInfo').innerHTML = [
    kvRow('인스턴스 ID', data.instanceId),
    kvRow('인스턴스 타입', data.instanceType),
    kvRow('리전', data.region),
    kvRow('가용영역', data.availabilityZone),
    kvRow('퍼블릭 IP', data.publicIp),
    kvRow('프라이빗 IP', data.privateIp),
    kvRow('AMI ID', data.amiId)
  ].join('');
}

async function loadDb(){
  const data = await fetch('/api/admin/dashboard/database').then(r => r.json()).catch(() => null);
  if (!data) { $('dbInfo').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }
  $('dbInfo').innerHTML = [
    kvRow('호스트', data.host),
    kvRow('포트', data.port),
    kvRow('DB명', data.database)
  ].join('') + (data.connected === false ? `<div class="dash-note">${esc(data.message)}</div>` : '');

  const tables = data.tables || [];
  $('dbTables').innerHTML = !tables.length
    ? '<tr><td colspan="3" class="empty">테이블 정보가 없습니다.</td></tr>'
    : tables.map(t => `<tr><td>${esc(t.name)}</td><td>${t.rows == null ? '-' : t.rows.toLocaleString()}</td><td>${t.sizeMb ?? '-'}</td></tr>`).join('');
}

/* ===== 프리티어 사용량 — 무료 API라 매번 최신값 조회 ===== */
async function loadFreeTier(){
  const data = await fetch('/api/admin/dashboard/free-tier').then(r => r.json()).catch(() => null);
  if (!data) { $('freeTierList').innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; return; }

  if (data.daysRemaining != null) {
    $('ftExpiry').innerHTML = `<div class="expiry-box">
      <span class="num">${data.daysRemaining}</span>
      <span class="label">일 남음 · 만료일 ${esc(data.freeTierExpiryDate)}</span>
    </div>`;
  } else if (data.expiryNote) {
    $('ftExpiry').innerHTML = `<div class="dash-note">${esc(data.expiryNote)}</div>`;
  }

  if (!data.available) {
    $('freeTierList').innerHTML = `<div class="empty">${esc(data.message)}</div>`;
    return;
  }
  const items = (data.items || []).slice(0, 8); // 사용량 높은 순 상위 8개만
  $('freeTierList').innerHTML = !items.length
    ? '<div class="empty">사용 중인 프리티어 항목이 없습니다.</div>'
    : items.map(it => {
        const pct = it.percent ?? 0;
        const warn = pct >= 80 ? 'warn' : '';
        return `<div class="ft-item">
          <div class="top"><span class="svc">${esc(it.service)} · ${esc(it.usageType)}</span><span class="pct">${it.percent == null ? '-' : pct + '%'}</span></div>
          <div class="ft-bar"><div class="ft-bar-fill ${warn}" style="width:${Math.min(pct, 100)}%"></div></div>
        </div>`;
      }).join('');
}

/* ===== 일별 비용 — 유료 API라 서버가 6시간 캐시. 프론트는 그 결과를 그대로 그리기만 함 ===== */
let costChart = null;
async function loadCost(){
  const data = await fetch('/api/admin/dashboard/cost').then(r => r.json()).catch(() => null);
  if (!data || !data.available) {
    $('costNote').textContent = data ? data.message : '불러오지 못했습니다.';
    return;
  }
  const points = data.points || [];
  const labels = points.map(p => p.date.substring(5));
  const amounts = points.map(p => p.amount);

  Chart.defaults.color = '#7E8DA9';
  Chart.defaults.borderColor = '#243149';
  Chart.defaults.font.family = "'JetBrains Mono',monospace";
  Chart.defaults.font.size = 10;
  costChart = new Chart($('costChart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: '일별 비용($)', data: amounts, backgroundColor: 'rgba(242,169,59,.55)', borderRadius: 3, barPercentage: .6 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + v } } }
    }
  });
  const total = amounts.reduce((a, b) => a + b, 0);
  $('costNote').textContent = `최근 14일 합계 $${total.toFixed(2)} · 이 데이터는 6시간마다만 갱신됩니다(Cost Explorer 호출당 과금이라 서버에서 캐시)`;
}

initDashboard();
</script>
</body>
</html>
