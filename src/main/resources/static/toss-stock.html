<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOSS 주식 · hunit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
.up{color:#f04452}
.down{color:#3182f6}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:800px){ .summary-grid{grid-template-columns:repeat(2,1fr)} }
.summary-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.summary-cell .k{font-size:11.5px;color:var(--mut);margin-bottom:6px}
.summary-cell .v{font-family:var(--mono);font-size:18px;font-weight:700}
.holding-row td{vertical-align:middle}
.holding-row .name{font-weight:600;color:var(--ink)}
.holding-row .sym{display:block;font-size:11px;color:var(--dim);font-family:var(--mono)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;cursor:pointer}
.tab.on{background:rgba(242,169,59,.12);border-color:var(--amber);color:var(--amber);font-weight:600}
.badge-side{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge-side.BUY{background:rgba(240,68,82,.12);color:var(--red)}
.badge-side.SELL{background:rgba(49,130,246,.12);color:var(--blue)}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){ .calc-grid{grid-template-columns:1fr} }
.calc-result{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:6px}
.calc-result .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.calc-result .row:last-child{border-bottom:0}
.calc-result .row .v{font-family:var(--mono);font-weight:600}
.session-note{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:10px}
</style>
</head>
<body style="padding-top:0">
<div id="private-nav"></div>

<main>
  <header class="page"><h1>📈 TOSS 주식</h1></header>
  <div class="skill-row">
    <span>Java</span><span>토스증권 Open API(계좌·자산 조회)</span><span>조회 전용(매수·매도 미구현)</span>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <h2>보유 종목</h2>
    <div id="summaryBox" class="summary-grid"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>종목</th><th>수량</th><th>평단가</th><th>현재가</th><th>평가금액</th><th>손익</th></tr></thead>
        <tbody id="holdingsBody"><tr><td colspan="6"><div class="empty">불러오는 중...</div></td></tr></tbody>
      </table>
    </div>
    <div id="holdingsMsg"></div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <h2>주문 내역</h2>
    <div class="tabs">
      <button class="tab on" data-v="CLOSED" onclick="selectOrderTab('CLOSED')">체결·종료</button>
      <button class="tab" data-v="OPEN" onclick="selectOrderTab('OPEN')">진행중</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>일시</th><th>종목</th><th>구분</th><th>가격</th><th>수량</th><th>상태</th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="6"><div class="empty">불러오는 중...</div></td></tr></tbody>
      </table>
    </div>
    <div id="ordersMsg"></div>
    <div class="session-note">국내 주식은 KRX 정규장 외에 넥스트(NXT) 대체거래소 체결 시간대가 별도로 있고, 미국 주식은 프리마켓·정규장·애프터마켓 3단계로 나뉩니다 — 위 주문 시각은 체결된 시장 구분 없이 토스증권이 내려주는 시각 그대로 표시합니다.</div>
  </div>

  <div class="panel">
    <h2>물타기 계산기</h2>
    <div class="calc-grid">
      <div>
        <label>현재 보유 수량</label>
        <input type="number" id="calcQty" min="0" step="any" placeholder="예: 10">
        <label>현재 평단가</label>
        <input type="number" id="calcAvg" min="0" step="any" placeholder="예: 15000">
        <label>추가 매수 수량</label>
        <input type="number" id="calcAddQty" min="0" step="any" placeholder="예: 10">
        <label>추가 매수 가격</label>
        <input type="number" id="calcAddPrice" min="0" step="any" placeholder="예: 12000">
        <button class="btn btn-amber" style="margin-top:14px" onclick="calcAverage()">계산하기</button>
      </div>
      <div>
        <label style="margin-top:0">결과</label>
        <div class="calc-result" id="calcResult">
          <div class="row"><span>왼쪽에 값을 입력하고 계산하기를 눌러주세요</span></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/private-nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fmtMoney(v, currency){
  if (v == null) return '-';
  const symbol = currency === 'USD' ? '$' : '';
  const suffix = currency === 'USD' ? '' : '원';
  return symbol + Math.round(v).toLocaleString('ko-KR') + suffix;
}
function fmtRate(v){
  if (v == null) return '-';
  const cls = v > 0 ? 'up' : v < 0 ? 'down' : '';
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}

async function loadHoldings(){
  const data = await fetch('/api/admin/portfolio/holdings').then(r => r.json()).catch(() => null);
  if (!data || !data.available) {
    $('holdingsMsg').innerHTML = `<div class="empty">${esc(data ? data.message : '불러오지 못했습니다.')}</div>`;
    $('holdingsBody').innerHTML = '';
    $('summaryBox').innerHTML = '';
    return;
  }
  $('summaryBox').innerHTML = `
    <div class="summary-cell"><div class="k">투자원금</div><div class="v">${fmtMoney(data.totalPurchaseAmount, 'KRW')}</div></div>
    <div class="summary-cell"><div class="k">평가금액</div><div class="v">${fmtMoney(data.totalMarketValue, 'KRW')}</div></div>
    <div class="summary-cell"><div class="k">평가손익</div><div class="v">${fmtMoney(data.totalProfitLossAmount, 'KRW')}</div></div>
    <div class="summary-cell"><div class="k">수익률</div><div class="v">${fmtRate(data.totalProfitLossRate)}</div></div>
  `;
  const items = data.items || [];
  $('holdingsBody').innerHTML = !items.length
    ? '<tr><td colspan="6"><div class="empty">보유 중인 종목이 없습니다.</div></td></tr>'
    : items.map(it => `
      <tr class="holding-row">
        <td><span class="name">${esc(it.name)}</span><span class="sym">${esc(it.symbol)} · ${esc(it.marketCountry)}</span></td>
        <td>${it.quantity}</td>
        <td>${fmtMoney(it.averagePurchasePrice, it.currency)}</td>
        <td>${fmtMoney(it.lastPrice, it.currency)}</td>
        <td>${fmtMoney(it.marketValue, it.currency)}</td>
        <td>${fmtMoney(it.profitLossAmount, it.currency)}<br>${fmtRate(it.profitLossRate)}</td>
      </tr>`).join('');
}

let orderTab = 'CLOSED';
function selectOrderTab(v){
  orderTab = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  loadOrders();
}

const fmtDate = t => t ? t.toString().replace('T', ' ').substring(0, 16) : '-';
async function loadOrders(){
  const data = await fetch(`/api/admin/portfolio/orders?status=${orderTab}`).then(r => r.json()).catch(() => null);
  if (!data || !data.available) {
    $('ordersMsg').innerHTML = `<div class="empty">${esc(data ? data.message : '불러오지 못했습니다.')}</div>`;
    $('ordersBody').innerHTML = '';
    return;
  }
  $('ordersMsg').innerHTML = '';
  const orders = data.orders || [];
  $('ordersBody').innerHTML = !orders.length
    ? '<tr><td colspan="6"><div class="empty">주문 내역이 없습니다.</div></td></tr>'
    : orders.map(o => `
      <tr>
        <td>${fmtDate(o.orderedAt)}</td>
        <td>${esc(o.symbol)}</td>
        <td><span class="badge-side ${esc(o.side)}">${o.side === 'BUY' ? '매수' : '매도'}</span></td>
        <td>${o.price != null ? fmtMoney(o.price, o.currency) : '시장가'}</td>
        <td>${o.quantity}${o.filledQuantity ? ` (체결 ${o.filledQuantity})` : ''}</td>
        <td>${esc(o.status)}</td>
      </tr>`).join('');
}

/* ===== 물타기 계산기 — 순수 프론트엔드 계산, API 호출 없음 =====
   새 평단가 = (기존 수량×기존 평단가 + 추가 수량×추가 매수가) / (기존 수량 + 추가 수량) */
function calcAverage(){
  const qty = parseFloat($('calcQty').value) || 0;
  const avg = parseFloat($('calcAvg').value) || 0;
  const addQty = parseFloat($('calcAddQty').value) || 0;
  const addPrice = parseFloat($('calcAddPrice').value) || 0;

  if (qty + addQty <= 0) {
    $('calcResult').innerHTML = '<div class="row"><span>수량을 입력해주세요</span></div>';
    return;
  }
  const totalQty = qty + addQty;
  const totalCost = qty * avg + addQty * addPrice;
  const newAvg = totalCost / totalQty;
  const avgChangeRate = avg > 0 ? ((newAvg - avg) / avg) * 100 : 0;

  $('calcResult').innerHTML = `
    <div class="row"><span>총 보유 수량</span><span class="v">${totalQty.toLocaleString()}주</span></div>
    <div class="row"><span>총 매수 금액</span><span class="v">${Math.round(totalCost).toLocaleString()}원</span></div>
    <div class="row"><span>새 평단가</span><span class="v">${Math.round(newAvg).toLocaleString()}원</span></div>
    <div class="row"><span>평단가 변화</span><span class="v ${avgChangeRate < 0 ? 'down' : 'up'}">${avgChangeRate >= 0 ? '+' : ''}${avgChangeRate.toFixed(2)}%</span></div>
  `;
}

loadHoldings();
loadOrders();
</script>
</body>
</html>
