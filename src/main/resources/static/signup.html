<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 · hunit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/css/base.css">
<style>
body{padding-top:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.auth-wrap{width:100%;max-width:400px;padding:24px}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
.auth-title{font-size:19px;font-weight:700;margin-bottom:4px}
.auth-sub{color:var(--dim);font-size:12.5px;margin-bottom:22px}
.auth-msg{font-size:12.5px;border-radius:8px;padding:9px 12px;margin-bottom:14px;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:rgba(241,96,99,.1);color:var(--red);border:1px solid rgba(241,96,99,.3)}
.auth-msg.ok{background:rgba(62,207,142,.1);color:var(--green);border:1px solid rgba(62,207,142,.3)}
.field-hint{font-size:11px;color:var(--dim);margin-top:4px}
.auth-links{text-align:center;margin-top:14px;font-size:12.5px}
.auth-links a{color:var(--mut)}
.auth-links a:hover{color:var(--amber)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">📝 회원가입</div>
    <div class="auth-sub">가입 신청 후 관리자 승인이 완료되면 로그인할 수 있습니다</div>
    <div class="auth-msg err" id="signupErr"></div>
    <div class="auth-msg ok" id="signupOk"></div>

    <form id="signupForm" onsubmit="submitSignup(event)">
      <label>아이디</label>
      <input type="text" id="username" required>
      <div class="field-hint">영문/숫자/밑줄 4~20자</div>

      <label>비밀번호</label>
      <input type="password" id="password" required>
      <div class="field-hint">8자 이상</div>

      <label>비밀번호 확인</label>
      <input type="password" id="password2" required>

      <label>이름</label>
      <input type="text" id="name" required>

      <label>휴대폰 번호</label>
      <input type="text" id="phone" placeholder="010-1234-5678" required>

      <label>이메일</label>
      <input type="email" id="email" required>
      <div class="field-hint">비밀번호를 잊었을 때 인증에 사용됩니다</div>

      <button class="btn btn-amber" type="submit" style="width:100%;margin-top:18px">가입 신청</button>
    </form>

    <div class="auth-links"><a href="/login">이미 계정이 있으신가요? 로그인</a></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function submitSignup(e){
  e.preventDefault();
  $('signupErr').classList.remove('show');
  $('signupOk').classList.remove('show');

  const password = $('password').value;
  if (password !== $('password2').value) {
    $('signupErr').textContent = '비밀번호가 서로 일치하지 않습니다';
    $('signupErr').classList.add('show');
    return;
  }

  const body = {
    username: $('username').value.trim(),
    password,
    name: $('name').value.trim(),
    phone: $('phone').value.trim(),
    email: $('email').value.trim()
  };

  const res = await fetch('/api/auth/signup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => r.json());

  if (!res.success) {
    $('signupErr').textContent = res.message;
    $('signupErr').classList.add('show');
    return;
  }
  $('signupOk').textContent = res.message;
  $('signupOk').classList.add('show');
  $('signupForm').reset();
}
</script>
</body>
</html>
