<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 에디터 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<!-- React 템플릿의 JSX를 iframe에 넣기 전에 이 페이지(부모)에서 미리 변환하는 데 사용한다.
     버전을 @7로 고정한다 — 버전을 안 박은 최신 URL(.../standalone/babel.min.js)이 최근
     Babel 8 릴리스 이후 깨져서(Babel 저장소에도 관련 이슈 등록됨) React 예제가 전부
     실행되지 않는 원인이었다. 안정적인 7 계열로 고정해 이 문제를 피한다. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<style>
.we-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.we-input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px}
.we-input:focus{outline:none;border-color:var(--amber)}
.we-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;cursor:pointer;font-weight:600}
.we-btn:hover{color:var(--amber);border-color:var(--amber)}
.we-btn.primary{background:var(--amber);color:#131A2A;border:0}
.we-btn.primary:hover{filter:brightness(1.08);color:#131A2A}
.we-btn:disabled{opacity:.4;cursor:default}
.we-btn:disabled:hover{color:var(--mut);border-color:var(--line)}
.we-btn.sm{padding:4px 10px;font-size:11.5px}

.we-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){ .we-layout{grid-template-columns:1fr} }

.we-editor-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.we-tabs{display:flex;gap:2px;background:var(--panel-2);border-bottom:1px solid var(--line);padding:6px 6px 0}
.we-tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;background:transparent}
.we-tab.on{background:var(--panel);color:var(--amber)}
.we-monaco-wrap{position:relative;height:420px}
.we-monaco-pane{position:absolute;inset:0}

.we-preview-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.we-preview-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.we-preview-frame{width:100%;height:420px;border:0;background:#fff}

.we-libs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.we-lib-chip{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:11.5px;font-family:var(--mono);color:var(--mut);max-width:280px}
.we-lib-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we-lib-chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.we-lib-chip button:hover{color:#f88}

.we-note{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}

.we-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.we-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.we-card:hover{border-color:var(--amber)}
.we-card .tmpl{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(242,169,59,.35);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.we-card .ttl{font-size:13.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we-card .dt{font-size:11px;color:var(--dim);margin-top:5px}

.we-loaded-banner{background:rgba(242,169,59,.08);border:1px solid rgba(242,169,59,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:12px}
.we-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--amber);color:#131A2A;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:400;box-shadow:0 8px 20px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page"><h1>💻 웹 에디터</h1></header>
  <div class="skill-row">
    <span>Monaco Editor</span><span>Vue.js 3</span><span>React(Babel Standalone)</span><span>Spring Boot</span><span>MySQL</span>
  </div>

  <div id="editorApp"></div>
</main>

<script type="text/x-template" id="we-tpl">
  <div>
    <div v-if="loadedFrom" class="we-loaded-banner">
      '{{ loadedFrom }}'을(를) 불러왔습니다. 수정 후 저장하면 새 코드로 등록됩니다(기존 코드는 그대로 유지).
    </div>

    <div class="we-toolbar">
      <input class="we-input" v-model="title" placeholder="제목 (예: 카드 뒤집기 애니메이션)" style="flex:1;min-width:180px">
      <select class="we-input" v-model="template" @change="onTemplateChange">
        <option value="HTML_CSS_JS">HTML/CSS/JS</option>
        <option value="VUE">Vue 3</option>
        <option value="REACT">React</option>
      </select>
      <select class="we-input" @change="loadExample($event.target.value); $event.target.value=''">
        <option value="">예제 불러오기...</option>
        <option v-for="ex in currentExamples" :key="ex.name" :value="ex.name">{{ ex.name }}</option>
      </select>
      <button class="we-btn primary" @click="run">▶ 실행</button>
      <button class="we-btn" @click="openInNewWindow">↗ 새 창에서 보기</button>
      <button class="we-btn" @click="save" :disabled="saving">{{ saving ? '저장 중...' : '저장' }}</button>
    </div>

    <div class="we-libs">
      <span style="font-size:12px;color:var(--mut);font-weight:600">외부 라이브러리</span>
      <input class="we-input" v-model="libInput" @keyup.enter="addLib" placeholder="CDN URL 붙여넣고 Enter (예: https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js)" style="flex:1;min-width:220px">
      <button class="we-btn sm" @click="addLib">추가</button>
      <span v-for="(lib, i) in libs" :key="i" class="we-lib-chip">
        <span :title="lib">{{ lib }}</span>
        <button @click="libs.splice(i,1)">×</button>
      </span>
    </div>

    <div class="we-layout">
      <div class="we-editor-card">
        <div class="we-tabs">
          <div class="we-tab" :class="{on: pane==='html'}" @click="pane='html'">HTML</div>
          <div class="we-tab" :class="{on: pane==='css'}" @click="pane='css'">CSS</div>
          <div class="we-tab" :class="{on: pane==='js'}" @click="pane='js'">{{ template === 'REACT' ? 'JS (JSX)' : 'JS' }}</div>
        </div>
        <div class="we-monaco-wrap">
          <div class="we-monaco-pane" v-show="pane==='html'" ref="elHtml"></div>
          <div class="we-monaco-pane" v-show="pane==='css'" ref="elCss"></div>
          <div class="we-monaco-pane" v-show="pane==='js'" ref="elJs"></div>
        </div>
      </div>
      <div class="we-preview-card">
        <div class="we-preview-head">
          <span>미리보기 (0.6초 후 자동 실행, 또는 ▶ 실행 클릭)</span>
        </div>
        <iframe class="we-preview-frame" ref="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
      </div>
    </div>

    <div class="we-note">※ HTML/CSS/JS는 브라우저에서 자체적으로 문법 오류를 표시합니다(특히 JS는 실제 문법 오류에 빨간 밑줄). 실행은 격리된 iframe에서만 이루어지며 이 페이지의 다른 데이터에 접근하지 못합니다. 저장은 로그인 없이 공개로 등록되며(CodePen과 동일한 방식), 누구나 볼 수 있습니다.</div>

    <h2 style="font-size:16px;margin-top:28px;margin-bottom:4px">🌐 최근 공유된 코드</h2>
    <div class="we-list-grid">
      <button v-for="s in list" :key="s.id" class="we-card" @click="loadSnippet(s.id)">
        <div class="tmpl">{{ templateLabel(s.template) }}</div>
        <div class="ttl">{{ s.title }}</div>
        <div class="dt">{{ formatDate(s.createdAt) }}</div>
      </button>
      <div v-if="!list.length" style="color:var(--dim);font-size:12.5px;padding:12px">아직 공유된 코드가 없습니다. 첫 번째로 저장해보세요!</div>
    </div>

    <div v-if="toast" class="we-toast">{{ toast }}</div>
  </div>
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
<script src="/js/nav.js"></script>
<script>
(function(){
  const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;

  /* ===================================================
     Monaco Editor 로딩 — AMD 로더(require.js 방식)로 CDN에서 받아온다.
     window.monacoReady가 true가 되면 monaco 전역 객체를 쓸 수 있다.
     =================================================== */
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  window.monacoReadyPromise = new Promise((resolve) => {
    require(['vs/editor/editor.main'], function () { resolve(); });
  });

  /* ===================================================
     템플릿별 예제 — 처음 시작이 막막하지 않도록 언어/프레임워크별로 미리 넣어둔다.
     새 예제를 추가하려면 이 객체에 { name, html, css, js } 한 항목만 추가하면 된다.
     =================================================== */
  const EXAMPLES = {
    HTML_CSS_JS: [
      {
        name: 'Hello World',
        html: '<h1 id="title">Hello, Web!</h1>\n<p>HTML을 고치고 오른쪽 미리보기를 확인해보세요.</p>',
        css: 'body{font-family:sans-serif;padding:20px;background:#0b101b;color:#eef1f8}\n#title{color:#f2a93b}',
        js: 'console.log("스크립트가 실행됩니다. 우클릭 → 검사 → Console에서 확인해보세요.");'
      },
      {
        name: 'DOM 이벤트 다루기 (카운터)',
        html: '<button id="btn">클릭 횟수: <span id="count">0</span></button>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b}\nbutton{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'let count = 0;\nconst countEl = document.getElementById("count");\ndocument.getElementById("btn").addEventListener("click", () => {\n  count++;\n  countEl.textContent = count;\n});'
      },
      {
        name: 'CSS 애니메이션 (바운스)',
        html: '<div class="box"></div>',
        css: 'body{background:#0b101b;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}\n.box{width:60px;height:60px;background:#f2a93b;border-radius:12px;animation:bounce 1s infinite alternate}\n@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-40px)}}',
        js: ''
      },
      {
        name: 'Fetch API로 데이터 가져오기',
        html: '<button id="loadBtn">사용자 목록 불러오기</button>\n<ul id="list"></ul>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-bottom:12px}\nli{padding:4px 0}',
        js: 'document.getElementById("loadBtn").addEventListener("click", async () => {\n  const list = document.getElementById("list");\n  list.innerHTML = "불러오는 중...";\n  try {\n    const res = await fetch("https://jsonplaceholder.typicode.com/users?_limit=5");\n    const users = await res.json();\n    list.innerHTML = users.map(u => `<li>${u.name} (${u.email})</li>`).join("");\n  } catch (e) {\n    list.innerHTML = "불러오기 실패: " + e.message;\n  }\n});'
      },
      {
        name: 'LocalStorage 메모장',
        html: '<textarea id="note" placeholder="메모를 입력하면 자동 저장됩니다" rows="6" style="width:100%;box-sizing:border-box"></textarea>\n<div id="status"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ntextarea{background:#161d2e;color:#eef1f8;border:1px solid #2a3348;border-radius:8px;padding:10px}\n#status{font-size:12px;color:#9aa4bb;margin-top:6px}',
        js: 'const note = document.getElementById("note");\nconst status = document.getElementById("status");\nnote.value = localStorage.getItem("myNote") || "";\nnote.addEventListener("input", () => {\n  localStorage.setItem("myNote", note.value);\n  status.textContent = "저장됨 · " + new Date().toLocaleTimeString();\n});'
      },
      {
        name: 'Flexbox 카드 레이아웃',
        html: '<div class="cards">\n  <div class="card">카드 1</div>\n  <div class="card">카드 2</div>\n  <div class="card">카드 3</div>\n</div>',
        css: 'body{background:#0b101b;padding:24px;margin:0;font-family:sans-serif}\n.cards{display:flex;gap:12px;flex-wrap:wrap}\n.card{flex:1 1 150px;background:#161d2e;border:1px solid #2a3348;border-radius:10px;padding:20px;color:#eef1f8;text-align:center}',
        js: ''
      },
      {
        name: 'CSS Grid 대시보드 레이아웃',
        html: '<div class="grid">\n  <header>헤더</header>\n  <nav>사이드바</nav>\n  <main>본문</main>\n  <footer>푸터</footer>\n</div>',
        css: 'body{margin:0;background:#0b101b;font-family:sans-serif;color:#eef1f8}\n.grid{display:grid;grid-template-columns:150px 1fr;grid-template-rows:60px 1fr 40px;height:100vh;gap:2px}\nheader{grid-column:1/3;background:#f2a93b;color:#131A2A;display:flex;align-items:center;padding:0 16px}\nnav{background:#161d2e;padding:16px}\nmain{background:#0f1522;padding:16px}\nfooter{grid-column:1/3;background:#161d2e;display:flex;align-items:center;padding:0 16px;font-size:12px;color:#9aa4bb}',
        js: ''
      },
      {
        name: '폼 검증',
        html: '<form id="form">\n  <input id="email" type="text" placeholder="이메일">\n  <div id="msg"></div>\n  <button type="submit">제출</button>\n</form>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8;width:200px}\n#msg{font-size:12px;color:#f88;margin:6px 0}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'document.getElementById("form").addEventListener("submit", (e) => {\n  e.preventDefault();\n  const email = document.getElementById("email").value;\n  const msg = document.getElementById("msg");\n  const ok = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);\n  msg.textContent = ok ? "" : "올바른 이메일 형식이 아닙니다.";\n  msg.style.color = ok ? "#a5e0a5" : "#f88";\n  if (ok) alert("제출되었습니다: " + email);\n});'
      }
    ],
    VUE: [
      {
        name: 'Vue 3 카운터',
        html: '<div id="app">\n  <button @click="count++">클릭 횟수: {{ count }}</button>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const count = ref(0);\n    return { count };\n  }\n}).mount("#app");'
      },
      {
        name: 'Vue 3 할 일 목록',
        html: '<div id="app">\n  <input v-model="text" @keyup.enter="add" placeholder="할 일 입력 후 Enter">\n  <ul>\n    <li v-for="(t, i) in todos" :key="i">{{ t }} <button @click="todos.splice(i,1)">삭제</button></li>\n  </ul>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nli{margin:6px 0}',
        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const text = ref("");\n    const todos = ref([]);\n    function add() {\n      if (!text.value.trim()) return;\n      todos.value.push(text.value);\n      text.value = "";\n    }\n    return { text, todos, add };\n  }\n}).mount("#app");'
      },
      {
        name: 'computed/watch 실시간 계산기',
        html: '<div id="app">\n  <input v-model.number="a" type="number"> + <input v-model.number="b" type="number"> = {{ sum }}\n  <p>{{ message }}</p>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{width:60px;padding:6px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}',
        js: 'const { createApp, ref, computed, watch } = Vue;\ncreateApp({\n  setup() {\n    const a = ref(0);\n    const b = ref(0);\n    const sum = computed(() => a.value + b.value);\n    const message = ref("");\n    watch(sum, (newVal) => {\n      message.value = newVal > 100 ? "합계가 100을 넘었습니다!" : "";\n    });\n    return { a, b, sum, message };\n  }\n}).mount("#app");'
      },
      {
        name: '탭 UI (v-if/v-show)',
        html: '<div id="app">\n  <button v-for="t in tabs" :key="t" @click="active = t" :class="{on: active===t}">{{ t }}</button>\n  <div v-show="active===\'A\'">A 탭 내용입니다.</div>\n  <div v-show="active===\'B\'">B 탭 내용입니다.</div>\n  <div v-show="active===\'C\'">C 탭 내용입니다.</div>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:6px 14px;margin-right:6px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#9aa4bb;cursor:pointer}\nbutton.on{background:#f2a93b;color:#131A2A;border-color:#f2a93b}',
        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const tabs = ["A", "B", "C"];\n    const active = ref("A");\n    return { tabs, active };\n  }\n}).mount("#app");'
      },
      {
        name: '컴포넌트 분리 + props/emit',
        html: '<div id="app">\n  <child-item v-for="n in items" :key="n" :label="n" @remove="remove(n)"></child-item>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.item{display:flex;justify-content:space-between;padding:8px;background:#161d2e;border-radius:6px;margin-bottom:6px}\nbutton{border:0;background:transparent;color:#f88;cursor:pointer}',
        js: 'const { createApp, ref } = Vue;\n\nconst ChildItem = {\n  props: ["label"],\n  emits: ["remove"],\n  template: \'<div class="item">{{ label }} <button @click="$emit(\\\'remove\\\')">삭제</button></div>\'\n};\n\ncreateApp({\n  components: { ChildItem },\n  setup() {\n    const items = ref(["사과", "바나나", "체리"]);\n    function remove(n) {\n      items.value = items.value.filter(i => i !== n);\n    }\n    return { items, remove };\n  }\n}).mount("#app");'
      },
      {
        name: 'Fetch로 비동기 데이터 로딩',
        html: '<div id="app">\n  <button @click="load" :disabled="loading">{{ loading ? "불러오는 중..." : "불러오기" }}</button>\n  <ul>\n    <li v-for="u in users" :key="u.id">{{ u.name }}</li>\n  </ul>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const users = ref([]);\n    const loading = ref(false);\n    async function load() {\n      loading.value = true;\n      const res = await fetch("https://jsonplaceholder.typicode.com/users?_limit=5");\n      users.value = await res.json();\n      loading.value = false;\n    }\n    return { users, loading, load };\n  }\n}).mount("#app");'
      },
      {
        name: 'Composition API 스톱워치',
        html: '<div id="app">\n  <h2>{{ formatted }}</h2>\n  <button @click="toggle">{{ running ? "정지" : "시작" }}</button>\n  <button @click="reset">리셋</button>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\nbutton{padding:8px 16px;margin:4px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { createApp, ref, computed, onUnmounted } = Vue;\ncreateApp({\n  setup() {\n    const seconds = ref(0);\n    const running = ref(false);\n    let timer = null;\n    const formatted = computed(() => {\n      const m = String(Math.floor(seconds.value / 60)).padStart(2, "0");\n      const s = String(seconds.value % 60).padStart(2, "0");\n      return m + ":" + s;\n    });\n    function toggle() {\n      running.value = !running.value;\n      if (running.value) timer = setInterval(() => seconds.value++, 1000);\n      else clearInterval(timer);\n    }\n    function reset() {\n      seconds.value = 0;\n      running.value = false;\n      clearInterval(timer);\n    }\n    onUnmounted(() => clearInterval(timer));\n    return { formatted, running, toggle, reset };\n  }\n}).mount("#app");'
      }
    ],
    REACT: [
      {
        name: 'React 카운터',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { useState } = React;\n\nfunction Counter() {\n  const [count, setCount] = useState(0);\n  return (\n    <button onClick={() => setCount(count + 1)}>\n      클릭 횟수: {count}\n    </button>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<Counter />);'
      },
      {
        name: 'React 할 일 목록',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nli{margin:6px 0}',
        js: 'const { useState } = React;\n\nfunction TodoApp() {\n  const [text, setText] = useState("");\n  const [todos, setTodos] = useState([]);\n\n  function add() {\n    if (!text.trim()) return;\n    setTodos([...todos, text]);\n    setText("");\n  }\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)}\n             onKeyUp={e => e.key === "Enter" && add()}\n             placeholder="할 일 입력 후 Enter" />\n      <ul>\n        {todos.map((t, i) => (\n          <li key={i}>{t} <button onClick={() => setTodos(todos.filter((_, j) => j !== i))}>삭제</button></li>\n        ))}\n      </ul>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<TodoApp />);'
      },
      {
        name: 'useEffect로 데이터 로딩',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}',
        js: 'const { useState, useEffect } = React;\n\nfunction UserList() {\n  const [users, setUsers] = useState([]);\n  const [loading, setLoading] = useState(true);\n\n  useEffect(() => {\n    fetch("https://jsonplaceholder.typicode.com/users?_limit=5")\n      .then(res => res.json())\n      .then(data => {\n        setUsers(data);\n        setLoading(false);\n      });\n  }, []);\n\n  if (loading) return <p>불러오는 중...</p>;\n  return (\n    <ul>\n      {users.map(u => <li key={u.id}>{u.name}</li>)}\n    </ul>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<UserList />);'
      },
      {
        name: '커스텀 훅 (useToggle)',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { useState } = React;\n\nfunction useToggle(initial = false) {\n  const [value, setValue] = useState(initial);\n  const toggle = () => setValue(v => !v);\n  return [value, toggle];\n}\n\nfunction App() {\n  const [isOpen, toggleOpen] = useToggle(false);\n  return (\n    <div>\n      <button onClick={toggleOpen}>{isOpen ? "닫기" : "열기"}</button>\n      {isOpen && <p>내용이 열렸습니다!</p>}\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'
      },
      {
        name: 'Context API로 상태 공유',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { useState, createContext, useContext } = React;\n\nconst ThemeContext = createContext(null);\n\nfunction ThemedButton() {\n  const { dark, setDark } = useContext(ThemeContext);\n  return (\n    <button onClick={() => setDark(!dark)}>\n      현재 테마: {dark ? "다크" : "라이트"} (클릭해서 전환)\n    </button>\n  );\n}\n\nfunction App() {\n  const [dark, setDark] = useState(true);\n  return (\n    <ThemeContext.Provider value={{ dark, setDark }}>\n      <ThemedButton />\n    </ThemeContext.Provider>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'
      },
      {
        name: '폼 상태 관리 + 검증',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-left:6px}\n.err{color:#f88;font-size:12px}',
        js: 'const { useState } = React;\n\nfunction SignupForm() {\n  const [email, setEmail] = useState("");\n  const [error, setError] = useState("");\n\n  function handleSubmit(e) {\n    e.preventDefault();\n    const ok = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);\n    setError(ok ? "" : "올바른 이메일 형식이 아닙니다.");\n    if (ok) alert("제출됨: " + email);\n  }\n\n  return (\n    <form onSubmit={handleSubmit}>\n      <input value={email} onChange={e => setEmail(e.target.value)} placeholder="이메일" />\n      <button type="submit">제출</button>\n      {error && <p className="err">{error}</p>}\n    </form>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<SignupForm />);'
      },
      {
        name: 'useRef로 포커스 관리',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-left:6px}',
        js: 'const { useRef } = React;\n\nfunction FocusInput() {\n  const inputRef = useRef(null);\n  function focus() {\n    inputRef.current.focus();\n  }\n  return (\n    <div>\n      <input ref={inputRef} placeholder="여기를 포커스" />\n      <button onClick={focus}>포커스 주기</button>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<FocusInput />);'
      }
    ]
  };
  const TEMPLATE_LABELS = { HTML_CSS_JS: 'HTML/CSS/JS', VUE: 'Vue 3', REACT: 'React' };

  const App = {
    template: '#we-tpl',
    setup(){
      const title = ref('');
      const template = ref('HTML_CSS_JS');
      const pane = ref('html');
      const libs = reactive([]);
      const libInput = ref('');
      const saving = ref(false);
      const toast = ref('');
      const list = ref([]);
      const loadedFrom = ref('');

      const elHtml = ref(null), elCss = ref(null), elJs = ref(null), preview = ref(null);
      let editors = { html: null, css: null, js: null };
      let debounceTimer = null;

      const currentExamples = computed(() => EXAMPLES[template.value] || []);
      function templateLabel(t){ return TEMPLATE_LABELS[t] || t; }
      function formatDate(iso){
        try { return new Date(iso).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }); }
        catch (e) { return iso; }
      }

      function showToast(msg){
        toast.value = msg;
        setTimeout(() => { toast.value = ''; }, 2200);
      }

      /* ===== Monaco 초기화 ===== */
      async function initMonaco(){
        await window.monacoReadyPromise;
        const commonOpts = { theme: 'vs-dark', automaticLayout: true, minimap: { enabled: false }, fontSize: 13, tabSize: 2, wordWrap: 'on' };
        editors.html = monaco.editor.create(elHtml.value, { value: '', language: 'html', ...commonOpts });
        editors.css = monaco.editor.create(elCss.value, { value: '', language: 'css', ...commonOpts });
        editors.js = monaco.editor.create(elJs.value, { value: '', language: 'javascript', ...commonOpts });
        [editors.html, editors.css, editors.js].forEach(ed => {
          ed.onDidChangeModelContent(() => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(run, 600);
          });
        });
        loadExample(currentExamples.value[0] && currentExamples.value[0].name);
      }

      function setCode(html, css, js){
        if (editors.html) editors.html.setValue(html || '');
        if (editors.css) editors.css.setValue(css || '');
        if (editors.js) editors.js.setValue(js || '');
      }
      function getCode(){
        return {
          html: editors.html ? editors.html.getValue() : '',
          css: editors.css ? editors.css.getValue() : '',
          js: editors.js ? editors.js.getValue() : ''
        };
      }

      function loadExample(name){
        const ex = currentExamples.value.find(e => e.name === name) || currentExamples.value[0];
        if (!ex) return;
        setCode(ex.html, ex.css, ex.js);
        run();
      }

      function onTemplateChange(){
        loadedFrom.value = '';
        loadExample(currentExamples.value[0] && currentExamples.value[0].name);
      }

      /* ===== 라이브러리 ===== */
      function addLib(){
        const v = libInput.value.trim();
        if (!v) return;
        if (!/^https?:\/\//.test(v)) { showToast('http(s):// 로 시작하는 URL을 입력해주세요.'); return; }
        libs.push(v);
        libInput.value = '';
        run();
      }

      /* ===== 실행 (미리보기 문서 생성) =====
         React는 iframe 안에서 Babel이 자동으로 <script type="text/babel">을 스캔해 변환하는
         방식 대신, 이 부모 페이지에 로드된 Babel Standalone으로 미리 순수 JS로 변환해서 넣는다
         — iframe.srcdoc을 매번 새로 그리는 환경에서는 iframe 내부 DOMContentLoaded 타이밍이
         어긋나 자동 스캔이 누락되는 경우가 있어(React 예제가 항상 빈 화면으로 보이던 원인),
         변환을 우리가 직접 제어해 항상 순수 JS만 iframe에 넘기는 쪽이 안정적이다. */
      function buildDoc(){
        const { html, css, js } = getCode();
        const libScripts = libs.map(u => '<script src="' + u.replace(/"/g, '&quot;') + '"><' + '/script>').join('\n');
        let frameworkScripts = '';
        let jsTag;
        if (template.value === 'VUE') {
          frameworkScripts = '<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><' + '/script>';
          jsTag = '<script>' + js + '<' + '/script>';
        } else if (template.value === 'REACT') {
          frameworkScripts =
            '<script src="https://unpkg.com/react@18/umd/react.production.min.js"><' + '/script>' +
            '<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><' + '/script>';
          let transformed;
          try {
            transformed = Babel.transform(js, { presets: ['react'] }).code;
          } catch (e) {
            const errMsg = String(e.message || e).replace(/"/g, '\\"').replace(/\n/g, ' ');
            transformed = 'document.body.innerHTML = "<pre style=\\"color:#f88;padding:16px;white-space:pre-wrap\\">JSX 문법 오류: ' + errMsg + '</pre>";';
          }
          jsTag = '<script>' + transformed + '<' + '/script>';
        } else {
          jsTag = '<script>' + js + '<' + '/script>';
        }
        return '<!DOCTYPE html><html><head><meta charset="utf-8">'
          + '<style>' + css + '</style>'
          + frameworkScripts + libScripts
          + '</head><body>' + html + jsTag + '</body></html>';
      }

      function run(){
        if (!preview.value) return;
        preview.value.srcdoc = buildDoc();
      }

      function openInNewWindow(){
        const blob = new Blob([buildDoc()], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }

      /* ===== 저장 ===== */
      async function save(){
        if (!title.value.trim()) { showToast('제목을 입력해주세요.'); return; }
        saving.value = true;
        try {
          const { html, css, js } = getCode();
          const res = await fetch('/api/webeditor/snippets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title.value.trim(), template: template.value, html, css, js, libs: [...libs] })
          });
          const data = await res.json();
          if (!res.ok) { showToast(data.error || '저장에 실패했습니다.'); return; }
          history.pushState(null, '', '/editor/' + data.id);
          loadedFrom.value = '';
          showToast('저장되었습니다! 이 코드는 이제 공개 목록에서 누구나 볼 수 있습니다.');
          fetchList();
        } catch (e) {
          showToast('저장 중 오류가 발생했습니다.');
        } finally {
          saving.value = false;
        }
      }

      /* ===== 목록/불러오기 ===== */
      async function fetchList(){
        try {
          const res = await fetch('/api/webeditor/snippets?limit=30');
          list.value = await res.json();
        } catch (e) { /* 무시 — 목록만 못 보여줄 뿐 에디터 자체는 계속 쓸 수 있음 */ }
      }

      async function loadSnippet(id){
        try {
          const res = await fetch('/api/webeditor/snippets/' + id);
          if (!res.ok) { showToast('불러오지 못했습니다.'); return; }
          const s = await res.json();
          template.value = s.template;
          await nextTick();
          setCode(s.html, s.css, s.js);
          libs.splice(0, libs.length, ...(s.libs || []));
          title.value = s.title + ' (복사본)';
          loadedFrom.value = s.title;
          history.pushState(null, '', '/editor/' + id);
          run();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          showToast('불러오는 중 오류가 발생했습니다.');
        }
      }

      onMounted(async () => {
        await initMonaco();
        fetchList();
        // URL에 슬러그(스니펫 id)가 있으면 그 스니펫을 바로 불러온다
        const parts = location.pathname.split('/').filter(Boolean); // ['editor', '42']
        if (parts[1] && /^\d+$/.test(parts[1])) {
          await loadSnippet(parts[1]);
        }
      });

      return {
        title, template, pane, libs, libInput, saving, toast, list, loadedFrom,
        elHtml, elCss, elJs, preview,
        currentExamples, templateLabel, formatDate,
        onTemplateChange, loadExample, addLib, run, openInNewWindow, save, loadSnippet
      };
    }
  };

  createApp(App).mount('#editorApp');
})();
</script>
