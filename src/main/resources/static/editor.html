<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 에디터 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<!-- React 템플릿의 JSX를 iframe에 넣기 전에 이 페이지(부모)에서 미리 변환하는 데 사용한다.
     버전을 @7로 고정한다 — 버전을 안 박은 최신 URL(.../standalone/babel.min.js)이 최근
     Babel 8 릴리스 이후 깨져서(Babel 저장소에도 관련 이슈 등록됨) React 예제가 전부
     실행되지 않는 원인이었다. 안정적인 7 계열로 고정해 이 문제를 피한다. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<style>
.we-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.we-input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px}
.we-input:focus{outline:none;border-color:var(--amber)}
.we-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;cursor:pointer;font-weight:600}
.we-btn:hover{color:var(--amber);border-color:var(--amber)}
.we-btn.primary{background:var(--amber);color:#131A2A;border:0}
.we-btn.primary:hover{filter:brightness(1.08);color:#131A2A}
.we-btn:disabled{opacity:.4;cursor:default}
.we-btn:disabled:hover{color:var(--mut);border-color:var(--line)}
.we-btn.sm{padding:4px 10px;font-size:11.5px}

.we-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){ .we-layout{grid-template-columns:1fr} }

.we-editor-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.we-tabs{display:flex;gap:2px;background:var(--panel-2);border-bottom:1px solid var(--line);padding:6px 6px 0}
.we-tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;background:transparent}
.we-tab.on{background:var(--panel);color:var(--amber)}
.we-monaco-wrap{position:relative;height:420px}
.we-monaco-pane{position:absolute;inset:0}

.we-preview-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.we-preview-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
/* iframe 자체 배경을 흰색으로 두면, srcdoc이 새로 로드될 때마다 새 문서의 CSS가 적용되기 전
   잠깐 흰 화면이 노출되어 깜빡이는 것처럼 보인다(문서 교체 자체는 매번 일어남 — 브라우저는
   같은 내용이어도 srcdoc 대입 시 항상 새로 내비게이션한다). 대부분의 예제가 어두운 배경을
   쓰므로 iframe 기본 배경도 어둡게 맞춰서 전환이 튀지 않게 한다. */
.we-preview-frame{width:100%;height:420px;border:0;background:#0b101b}

.we-libs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.we-lib-chip{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:11.5px;font-family:var(--mono);color:var(--mut);max-width:280px}
.we-lib-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we-lib-chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.we-lib-chip button:hover{color:#f88}

.we-note{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}

.we-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.we-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.we-card:hover{border-color:var(--amber)}
.we-card .tmpl{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(242,169,59,.35);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.we-card .ttl{font-size:13.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we-card .dt{font-size:11px;color:var(--dim);margin-top:5px}

.we-loaded-banner{background:rgba(242,169,59,.08);border:1px solid rgba(242,169,59,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:12px}
.we-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--amber);color:#131A2A;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:400;box-shadow:0 8px 20px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page"><h1>💻 웹 에디터</h1></header>
  <div class="skill-row">
    <span>Monaco Editor</span><span>Vue.js 3</span><span>React(Babel Standalone)</span><span>Spring Boot</span><span>MySQL</span>
  </div>

  <div id="editorApp"></div>
</main>

<script type="text/x-template" id="we-tpl">
  <div>
    <div v-if="loadedFrom" class="we-loaded-banner">
      '{{ loadedFrom }}'을(를) 불러왔습니다. 수정 후 저장하면 새 코드로 등록됩니다(기존 코드는 그대로 유지).
    </div>

    <div class="we-toolbar">
      <input class="we-input" v-model="title" placeholder="제목 (예: 카드 뒤집기 애니메이션)" style="flex:1;min-width:180px">
      <select class="we-input" v-model="template" @change="onTemplateChange">
        <option value="HTML_CSS_JS">HTML/CSS/JS</option>
        <option value="VUE">Vue 3</option>
        <option value="REACT">React</option>
      </select>
      <select class="we-input" @change="loadExample($event.target.value); $event.target.value=''">
        <option value="">예제 불러오기...</option>
        <option v-for="ex in currentExamples" :key="ex.name" :value="ex.name">{{ ex.name }}</option>
      </select>
      <button class="we-btn primary" @click="run">▶ 실행</button>
      <button class="we-btn" @click="openInNewWindow">↗ 새 창에서 보기</button>
      <button class="we-btn" @click="save" :disabled="saving">{{ saving ? '저장 중...' : '저장' }}</button>
    </div>

    <div class="we-libs">
      <span style="font-size:12px;color:var(--mut);font-weight:600">외부 라이브러리</span>
      <input class="we-input" v-model="libInput" @keyup.enter="addLib" placeholder="CDN URL 붙여넣고 Enter (예: https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js)" style="flex:1;min-width:220px">
      <button class="we-btn sm" @click="addLib">추가</button>
      <span v-for="(lib, i) in libs" :key="i" class="we-lib-chip">
        <span :title="lib">{{ lib }}</span>
        <button @click="libs.splice(i,1)">×</button>
      </span>
    </div>

    <div class="we-layout">
      <div class="we-editor-card">
        <div class="we-tabs">
          <div class="we-tab" :class="{on: pane==='html'}" @click="pane='html'">HTML</div>
          <div class="we-tab" :class="{on: pane==='css'}" @click="pane='css'">CSS</div>
          <div class="we-tab" :class="{on: pane==='js'}" @click="pane='js'">{{ template === 'REACT' ? 'JS (JSX)' : 'JS' }}</div>
        </div>
        <div class="we-monaco-wrap">
          <div class="we-monaco-pane" v-show="pane==='html'" ref="elHtml"></div>
          <div class="we-monaco-pane" v-show="pane==='css'" ref="elCss"></div>
          <div class="we-monaco-pane" v-show="pane==='js'" ref="elJs"></div>
        </div>
      </div>
      <div class="we-preview-card">
        <div class="we-preview-head">
          <span>미리보기 (0.6초 후 자동 실행, 또는 ▶ 실행 클릭)</span>
        </div>
        <iframe class="we-preview-frame" ref="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
      </div>
    </div>

    <div class="we-note">※ HTML/CSS/JS는 브라우저에서 자체적으로 문법 오류를 표시합니다(특히 JS는 실제 문법 오류에 빨간 밑줄). 실행은 격리된 iframe에서만 이루어지며 이 페이지의 다른 데이터에 접근하지 못합니다. 저장은 로그인 없이 공개로 등록되며(CodePen과 동일한 방식), 누구나 볼 수 있습니다.</div>

    <h2 style="font-size:16px;margin-top:28px;margin-bottom:4px">🌐 최근 공유된 코드</h2>
    <div class="we-list-grid">
      <button v-for="s in list" :key="s.id" class="we-card" @click="loadSnippet(s.id)">
        <div class="tmpl">{{ templateLabel(s.template) }}</div>
        <div class="ttl">{{ s.title }}</div>
        <div class="dt">{{ formatDate(s.createdAt) }}</div>
      </button>
      <div v-if="!list.length" style="color:var(--dim);font-size:12.5px;padding:12px">아직 공유된 코드가 없습니다. 첫 번째로 저장해보세요!</div>
    </div>

    <div v-if="toast" class="we-toast">{{ toast }}</div>
  </div>
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
<script src="/js/nav.js"></script>
<script>
(function(){
  const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;

  /* ===================================================
     Monaco Editor 로딩 — AMD 로더(require.js 방식)로 CDN에서 받아온다.
     window.monacoReady가 true가 되면 monaco 전역 객체를 쓸 수 있다.
     =================================================== */
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  window.monacoReadyPromise = new Promise((resolve) => {
    require(['vs/editor/editor.main'], function () { resolve(); });
  });

  /* ===================================================
     템플릿별 예제 — 실무에서 실제로 마주치는 패턴 위주의 상급 예제로 구성했다
     (디바운스/레이스 컨디션, Web Worker, Composable, Provide/Inject, Teleport,
     Suspense, useReducer, useMemo/memo 최적화, 커스텀 훅, Portal, Error Boundary 등).
     새 예제를 추가하려면 이 객체에 { name, html, css, js } 한 항목만 추가하면 된다.
     =================================================== */
  const EXAMPLES = {
    HTML_CSS_JS: [
      {
        name: '디바운스 검색 + 레이스 컨디션 방지',
        html: '<input id="q" placeholder="과일 검색 (예: an)">\n<div id="results"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\n.item{padding:6px 0;border-bottom:1px solid #2a3348}',
        js: 'const DATA = ["Apple","Banana","Cherry","Date","Grape","Kiwi","Mango","Orange","Papaya","Tangerine"];\n\nlet requestId = 0;\nlet timer = null;\nconst input = document.getElementById("q");\nconst results = document.getElementById("results");\n\ninput.addEventListener("input", () => {\n  clearTimeout(timer);\n  timer = setTimeout(search, 300);\n});\n\n// 실제 네트워크처럼 무작위 지연을 흉내낸다 — 늦게 도착한 이전 요청 응답이\n// 나중에 시작한 요청의 결과를 덮어쓰는 "레이스 컨디션" 문제를 재현하기 위함\nfunction fakeFetch(q) {\n  const delay = 200 + Math.random() * 700;\n  return new Promise(resolve => setTimeout(() => {\n    resolve(DATA.filter(f => f.toLowerCase().includes(q.toLowerCase())));\n  }, delay));\n}\n\nasync function search() {\n  const q = input.value.trim();\n  if (!q) { results.innerHTML = ""; return; }\n  const myId = ++requestId; // 이 요청의 고유 번호를 찍어둔다\n  results.innerHTML = "검색 중...";\n  const items = await fakeFetch(q);\n  if (myId !== requestId) return; // 그 사이 새 요청이 시작됐으면 이 결과는 버린다\n  results.innerHTML = items.length ? items.map(f => `<div class="item">${f}</div>`).join("") : "결과 없음";\n}'
      },
      {
        name: 'Intersection Observer 무한 스크롤',
        html: '<div id="list"></div>\n<div id="sentinel">더 불러오는 중...</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;margin:0}\n.row{padding:10px;border-bottom:1px solid #2a3348}\n#sentinel{padding:10px;color:#9aa4bb;text-align:center}',
        js: 'const list = document.getElementById("list");\nconst sentinel = document.getElementById("sentinel");\nlet page = 0;\n\nfunction loadMore() {\n  page++;\n  for (let i = 1; i <= 10; i++) {\n    const div = document.createElement("div");\n    div.className = "row";\n    div.textContent = `항목 #${(page - 1) * 10 + i}`;\n    list.appendChild(div);\n  }\n}\n\n// sentinel(마지막에 배치된 요소)이 화면에 보이면 다음 페이지를 불러온다 —\n// scroll 이벤트를 계속 감시하는 것보다 훨씬 가볍고 정확한 방식\nconst observer = new IntersectionObserver((entries) => {\n  if (entries[0].isIntersecting) loadMore();\n}, { threshold: 1 });\n\nobserver.observe(sentinel);\nloadMore();'
      },
      {
        name: 'Drag & Drop 칸반 보드',
        html: '<div class="board">\n  <div class="col" data-status="todo"><h3>할 일</h3>\n    <div class="card" draggable="true">기획서 작성</div>\n    <div class="card" draggable="true">디자인 시안</div>\n  </div>\n  <div class="col" data-status="doing"><h3>진행중</h3>\n    <div class="card" draggable="true">API 개발</div>\n  </div>\n  <div class="col" data-status="done"><h3>완료</h3></div>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;margin:0}\n.board{display:flex;gap:12px}\n.col{flex:1;background:#161d2e;border-radius:8px;padding:10px;min-height:200px;border:2px dashed transparent}\n.col.over{border-color:#f2a93b}\n.card{background:#f2a93b;color:#131A2A;padding:8px;border-radius:6px;margin-bottom:8px;cursor:grab;font-size:13px}',
        js: 'let dragged = null;\n\ndocument.querySelectorAll(".card").forEach(card => {\n  card.addEventListener("dragstart", () => { dragged = card; });\n});\n\ndocument.querySelectorAll(".col").forEach(col => {\n  col.addEventListener("dragover", (e) => {\n    e.preventDefault(); // 이걸 안 하면 drop 이벤트가 아예 발생하지 않는다\n    col.classList.add("over");\n  });\n  col.addEventListener("dragleave", () => col.classList.remove("over"));\n  col.addEventListener("drop", (e) => {\n    e.preventDefault();\n    col.classList.remove("over");\n    if (dragged) col.appendChild(dragged);\n  });\n});'
      },
      {
        name: 'Canvas 파티클 애니메이션',
        html: '<canvas id="c" width="400" height="280"></canvas>\n<p style="text-align:center;color:#9aa4bb;font-size:12px">캔버스를 클릭해보세요</p>',
        css: 'body{background:#0b101b;margin:0;padding:16px;font-family:sans-serif}\ncanvas{background:#0b101b;display:block;margin:0 auto;border:1px solid #2a3348;border-radius:8px}',
        js: 'const canvas = document.getElementById("c");\nconst ctx = canvas.getContext("2d");\nlet particles = [];\n\nfunction spawn(x, y) {\n  for (let i = 0; i < 20; i++) {\n    particles.push({\n      x, y,\n      vx: (Math.random() - 0.5) * 6,\n      vy: (Math.random() - 0.5) * 6 - 2,\n      life: 60\n    });\n  }\n}\n\ncanvas.addEventListener("click", (e) => {\n  const rect = canvas.getBoundingClientRect();\n  spawn(e.clientX - rect.left, e.clientY - rect.top);\n});\n\nfunction tick() {\n  ctx.fillStyle = "rgba(11,16,27,0.25)"; // 완전히 지우지 않고 살짝만 덮어서 잔상(트레일) 효과를 낸다\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n  particles.forEach(p => {\n    p.vy += 0.15; // 중력\n    p.x += p.vx;\n    p.y += p.vy;\n    p.life--;\n    ctx.fillStyle = `rgba(242,169,59,${p.life / 60})`;\n    ctx.beginPath();\n    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);\n    ctx.fill();\n  });\n  particles = particles.filter(p => p.life > 0);\n  requestAnimationFrame(tick);\n}\ntick();'
      },
      {
        name: 'Web Worker로 무거운 연산 오프로딩',
        html: '<button id="run">Worker로 소수 10만 개 계산</button>\n<button id="block">메인 스레드에서 계산 (UI 멈춤 확인용)</button>\n<div id="status">idle</div>\n<input id="test" placeholder="계산 중에도 여기에 입력해보세요">',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 14px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-right:8px;margin-bottom:10px}\n#status{margin:10px 0;font-size:13px;color:#9aa4bb}\ninput{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}',
        js: '// 별도 파일 없이 Blob으로 워커 스크립트를 즉석에서 만든다(플레이그라운드처럼 파일 하나뿐인 환경에서 유용한 기법)\nconst workerCode = `\n  self.onmessage = function() {\n    function isPrime(x) {\n      for (let i = 2; i * i <= x; i++) if (x % i === 0) return false;\n      return x > 1;\n    }\n    const primes = [];\n    let n = 2;\n    while (primes.length < 100000) {\n      if (isPrime(n)) primes.push(n);\n      n++;\n    }\n    postMessage(primes.length);\n  };\n`;\nconst blob = new Blob([workerCode], { type: "application/javascript" });\nconst worker = new Worker(URL.createObjectURL(blob));\n\ndocument.getElementById("run").addEventListener("click", () => {\n  document.getElementById("status").textContent = "계산 중 (백그라운드)...";\n  const start = performance.now();\n  worker.postMessage("go");\n  worker.onmessage = (e) => {\n    document.getElementById("status").textContent = `완료: 소수 ${e.data}개, ${(performance.now() - start).toFixed(0)}ms — 입력창이 안 멈췄던 걸 확인해보세요`;\n  };\n});\n\ndocument.getElementById("block").addEventListener("click", () => {\n  document.getElementById("status").textContent = "메인 스레드에서 계산 중... (입력창이 멈춥니다)";\n  setTimeout(() => {\n    function isPrime(x) {\n      for (let i = 2; i * i <= x; i++) if (x % i === 0) return false;\n      return x > 1;\n    }\n    const primes = [];\n    let n = 2;\n    while (primes.length < 100000) {\n      if (isPrime(n)) primes.push(n);\n      n++;\n    }\n    document.getElementById("status").textContent = `완료(메인 스레드): 소수 ${primes.length}개`;\n  }, 10);\n});'
      },
      {
        name: 'CSS 커스텀 프로퍼티로 다크모드 전환',
        html: '<button id="toggle">테마 전환</button>\n<div class="card">이 카드도 함께 테마를 따라갑니다.</div>',

        js: 'const { useState, useMemo, memo } = React;\n\n// React.memo로 감싼 컴포넌트는 props가 실제로 바뀔 때만 다시 렌더링된다.\n// 우클릭 → 검사 → Console을 열어두고 "관계없는 카운터" 버튼을 눌러보면\n// ExpensiveChild가 다시 렌더링되지 않는 걸 확인할 수 있다.\nconst ExpensiveChild = memo(function ExpensiveChild({ value }) {\n  console.log("ExpensiveChild 렌더링됨, value =", value);\n  return <p>memo로 감싼 자식 — value: {value}</p>;\n});\n\nfunction heavyCompute(n) {\n  let total = 0;\n  for (let i = 0; i < n * 500000; i++) total += i % 3;\n  return total;\n}\n\nfunction App() {\n  const [count, setCount] = useState(0);\n  const [n, setN] = useState(1);\n\n  // n이 바뀔 때만 재계산 — count만 바뀔 때는 이전 계산 결과를 그대로 재사용한다\n  const result = useMemo(() => heavyCompute(n), [n]);\n\n  return (\n    <div>\n      <button onClick={() => setCount(count + 1)}>관계없는 카운터: {count}</button>\n      <button onClick={() => setN(n + 1)}>무거운 계산 트리거: {n}</button>\n      <p>계산 결과: {result}</p>\n      <ExpensiveChild value={n} />\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'

        js: 'const { useState, useEffect } = React;\n\n// 값이 바뀔 때마다 타이머를 다시 걸고, cleanup 함수(return)로 이전 타이머를 취소한다 —\n// useEffect의 cleanup을 이용한 디바운스의 정석적인 구현 방식\nfunction useDebounce(value, delay) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() => {\n    const t = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(t);\n  }, [value, delay]);\n  return debounced;\n}\n\nconst DATA = ["Apple", "Banana", "Cherry", "Date", "Grape", "Kiwi", "Mango", "Orange"];\n\nfunction Search() {\n  const [text, setText] = useState("");\n  const debounced = useDebounce(text, 400);\n  const results = debounced ? DATA.filter(f => f.toLowerCase().includes(debounced.toLowerCase())) : [];\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="과일 검색" />\n      <ul>\n        {results.map(f => <li key={f}>{f}</li>)}\n      </ul>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<Search />);'

        js: '// Error Boundary는 아직 훅으로 만들 수 없어 클래스 컴포넌트로만 구현 가능하다(React 18 기준).\n// 자식 트리 렌더링 중 에러가 나면 전체 앱이 죽는 대신 이 컴포넌트가 대체 화면을 보여준다.\nclass ErrorBoundary extends React.Component {\n  constructor(props) {\n    super(props);\n    this.state = { hasError: false };\n  }\n  static getDerivedStateFromError() {\n    return { hasError: true };\n  }\n  render() {\n    if (this.state.hasError) {\n      return <p style={{ color: "#f88" }}>문제가 발생해서 이 부분만 대신 표시합니다.</p>;\n    }\n    return this.props.children;\n  }\n}\n\nfunction Bomb() {\n  throw new Error("의도적으로 발생시킨 에러");\n}\n\nfunction App() {\n  const [showBomb, setShowBomb] = React.useState(false);\n  return (\n    <div>\n      <button onClick={() => setShowBomb(true)}>에러 발생시키기</button>\n      <ErrorBoundary>\n        {showBomb ? <Bomb /> : <p>정상 상태입니다.</p>}\n      </ErrorBoundary>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'

        js: '// useReducer + useContext 조합은 별도 라이브러리 없이도 "전역 상태 관리"의 핵심 아이디어를\n// 그대로 구현한다 — 서로 멀리 떨어진 컴포넌트끼리 props 없이 상태를 공유·변경한다.\nconst { createContext, useContext, useReducer } = React;\n\nconst CounterContext = createContext(null);\n\nfunction counterReducer(state, action) {\n  switch (action.type) {\n    case "inc": return state + 1;\n    case "dec": return state - 1;\n    default: return state;\n  }\n}\n\nfunction CounterProvider({ children }) {\n  const [count, dispatch] = useReducer(counterReducer, 0);\n  return <CounterContext.Provider value={{ count, dispatch }}>{children}</CounterContext.Provider>;\n}\n\nfunction DisplayA() {\n  const { count } = useContext(CounterContext);\n  return <p>다른 컴포넌트(A)에서 본 값: {count}</p>;\n}\n\nfunction ButtonsB() {\n  const { dispatch } = useContext(CounterContext);\n  return (\n    <div>\n      <button onClick={() => dispatch({ type: "inc" })}>+1</button>\n      <button onClick={() => dispatch({ type: "dec" })}>-1</button>\n    </div>\n  );\n}\n\nfunction App() {\n  return (\n    <CounterProvider>\n      <DisplayA />\n      <ButtonsB />\n    </CounterProvider>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'

        editors.html = monaco.editor.create(elHtml.value, { value: '', language: 'html', ...commonOpts });
        editors.css = monaco.editor.create(elCss.value, { value: '', language: 'css', ...commonOpts });
        editors.js = monaco.editor.create(elJs.value, { value: '', language: 'javascript', ...commonOpts });
        [editors.html, editors.css, editors.js].forEach(ed => {
          ed.onDidChangeModelContent(() => {

            debounceTimer = setTimeout(run, 600);
          });
        });
        loadExample(currentExamples.value[0] && currentExamples.value[0].name);

      function setCode(html, css, js){

        if (editors.css) editors.css.setValue(css || '');

      function getCode(){

      /* setCode()는 내부적으로 각 Monaco 모델의 값을 바꾸는데, 이때 onDidChangeModelContent가
         걸려 있어 600ms 뒤 run()이 자동으로 한 번 더 예약된다. 여기서 곧바로 run()을 명시적으로
         호출하면 "즉시 실행 + 600ms 뒤 예약된 실행"이 겹쳐 미리보기가 두 번 리로드되며

        setCode(html, css, js);
        clearTimeout(debounceTimer);

         방식 대신, 이 부모 페이지에 로드된 Babel Standalone으로 미리 순수 JS로 변환해서 넣는다
         — iframe.srcdoc을 매번 새로 그리는 환경에서는 iframe 내부 DOMContentLoaded 타이밍이
         어긋나 자동 스캔이 누락되는 경우가 있어(React 예제가 항상 빈 화면으로 보이던 원인),
         변환을 우리가 직접 제어해 항상 순수 JS만 iframe에 넘기는 쪽이 안정적이다. */
      function buildDoc(){
        const { html, css, js } = getCode();
        const libScripts = libs.map(u => '<script src="' + u.replace(/"/g, '&quot;') + '"><' + '/script>').join('\n');
        let frameworkScripts = '';
        let jsTag;
        if (template.value === 'VUE') {
          frameworkScripts = '<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><' + '/script>';
          jsTag = '<script>' + js + '<' + '/script>';
        } else if (template.value === 'REACT') {
          frameworkScripts =
            '<script src="https://unpkg.com/react@18/umd/react.production.min.js"><' + '/script>' +
            '<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><' + '/script>';
          let transformed;
          try {
            transformed = Babel.transform(js, { presets: ['react'] }).code;
          } catch (e) {
            const errMsg = String(e.message || e).replace(/"/g, '\\"').replace(/\n/g, ' ');
            transformed = 'document.body.innerHTML = "<pre style=\\"color:#f88;padding:16px;white-space:pre-wrap\\">JSX 문법 오류: ' + errMsg + '</pre>";';
          }
          jsTag = '<script>' + transformed + '<' + '/script>';
        } else {
          jsTag = '<script>' + js + '<' + '/script>';
        }
        return '<!DOCTYPE html><html><head><meta charset="utf-8">'
          + '<style>' + css + '</style>'
          + frameworkScripts + libScripts
          + '</head><body>' + html + jsTag + '</body></html>';
      }

      function run(){
        if (!preview.value) return;
        preview.value.srcdoc = buildDoc();
      }

      function openInNewWindow(){
        const blob = new Blob([buildDoc()], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }

      /* ===== 저장 ===== */
      async function save(){
        if (!title.value.trim()) { showToast('제목을 입력해주세요.'); return; }
        saving.value = true;
        try {
          const { html, css, js } = getCode();
          const res = await fetch('/api/webeditor/snippets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title.value.trim(), template: template.value, html, css, js, libs: [...libs] })
          });
          const data = await res.json();
          if (!res.ok) { showToast(data.error || '저장에 실패했습니다.'); return; }
          history.pushState(null, '', '/editor/' + data.id);
          loadedFrom.value = '';
          showToast('저장되었습니다! 이 코드는 이제 공개 목록에서 누구나 볼 수 있습니다.');
          fetchList();
        } catch (e) {
          showToast('저장 중 오류가 발생했습니다.');
        } finally {
          saving.value = false;
        }
      }

      /* ===== 목록/불러오기 ===== */
      async function fetchList(){
        try {
          const res = await fetch('/api/webeditor/snippets?limit=30');
          list.value = await res.json();
        } catch (e) { /* 무시 — 목록만 못 보여줄 뿐 에디터 자체는 계속 쓸 수 있음 */ }
      }

      async function loadSnippet(id){
        try {
          const res = await fetch('/api/webeditor/snippets/' + id);
          if (!res.ok) { showToast('불러오지 못했습니다.'); return; }
          const s = await res.json();
          template.value = s.template;
          await nextTick();
          setCodeAndRun(s.html, s.css, s.js);
          libs.splice(0, libs.length, ...(s.libs || []));
          title.value = s.title + ' (복사본)';
          loadedFrom.value = s.title;
          history.pushState(null, '', '/editor/' + id);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          showToast('불러오는 중 오류가 발생했습니다.');
        }
      }

      onMounted(async () => {
        await initMonaco();
        fetchList();
        // URL에 슬러그(스니펫 id)가 있으면 그 스니펫을 바로 불러온다
        const parts = location.pathname.split('/').filter(Boolean); // ['editor', '42']
        if (parts[1] && /^\d+$/.test(parts[1])) {
          await loadSnippet(parts[1]);
        }
      });

      return {
        title, template, pane, libs, libInput, saving, toast, list, loadedFrom,
        elHtml, elCss, elJs, preview,
        currentExamples, templateLabel, formatDate,
        onTemplateChange, loadExample, addLib, run, openInNewWindow, save, loadSnippet
      };
    }
  };

  createApp(App).mount('#editorApp');
})();
</script>
</body>
</html>
