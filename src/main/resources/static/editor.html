<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 에디터 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<!-- React 템플릿의 JSX를 iframe에 넣기 전에 이 페이지(부모)에서 미리 변환하는 데 사용한다.
     버전을 @7로 고정한다 — 버전을 안 박은 최신 URL(.../standalone/babel.min.js)이 최근
     Babel 8 릴리스 이후 깨져서(Babel 저장소에도 관련 이슈 등록됨) React 예제가 전부
     실행되지 않는 원인이었다. 안정적인 7 계열로 고정해 이 문제를 피한다. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<style>
.we-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.we-input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px}
.we-input:focus{outline:none;border-color:var(--amber)}
.we-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;cursor:pointer;font-weight:600}
.we-btn:hover{color:var(--amber);border-color:var(--amber)}
.we-btn.primary{background:var(--amber);color:#131A2A;border:0}
.we-btn.primary:hover{filter:brightness(1.08);color:#131A2A}
.we-btn:disabled{opacity:.4;cursor:default}
.we-btn:disabled:hover{color:var(--mut);border-color:var(--line)}
.we-btn.sm{padding:4px 10px;font-size:11.5px}

/* ===== 템플릿 선택 탭(JavaScript/Vue.js/React.js) ===== */
.we-tmpl-tabs{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;margin-bottom:14px}
.we-tmpl-tab{padding:8px 18px;border-radius:7px;border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.we-tmpl-tab.on{background:var(--amber);color:#131A2A}

.we-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){ .we-layout{grid-template-columns:1fr} }

.we-editor-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.we-tabs{display:flex;gap:2px;align-items:center;background:var(--panel-2);border-bottom:1px solid var(--line);padding:6px 6px 0}
.we-tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;background:transparent}
.we-tab.on{background:var(--panel);color:var(--amber)}
.we-monaco-wrap{position:relative;height:420px}
.we-monaco-pane{position:absolute;inset:0}

.we-preview-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
/* iframe 자체 배경을 흰색으로 두면, srcdoc이 새로 로드될 때마다 새 문서의 CSS가 적용되기 전
   잠깐 흰 화면이 노출되어 깜빡이는 것처럼 보인다(문서 교체 자체는 매번 일어남 — 브라우저는
   같은 내용이어도 srcdoc 대입 시 항상 새로 내비게이션한다). 대부분의 예제가 어두운 배경을
   쓰므로 iframe 기본 배경도 어둡게 맞춰서 전환이 튀지 않게 한다. */
.we-preview-frame{width:100%;height:420px;border:0;background:#0b101b}

/* ===== 예제 선택 — 미리보기 탭 옆에 버튼 하나만 두고, 누르면 드롭다운 리스트 패널이 뜬다.
   전에는 콤보박스/펼쳐진 패널이 상단 여러 줄(적용기술 칩·템플릿 탭·예제 칩·툴바)과 시각적으로
   겹쳐 보여 위계가 무너졌다는 피드백을 반영해, "결과가 나오는 미리보기 쪽"으로 옮기고
   평소엔 접혀 있게 했다. ===== */
.we-example-wrap{position:relative;margin-left:auto}
.we-example-dropdown{position:absolute;top:100%;right:0;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:320px;overflow-y:auto;width:260px;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.we-example-item{padding:8px 10px;border-radius:7px;background:transparent;border:0;color:var(--mut);font-size:12.5px;text-align:left;cursor:pointer;width:100%}
.we-example-item:hover{background:rgba(242,169,59,.12);color:var(--amber)}
.we-example-backdrop{position:fixed;inset:0;z-index:55}

.we-note{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}

.we-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.we-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.we-card:hover{border-color:var(--amber)}
.we-card .tmpl{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid rgba(242,169,59,.35);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.we-card .ttl{font-size:13.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we-card .dt{font-size:11px;color:var(--dim);margin-top:5px}

.we-loaded-banner{background:rgba(242,169,59,.08);border:1px solid rgba(242,169,59,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:12px}
.we-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--amber);color:#131A2A;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:400;box-shadow:0 8px 20px rgba(0,0,0,.35)}

/* ===== 저장 모달 — 저장 버튼을 누를 때만 제목을 입력받는다(항상 떠 있는 입력창 대신).
   제목을 안 넣고 저장을 누르면, 화면 맨 아래 토스트 대신 모달 바로 위에 경고 배너를
   띄운다 — 하단 토스트는 모달과 멀리 떨어져 있어 뭘 잘못했는지 바로 안 보인다는
   피드백을 반영했다. ===== */
.we-modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.72);display:none;place-items:center;z-index:500;padding:20px}
.we-modal-bg.show{display:grid}
.we-modal-stack{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%;max-width:420px}
.we-modal-error{background:rgba(240,68,82,.12);border:1px solid rgba(240,68,82,.4);color:#f88;padding:10px 14px;border-radius:10px;font-size:12.5px;text-align:center}
.we-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;padding:22px}
.we-modal h3{font-size:15px;margin-bottom:14px}
.we-modal .we-input{width:100%;box-sizing:border-box;margin-bottom:16px}
.we-modal-actions{display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page"><h1>💻 웹 에디터</h1></header>
  <div class="skill-row">
    <span>Monaco Editor</span><span>Vue.js 3</span><span>React(Babel Standalone)</span><span>Spring Boot</span><span>MySQL</span>
  </div>

  <div id="editorApp"></div>
</main>

<script type="text/x-template" id="we-tpl">
  <div>
    <div v-if="loadedFrom" class="we-loaded-banner">
      '{{ loadedFrom }}'을(를) 불러왔습니다. 수정 후 저장하면 새 코드로 등록됩니다(기존 코드는 그대로 유지).
    </div>

    <div class="we-tmpl-tabs">
      <button class="we-tmpl-tab" :class="{on: template==='HTML_CSS_JS'}" @click="selectTemplate('HTML_CSS_JS')">JavaScript</button>
      <button class="we-tmpl-tab" :class="{on: template==='VUE'}" @click="selectTemplate('VUE')">Vue.js</button>
      <button class="we-tmpl-tab" :class="{on: template==='REACT'}" @click="selectTemplate('REACT')">React.js</button>
    </div>

    <div class="we-toolbar">
      <button class="we-btn primary" @click="run">▶ 실행</button>
      <button class="we-btn" @click="openInNewWindow">↗ 새 창에서 보기</button>
      <button class="we-btn" @click="openSaveModal">저장</button>
    </div>

    <div class="we-layout">
      <div class="we-editor-card">
        <div class="we-tabs">
          <div class="we-tab" :class="{on: pane==='html'}" @click="pane='html'">HTML</div>
          <div class="we-tab" :class="{on: pane==='css'}" @click="pane='css'">CSS</div>
          <div class="we-tab" :class="{on: pane==='js'}" @click="pane='js'">{{ template === 'REACT' ? 'JS (JSX)' : 'JS' }}</div>
        </div>
        <div class="we-monaco-wrap">
          <div class="we-monaco-pane" v-show="pane==='html'" ref="elHtml"></div>
          <div class="we-monaco-pane" v-show="pane==='css'" ref="elCss"></div>
          <div class="we-monaco-pane" v-show="pane==='js'" ref="elJs"></div>
        </div>
      </div>
      <div class="we-preview-card">
        <div class="we-tabs">
          <div class="we-tab on">미리보기</div>
          <div class="we-example-wrap">
            <button class="we-btn sm" @click="showExamplePanel = !showExamplePanel">예제 ▾</button>
            <div v-if="showExamplePanel" class="we-example-backdrop" @click="showExamplePanel=false"></div>
            <div v-if="showExamplePanel" class="we-example-dropdown">
              <button v-for="ex in currentExamples" :key="ex.name" class="we-example-item" @click="pickExample(ex.name)">{{ ex.name }}</button>
            </div>
          </div>
        </div>
        <iframe class="we-preview-frame" ref="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
      </div>
    </div>

    <div class="we-note">※ HTML/CSS/JS는 브라우저에서 자체적으로 문법 오류를 표시합니다(특히 JS는 실제 문법 오류에 빨간 밑줄). 실행은 격리된 iframe에서만 이루어지며 이 페이지의 다른 데이터에 접근하지 못합니다. 외부 라이브러리가 필요하면 HTML 탭에 &lt;script src="..."&gt;&lt;/script&gt;를 직접 추가하면 됩니다(head/body 어디든 상관없이 그대로 실행됩니다). 저장은 로그인 없이 공개로 등록되며(CodePen과 동일한 방식), 누구나 볼 수 있습니다.</div>

    <h2 style="font-size:16px;margin-top:28px;margin-bottom:4px">🌐 최근 공유된 코드</h2>
    <div class="we-list-grid">
      <button v-for="s in list" :key="s.id" class="we-card" @click="loadSnippet(s.id)">
        <div class="tmpl">{{ templateLabel(s.template) }}</div>
        <div class="ttl">{{ s.title }}</div>
        <div class="dt">{{ formatDate(s.createdAt) }}</div>
      </button>
      <div v-if="!list.length" style="color:var(--dim);font-size:12.5px;padding:12px">아직 공유된 코드가 없습니다. 첫 번째로 저장해보세요!</div>
    </div>

    <div class="we-modal-bg" :class="{show: showSaveModal}" @click.self="closeSaveModal">
      <div class="we-modal-stack">
        <div v-if="saveError" class="we-modal-error">{{ saveError }}</div>
        <div class="we-modal">
          <h3>이 코드에 제목을 붙여주세요</h3>
          <input class="we-input" v-model="modalTitle" placeholder="예: 카드 뒤집기 애니메이션" @keyup.enter="confirmSave" autofocus>
          <div class="we-modal-actions">
            <button class="we-btn" @click="closeSaveModal">취소</button>
            <button class="we-btn primary" @click="confirmSave" :disabled="saving">{{ saving ? '저장 중...' : '저장' }}</button>
          </div>
        </div>
      </div>
    </div>

    <div v-if="toast" class="we-toast">{{ toast }}</div>
  </div>
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
<script src="/js/nav.js"></script>
<script>
(function(){
  const { createApp, ref, computed, onMounted, nextTick } = Vue;

  /* ===================================================
     Monaco Editor 로딩 — AMD 로더(require.js 방식)로 CDN에서 받아온다.
     window.monacoReady가 true가 되면 monaco 전역 객체를 쓸 수 있다.
     =================================================== */
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  window.monacoReadyPromise = new Promise((resolve) => {
    require(['vs/editor/editor.main'], function () { resolve(); });
  });

  /* ===================================================
     템플릿별 예제 — 실무에서 실제로 마주치는 패턴 위주의 예제로 구성했다. 특히 Vue/React는
     "눈으로 바로 확인되는 변화"를 최우선으로 골랐다(콘솔을 열어야 알 수 있는 예제는 제외).
     새 예제를 추가하려면 이 객체에 { name, html, css, js } 한 항목만 추가하면 된다.
     =================================================== */
  const EXAMPLES = {
    HTML_CSS_JS: [
      {
        name: '디바운스 검색 + 레이스 컨디션 방지',
        html: '<input id="q" placeholder="과일 검색 (예: an)">\n<div id="results"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\n.item{padding:6px 0;border-bottom:1px solid #2a3348}',
        js: 'const DATA = ["Apple","Banana","Cherry","Date","Grape","Kiwi","Mango","Orange","Papaya","Tangerine"];\n\nlet requestId = 0;\nlet timer = null;\nconst input = document.getElementById("q");\nconst results = document.getElementById("results");\n\ninput.addEventListener("input", () => {\n  clearTimeout(timer);\n  timer = setTimeout(search, 300);\n});\n\n// 실제 네트워크처럼 무작위 지연을 흉내낸다 — 늦게 도착한 이전 요청 응답이\n// 나중에 시작한 요청의 결과를 덮어쓰는 "레이스 컨디션" 문제를 재현하기 위함\nfunction fakeFetch(q) {\n  const delay = 200 + Math.random() * 700;\n  return new Promise(resolve => setTimeout(() => {\n    resolve(DATA.filter(f => f.toLowerCase().includes(q.toLowerCase())));\n  }, delay));\n}\n\nasync function search() {\n  const q = input.value.trim();\n  if (!q) { results.innerHTML = ""; return; }\n  const myId = ++requestId; // 이 요청의 고유 번호를 찍어둔다\n  results.innerHTML = "검색 중...";\n  const items = await fakeFetch(q);\n  if (myId !== requestId) return; // 그 사이 새 요청이 시작됐으면 이 결과는 버린다\n  results.innerHTML = items.length ? items.map(f => `<div class="item">${f}</div>`).join("") : "결과 없음";\n}'
      },
      {
        name: 'Intersection Observer 무한 스크롤',
        html: '<div id="list"></div>\n<div id="sentinel">더 불러오는 중...</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;margin:0}\n.row{padding:10px;border-bottom:1px solid #2a3348}\n#sentinel{padding:10px;color:#9aa4bb;text-align:center}',
        js: 'const list = document.getElementById("list");\nconst sentinel = document.getElementById("sentinel");\nlet page = 0;\n\nfunction loadMore() {\n  page++;\n  for (let i = 1; i <= 10; i++) {\n    const div = document.createElement("div");\n    div.className = "row";\n    div.textContent = `항목 #${(page - 1) * 10 + i}`;\n    list.appendChild(div);\n  }\n}\n\n// sentinel(마지막에 배치된 요소)이 화면에 보이면 다음 페이지를 불러온다 —\n// scroll 이벤트를 계속 감시하는 것보다 훨씬 가볍고 정확한 방식\nconst observer = new IntersectionObserver((entries) => {\n  if (entries[0].isIntersecting) loadMore();\n}, { threshold: 1 });\n\nobserver.observe(sentinel);\nloadMore();'
      },
      {
        name: 'Drag & Drop 칸반 보드',
        html: '<div class="board">\n  <div class="col" data-status="todo"><h3>할 일</h3>\n    <div class="card" draggable="true">기획서 작성</div>\n    <div class="card" draggable="true">디자인 시안</div>\n  </div>\n  <div class="col" data-status="doing"><h3>진행중</h3>\n    <div class="card" draggable="true">API 개발</div>\n  </div>\n  <div class="col" data-status="done"><h3>완료</h3></div>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;margin:0}\n.board{display:flex;gap:12px}\n.col{flex:1;background:#161d2e;border-radius:8px;padding:10px;min-height:200px;border:2px dashed transparent}\n.col.over{border-color:#f2a93b}\n.card{background:#f2a93b;color:#131A2A;padding:8px;border-radius:6px;margin-bottom:8px;cursor:grab;font-size:13px}',
        js: 'let dragged = null;\n\ndocument.querySelectorAll(".card").forEach(card => {\n  card.addEventListener("dragstart", () => { dragged = card; });\n});\n\ndocument.querySelectorAll(".col").forEach(col => {\n  col.addEventListener("dragover", (e) => {\n    e.preventDefault(); // 이걸 안 하면 drop 이벤트가 아예 발생하지 않는다\n    col.classList.add("over");\n  });\n  col.addEventListener("dragleave", () => col.classList.remove("over"));\n  col.addEventListener("drop", (e) => {\n    e.preventDefault();\n    col.classList.remove("over");\n    if (dragged) col.appendChild(dragged);\n  });\n});'
      },
      {
        name: 'Canvas 파티클 애니메이션',
        html: '<canvas id="c" width="400" height="280"></canvas>\n<p style="text-align:center;color:#9aa4bb;font-size:12px">캔버스를 클릭해보세요</p>',
        css: 'body{background:#0b101b;margin:0;padding:16px;font-family:sans-serif}\ncanvas{background:#0b101b;display:block;margin:0 auto;border:1px solid #2a3348;border-radius:8px}',
        js: 'const canvas = document.getElementById("c");\nconst ctx = canvas.getContext("2d");\nlet particles = [];\n\nfunction spawn(x, y) {\n  for (let i = 0; i < 20; i++) {\n    particles.push({\n      x, y,\n      vx: (Math.random() - 0.5) * 6,\n      vy: (Math.random() - 0.5) * 6 - 2,\n      life: 60\n    });\n  }\n}\n\ncanvas.addEventListener("click", (e) => {\n  const rect = canvas.getBoundingClientRect();\n  spawn(e.clientX - rect.left, e.clientY - rect.top);\n});\n\nfunction tick() {\n  ctx.fillStyle = "rgba(11,16,27,0.25)"; // 완전히 지우지 않고 살짝만 덮어서 잔상(트레일) 효과를 낸다\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n  particles.forEach(p => {\n    p.vy += 0.15; // 중력\n    p.x += p.vx;\n    p.y += p.vy;\n    p.life--;\n    ctx.fillStyle = `rgba(242,169,59,${p.life / 60})`;\n    ctx.beginPath();\n    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);\n    ctx.fill();\n  });\n  particles = particles.filter(p => p.life > 0);\n  requestAnimationFrame(tick);\n}\ntick();'
      },
      {
        name: 'Web Worker로 무거운 연산 오프로딩',
        html: '<button id="run">Worker로 소수 10만 개 계산</button>\n<button id="block">메인 스레드에서 계산 (UI 멈춤 확인용)</button>\n<div id="status">idle</div>\n<input id="test" placeholder="계산 중에도 여기에 입력해보세요">',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 14px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-right:8px;margin-bottom:10px}\n#status{margin:10px 0;font-size:13px;color:#9aa4bb}\ninput{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}',
        js: '// 별도 파일 없이 Blob으로 워커 스크립트를 즉석에서 만든다(플레이그라운드처럼 파일 하나뿐인 환경에서 유용한 기법)\nconst workerCode = `\n  self.onmessage = function() {\n    function isPrime(x) {\n      for (let i = 2; i * i <= x; i++) if (x % i === 0) return false;\n      return x > 1;\n    }\n    const primes = [];\n    let n = 2;\n    while (primes.length < 100000) {\n      if (isPrime(n)) primes.push(n);\n      n++;\n    }\n    postMessage(primes.length);\n  };\n`;\nconst blob = new Blob([workerCode], { type: "application/javascript" });\nconst worker = new Worker(URL.createObjectURL(blob));\n\ndocument.getElementById("run").addEventListener("click", () => {\n  document.getElementById("status").textContent = "계산 중 (백그라운드)...";\n  const start = performance.now();\n  worker.postMessage("go");\n  worker.onmessage = (e) => {\n    document.getElementById("status").textContent = `완료: 소수 ${e.data}개, ${(performance.now() - start).toFixed(0)}ms — 입력창이 안 멈췄던 걸 확인해보세요`;\n  };\n});\n\ndocument.getElementById("block").addEventListener("click", () => {\n  document.getElementById("status").textContent = "메인 스레드에서 계산 중... (입력창이 멈춥니다)";\n  setTimeout(() => {\n    function isPrime(x) {\n      for (let i = 2; i * i <= x; i++) if (x % i === 0) return false;\n      return x > 1;\n    }\n    const primes = [];\n    let n = 2;\n    while (primes.length < 100000) {\n      if (isPrime(n)) primes.push(n);\n      n++;\n    }\n    document.getElementById("status").textContent = `완료(메인 스레드): 소수 ${primes.length}개`;\n  }, 10);\n});'
      },
      {
        name: 'CSS 커스텀 프로퍼티로 다크모드 전환',
        html: '<button id="toggle">테마 전환</button>\n<div class="card">이 카드도 함께 테마를 따라갑니다.</div>',
        css: ':root{--bg:#0b101b;--fg:#eef1f8;--card:#161d2e}\n:root.light{--bg:#f5f5f5;--fg:#131A2A;--card:#ffffff}\nbody{background:var(--bg);color:var(--fg);font-family:sans-serif;padding:24px;transition:background .3s,color .3s}\n.card{background:var(--card);padding:20px;border-radius:10px;margin-top:16px;transition:background .3s}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: '// CSS 변수(커스텀 프로퍼티)는 JS에서 클래스 하나만 토글해도 여러 요소에 한꺼번에 반영된다 —\n// 요소마다 개별적으로 색을 바꾸는 것보다 유지보수가 훨씬 쉽다\ndocument.getElementById("toggle").addEventListener("click", () => {\n  document.documentElement.classList.toggle("light");\n});'
      },
      {
        name: '할 일 목록 (추가·삭제·완료 토글)',
        html: '<div class="todo-input-row">\n  <input id="todoInput" placeholder="할 일을 입력하고 Enter">\n  <button id="addBtn">추가</button>\n</div>\n<ul id="todoList"></ul>\n<div id="todoCount" class="todo-count"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.todo-input-row{display:flex;gap:8px;margin-bottom:12px}\n.todo-input-row input{flex:1;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\n.todo-input-row button{padding:8px 14px;border-radius:6px;border:0;background:#f2a93b;cursor:pointer;font-weight:600}\n#todoList{list-style:none;padding:0;margin:0}\n#todoList li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#161d2e;border-radius:6px;margin-bottom:6px}\n#todoList li.done span{text-decoration:line-through;color:#9aa4bb}\n#todoList li button{margin-left:auto;background:transparent;border:0;color:#f88;cursor:pointer;font-size:16px}\n.todo-count{margin-top:10px;font-size:12px;color:#9aa4bb}',
        js: '// 이 미리보기는 매번 새 문서로 다시 그려지는 iframe이라 새로고침하면 초기화된다 —\n// 실제 서비스에서는 여기 상태를 localStorage나 서버에 저장하면 된다.\nconst input = document.getElementById("todoInput");\nconst list = document.getElementById("todoList");\nconst countEl = document.getElementById("todoCount");\nconst addBtn = document.getElementById("addBtn");\n\nlet todos = [\n  { id: 1, text: "예제 코드 살펴보기", done: false },\n  { id: 2, text: "내 아이디어로 수정해보기", done: false }\n];\nlet nextId = 3;\n\nfunction render() {\n  list.innerHTML = todos.map(t => `\n    <li class="${t.done ? "done" : ""}" data-id="${t.id}">\n      <input type="checkbox" ${t.done ? "checked" : ""}>\n      <span>${t.text}</span>\n      <button title="삭제">✕</button>\n    </li>\n  `).join("");\n  const doneCount = todos.filter(t => t.done).length;\n  countEl.textContent = `${doneCount} / ${todos.length}개 완료`;\n}\n\nfunction addTodo() {\n  const text = input.value.trim();\n  if (!text) return;\n  todos.push({ id: nextId++, text, done: false });\n  input.value = "";\n  render();\n}\n\naddBtn.addEventListener("click", addTodo);\ninput.addEventListener("keyup", (e) => { if (e.key === "Enter") addTodo(); });\n\nlist.addEventListener("click", (e) => {\n  const li = e.target.closest("li");\n  if (!li) return;\n  const id = Number(li.dataset.id);\n  if (e.target.tagName === "BUTTON") {\n    todos = todos.filter(t => t.id !== id);\n  } else if (e.target.tagName === "INPUT") {\n    const t = todos.find(t => t.id === id);\n    if (t) t.done = !t.done;\n  }\n  render();\n});\n\nrender();'
      },
      {
        name: '별점 평가 위젯 (Hover 미리보기)',
        html: '<div class="rating" id="rating">\n  <span class="star" data-v="1">★</span>\n  <span class="star" data-v="2">★</span>\n  <span class="star" data-v="3">★</span>\n  <span class="star" data-v="4">★</span>\n  <span class="star" data-v="5">★</span>\n</div>\n<p id="ratingText">별점을 선택해보세요</p>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\n.rating{font-size:36px;cursor:pointer;user-select:none}\n.star{color:#2a3348;transition:color .15s,transform .15s;display:inline-block}\n.star.hover,.star.selected{color:#f2a93b}\n.star:hover{transform:scale(1.15)}\n#ratingText{margin-top:10px;color:#9aa4bb;font-size:13px}',
        js: 'const stars = document.querySelectorAll(".star");\nconst ratingText = document.getElementById("ratingText");\nlet selected = 0;\n\nfunction paint(value) {\n  stars.forEach(s => {\n    s.classList.toggle("hover", Number(s.dataset.v) <= value);\n  });\n}\n\nstars.forEach(star => {\n  star.addEventListener("mouseenter", () => paint(Number(star.dataset.v)));\n  star.addEventListener("mouseleave", () => paint(selected));\n  star.addEventListener("click", () => {\n    selected = Number(star.dataset.v);\n    stars.forEach(s => s.classList.toggle("selected", Number(s.dataset.v) <= selected));\n    paint(selected);\n    ratingText.textContent = `${selected}점을 선택하셨습니다`;\n  });\n});'
      },
      {
        name: '타자기 효과 텍스트 애니메이션',
        html: '<h2 id="typewriter"></h2>\n<button id="restart">다시 재생</button>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\n#typewriter{min-height:40px;font-family:monospace}\n#typewriter::after{content:"|";animation:blink 1s step-end infinite;color:#f2a93b}\n@keyframes blink{50%{opacity:0}}\nbutton{margin-top:16px;padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const messages = [\n  "한 글자씩 출력됩니다.",\n  "setTimeout으로 문자열을 순서대로 붙여나가는 방식입니다.",\n  "터미널이나 챗봇 UI에서 자주 보는 연출이죠."\n];\nconst el = document.getElementById("typewriter");\nlet msgIndex = 0, charIndex = 0, timer = null;\n\nfunction typeNext() {\n  if (charIndex <= messages[msgIndex].length) {\n    el.textContent = messages[msgIndex].slice(0, charIndex);\n    charIndex++;\n    timer = setTimeout(typeNext, 45);\n  } else {\n    timer = setTimeout(() => {\n      msgIndex = (msgIndex + 1) % messages.length;\n      charIndex = 0;\n      typeNext();\n    }, 1200);\n  }\n}\n\nfunction start() {\n  clearTimeout(timer);\n  msgIndex = 0; charIndex = 0;\n  typeNext();\n}\n\ndocument.getElementById("restart").addEventListener("click", start);\nstart();'
      },
      {
        name: '클립보드 복사 버튼',
        html: '<div class="copy-box">\n  <code id="copyText">npm install vue@latest</code>\n  <button id="copyBtn">복사</button>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.copy-box{display:flex;align-items:center;gap:10px;background:#161d2e;border:1px solid #2a3348;border-radius:8px;padding:10px 14px}\n.copy-box code{flex:1;font-family:monospace;font-size:13px;color:#f2a93b}\n.copy-box button{padding:6px 14px;border-radius:6px;border:1px solid #2a3348;background:transparent;color:#eef1f8;cursor:pointer;font-size:12.5px}\n.copy-box button.copied{background:#3ecf8e;border-color:#3ecf8e;color:#131A2A}',
        js: 'const btn = document.getElementById("copyBtn");\nconst text = document.getElementById("copyText").textContent;\n\n// Clipboard API가 이 미리보기 iframe처럼 권한이 제한된 환경에서 막힐 수 있어,\n// 실패하면 임시 textarea + execCommand로 한 번 더 시도하는 폴백을 둔다.\nasync function copyText(str) {\n  try {\n    await navigator.clipboard.writeText(str);\n    return true;\n  } catch (e) {\n    try {\n      const ta = document.createElement("textarea");\n      ta.value = str;\n      ta.style.position = "fixed";\n      ta.style.opacity = "0";\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand("copy");\n      document.body.removeChild(ta);\n      return true;\n    } catch (e2) {\n      return false;\n    }\n  }\n}\n\nbtn.addEventListener("click", async () => {\n  const ok = await copyText(text);\n  btn.textContent = ok ? "복사됨!" : "복사 실패";\n  btn.classList.toggle("copied", ok);\n  setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("copied"); }, 1500);\n});'
      }
    ],
    VUE: [
      {
        name: '드래그로 순서 바꾸는 리스트',
        html: '<div id="app">\n  <div\n    v-for="(item, i) in items"\n    :key="item"\n    draggable="true"\n    class="row"\n    @dragstart="dragIndex = i"\n    @dragover.prevent\n    @drop="onDrop(i)"\n  >{{ item }}</div>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.row{padding:10px;background:#161d2e;border-radius:6px;margin-bottom:6px;cursor:grab}',
        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const items = ref(["첫 번째", "두 번째", "세 번째", "네 번째"]);\n    const dragIndex = ref(null);\n    function onDrop(i) {\n      const arr = items.value;\n      const [moved] = arr.splice(dragIndex.value, 1);\n      arr.splice(i, 0, moved);\n    }\n    return { items, dragIndex, onDrop };\n  }\n}).mount("#app");'
      },
      {
        name: '카드 짝맞추기 게임 (메모리 게임)',
        html: '<div id="app">\n  <p>시도 횟수: {{ tries }} / 남은 카드: {{ remaining }}</p>\n  <div class="grid">\n    <div\n      v-for="(card, i) in cards"\n      :key="i"\n      class="tile"\n      :class="{ open: card.open || card.matched, matched: card.matched }"\n      @click="flip(i)"\n    >{{ card.open || card.matched ? card.emoji : "?" }}</div>\n  </div>\n  <button @click="reset">다시 섞기</button>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\n.grid{display:grid;grid-template-columns:repeat(4,60px);gap:8px;justify-content:center;margin:16px 0}\n.tile{width:60px;height:60px;background:#161d2e;border:1px solid #2a3348;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:background .2s,transform .2s}\n.tile.open{background:#243149;transform:scale(1.05)}\n.tile.matched{background:rgba(242,169,59,.2);border-color:#f2a93b}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { createApp, ref, computed } = Vue;\n\nconst EMOJIS = ["🍎","🍌","🍒","🍇","🍉","🍑","🍋","🥝"];\n\nfunction shuffled() {\n  const pairs = [...EMOJIS, ...EMOJIS];\n  for (let i = pairs.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];\n  }\n  return pairs.map(emoji => ({ emoji, open: false, matched: false }));\n}\n\ncreateApp({\n  setup() {\n    const cards = ref(shuffled());\n    const tries = ref(0);\n    const openIndexes = ref([]);\n    const remaining = computed(() => cards.value.filter(c => !c.matched).length);\n\n    function flip(i) {\n      const card = cards.value[i];\n      if (card.open || card.matched || openIndexes.value.length >= 2) return;\n      card.open = true;\n      openIndexes.value.push(i);\n\n      if (openIndexes.value.length === 2) {\n        tries.value++;\n        const [a, b] = openIndexes.value;\n        if (cards.value[a].emoji === cards.value[b].emoji) {\n          cards.value[a].matched = true;\n          cards.value[b].matched = true;\n          openIndexes.value = [];\n        } else {\n          setTimeout(() => {\n            cards.value[a].open = false;\n            cards.value[b].open = false;\n            openIndexes.value = [];\n          }, 700); // 틀렸을 때 잠깐 보여준 뒤 다시 뒤집는다 — 반응형 상태 변화가 그대로 화면에 애니메이션된다\n        }\n      }\n    }\n\n    function reset() {\n      cards.value = shuffled();\n      tries.value = 0;\n      openIndexes.value = [];\n    }\n\n    return { cards, tries, remaining, flip, reset };\n  }\n}).mount("#app");'
      },
      {
        name: '캔버스 그림판 (마우스 이벤트 바인딩)',
        html: '<div id="app">\n  <div class="tools">\n    <button v-for="c in colors" :key="c" :style="{background:c}" class="swatch" :class="{on:color===c}" @click="color=c"></button>\n    <button @click="clear">지우기</button>\n  </div>\n  <canvas\n    ref="canvas"\n    width="400" height="260"\n    @mousedown="start"\n    @mousemove="draw"\n    @mouseup="stop"\n    @mouseleave="stop"\n  ></canvas>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\ncanvas{background:#161d2e;border:1px solid #2a3348;border-radius:8px;cursor:crosshair}\n.tools{display:flex;gap:8px;justify-content:center;margin-bottom:12px}\n.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}\n.swatch.on{border-color:#eef1f8}\n.tools button:last-child{border-radius:6px;padding:0 12px;background:#243149;color:#eef1f8;border:1px solid #2a3348}',
        js: 'const { createApp, ref, onMounted } = Vue;\n\ncreateApp({\n  setup() {\n    const canvas = ref(null);\n    const colors = ["#f2a93b", "#f04452", "#3182f6", "#3ecf8e", "#eef1f8"];\n    const color = ref(colors[0]);\n    let ctx, drawing = false;\n\n    onMounted(() => { ctx = canvas.value.getContext("2d"); });\n\n    function pos(e) {\n      const rect = canvas.value.getBoundingClientRect();\n      return { x: e.clientX - rect.left, y: e.clientY - rect.top };\n    }\n    function start(e) {\n      drawing = true;\n      const { x, y } = pos(e);\n      ctx.beginPath();\n      ctx.moveTo(x, y);\n    }\n    function draw(e) {\n      if (!drawing) return;\n      const { x, y } = pos(e);\n      ctx.strokeStyle = color.value;\n      ctx.lineWidth = 4;\n      ctx.lineCap = "round";\n      ctx.lineTo(x, y);\n      ctx.stroke();\n    }\n    function stop() { drawing = false; }\n    function clear() { ctx.clearRect(0, 0, canvas.value.width, canvas.value.height); }\n\n    return { canvas, colors, color, start, draw, stop, clear };\n  }\n}).mount("#app");'
      },
      {
        name: '좋아요 버튼 + 하트 팝 애니메이션',
        html: '<div id="app">\n  <button class="like" @click="like">\n    <span class="heart" :class="{pop: popping}">❤️</span>\n    좋아요 {{ count }}\n  </button>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\n.like{padding:12px 24px;border-radius:999px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}\n.heart{display:inline-block;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}\n.heart.pop{transform:scale(1.6)}',
        js: '// Vue의 반응형 상태(popping)를 짧게 true로 바꿨다가 되돌리면, CSS transition이 그 순간의\n// 변화를 자동으로 애니메이션 처리해준다 — 별도의 애니메이션 라이브러리 없이도 충분하다\nconst { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const count = ref(0);\n    const popping = ref(false);\n    function like() {\n      count.value++;\n      popping.value = true;\n      setTimeout(() => { popping.value = false; }, 250);\n    }\n    return { count, popping, like };\n  }\n}).mount("#app");'
      },
      {
        name: '비밀번호 강도 실시간 표시',
        html: '<div id="app">\n  <input :type="show ? \'text\' : \'password\'" v-model="pw" placeholder="비밀번호 입력">\n  <label><input type="checkbox" v-model="show"> 표시</label>\n  <div class="bar"><div class="fill" :style="{ width: score*25+\'%\', background: color }"></div></div>\n  <p>{{ label }}</p>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8;margin-bottom:8px}\nlabel{font-size:12px;color:#9aa4bb}\n.bar{height:8px;background:#161d2e;border-radius:999px;overflow:hidden;margin:10px 0 6px}\n.fill{height:100%;transition:width .3s,background .3s}',
        js: 'const { createApp, ref, computed } = Vue;\ncreateApp({\n  setup() {\n    const pw = ref("");\n    const show = ref(false);\n\n    // 조건을 만족할 때마다 점수를 올린다 — computed라 pw가 바뀔 때마다 자동으로 재계산된다\n    const score = computed(() => {\n      let s = 0;\n      if (pw.value.length >= 8) s++;\n      if (/[A-Z]/.test(pw.value)) s++;\n      if (/[0-9]/.test(pw.value)) s++;\n      if (/[^A-Za-z0-9]/.test(pw.value)) s++;\n      return s;\n    });\n    const color = computed(() => ["#f04452","#f04452","#f2a93b","#f2a93b","#3ecf8e"][score.value]);\n    const label = computed(() => ["매우 약함","약함","보통","강함","매우 강함"][score.value]);\n\n    return { pw, show, score, color, label };\n  }\n}).mount("#app");'
      },
      {
        name: '할 일 목록 (watch로 변화 감지)',
        html: '<div class="row">\n  <input v-model="newTodo" @keyup.enter="add" placeholder="할 일을 입력하고 Enter">\n  <button @click="add">추가</button>\n</div>\n<ul>\n  <li v-for="t in todos" :key="t.id" :class="{done: t.done}">\n    <input type="checkbox" v-model="t.done">\n    <span>{{ t.text }}</span>\n    <button @click="remove(t.id)">✕</button>\n  </li>\n</ul>\n<p class="status" :class="{flash: justChanged}">{{ doneCount }} / {{ todos.length }}개 완료</p>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.row{display:flex;gap:8px;margin-bottom:12px}\n.row input{flex:1;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\n.row button{padding:8px 14px;border-radius:6px;border:0;background:#f2a93b;cursor:pointer;font-weight:600}\nul{list-style:none;padding:0;margin:0}\nli{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#161d2e;border-radius:6px;margin-bottom:6px}\nli.done span{text-decoration:line-through;color:#9aa4bb}\nli button{margin-left:auto;background:transparent;border:0;color:#f88;cursor:pointer;font-size:16px}\n.status{margin-top:10px;font-size:12px;color:#9aa4bb;transition:color .3s}\n.status.flash{color:#f2a93b}',
        js: 'const { createApp, ref, computed, watch } = Vue;\ncreateApp({\n  setup() {\n    const todos = ref([\n      { id: 1, text: "예제 코드 살펴보기", done: false },\n      { id: 2, text: "watch로 변화 감지해보기", done: false }\n    ]);\n    const newTodo = ref("");\n    let nextId = 3;\n    const doneCount = computed(() => todos.value.filter(t => t.done).length);\n    const justChanged = ref(false);\n\n    // watch는 데이터가 바뀔 때마다 "부수 효과"를 실행할 때 쓴다 — 여기서는 완료 개수가\n    // 바뀔 때마다 텍스트를 잠깐 강조색으로 반짝이게 한다(실무에서는 이 자리에\n    // 서버 저장 API 호출이나 로깅이 들어가는 경우가 많다).\n    watch(doneCount, () => {\n      justChanged.value = true;\n      setTimeout(() => { justChanged.value = false; }, 400);\n    });\n\n    function add() {\n      const text = newTodo.value.trim();\n      if (!text) return;\n      todos.value.push({ id: nextId++, text, done: false });\n      newTodo.value = "";\n    }\n    function remove(id) {\n      todos.value = todos.value.filter(t => t.id !== id);\n    }\n\n    return { todos, newTodo, doneCount, justChanged, add, remove };\n  }\n}).mount("#app");'
      },
      {
        name: '탭 전환 UI (Transition 애니메이션)',
        html: '<div class="tabs">\n  <button v-for="t in tabs" :key="t" :class="{on: current===t}" @click="current=t">{{ t }}</button>\n</div>\n<transition name="fade" mode="out-in">\n  <div :key="current" class="panel">{{ content[current] }}</div>\n</transition>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.tabs{display:flex;gap:6px;margin-bottom:14px}\n.tabs button{padding:8px 16px;border-radius:8px;border:1px solid #2a3348;background:#161d2e;color:#9aa4bb;cursor:pointer}\n.tabs button.on{background:#f2a93b;color:#131A2A;border-color:#f2a93b;font-weight:600}\n.panel{background:#161d2e;border:1px solid #2a3348;border-radius:10px;padding:20px;min-height:80px}\n.fade-enter-active,.fade-leave-active{transition:opacity .2s,transform .2s}\n.fade-enter-from{opacity:0;transform:translateY(6px)}\n.fade-leave-to{opacity:0;transform:translateY(-6px)}',
        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const tabs = ["소개", "기능", "문의"];\n    const current = ref("소개");\n    const content = {\n      "소개": "Vue의 <transition> 컴포넌트는 요소가 나타나고 사라질 때 CSS 클래스를 자동으로 붙여준다.",\n      "기능": "mode=\\"out-in\\"을 주면 이전 내용이 완전히 사라진 뒤에 새 내용이 나타나 겹치지 않는다.",\n      "문의": ":key=\\"current\\"를 바꿔주는 것이 핵심 — Vue가 이걸 보고 \\"다른 요소\\"로 인식해 트랜지션을 건다."\n    };\n    return { tabs, current, content };\n  }\n}).mount("#app");'
      },
      {
        name: '스톱워치 (setInterval + computed 포맷)',
        html: '<div class="time">{{ formatted }}</div>\n<div class="controls">\n  <button @click="toggle">{{ running ? "일시정지" : "시작" }}</button>\n  <button @click="reset">리셋</button>\n</div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8;text-align:center}\n.time{font-family:monospace;font-size:42px;font-weight:700;margin-bottom:16px;letter-spacing:2px}\n.controls{display:flex;gap:8px;justify-content:center}\n.controls button{padding:8px 18px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;font-weight:600}\n.controls button:last-child{background:#243149;color:#eef1f8}',
        js: 'const { createApp, ref, computed, onUnmounted } = Vue;\ncreateApp({\n  setup() {\n    const elapsedMs = ref(0);\n    const running = ref(false);\n    let raf = null;\n    let lastTick = 0;\n\n    const formatted = computed(() => {\n      const totalSec = Math.floor(elapsedMs.value / 1000);\n      const m = String(Math.floor(totalSec / 60)).padStart(2, "0");\n      const s = String(totalSec % 60).padStart(2, "0");\n      const cs = String(Math.floor((elapsedMs.value % 1000) / 10)).padStart(2, "0");\n      return `${m}:${s}.${cs}`;\n    });\n\n    function tick() {\n      const now = Date.now();\n      elapsedMs.value += now - lastTick;\n      lastTick = now;\n      raf = requestAnimationFrame(tick);\n    }\n    function toggle() {\n      running.value = !running.value;\n      if (running.value) {\n        lastTick = Date.now();\n        raf = requestAnimationFrame(tick);\n      } else {\n        cancelAnimationFrame(raf);\n      }\n    }\n    function reset() {\n      elapsedMs.value = 0;\n      if (running.value) lastTick = Date.now();\n    }\n    onUnmounted(() => cancelAnimationFrame(raf));\n\n    return { formatted, running, toggle, reset };\n  }\n}).mount("#app");'
      },
      {
        name: '실시간 폼 검증 (다중 필드)',
        html: '<div class="field">\n  <input v-model="name" placeholder="이름 (2자 이상)">\n  <span class="hint" :class="nameValid ? \'ok\' : \'bad\'">{{ name ? (nameValid ? "✓" : "2자 이상 입력하세요") : "" }}</span>\n</div>\n<div class="field">\n  <input v-model="email" placeholder="이메일">\n  <span class="hint" :class="emailValid ? \'ok\' : \'bad\'">{{ email ? (emailValid ? "✓" : "이메일 형식이 아닙니다") : "" }}</span>\n</div>\n<div class="field">\n  <input v-model="pw" type="password" placeholder="비밀번호 (8자 이상)">\n  <span class="hint" :class="pwValid ? \'ok\' : \'bad\'">{{ pw ? (pwValid ? "✓" : "8자 이상 입력하세요") : "" }}</span>\n</div>\n<button :disabled="!allValid">{{ allValid ? "가입하기" : "모든 항목을 올바르게 입력하세요" }}</button>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\n.field{margin-bottom:14px}\n.field input{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8}\n.hint{display:block;font-size:11.5px;margin-top:4px;height:14px}\n.hint.ok{color:#3ecf8e}\n.hint.bad{color:#f88}\nbutton{padding:10px 18px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;font-weight:600}\nbutton:disabled{background:#2a3348;color:#6b7592;cursor:not-allowed}',
        js: 'const { createApp, ref, computed } = Vue;\ncreateApp({\n  setup() {\n    const name = ref("");\n    const email = ref("");\n    const pw = ref("");\n\n    const nameValid = computed(() => name.value.trim().length >= 2);\n    const emailValid = computed(() => /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email.value));\n    const pwValid = computed(() => pw.value.length >= 8);\n    const allValid = computed(() => nameValid.value && emailValid.value && pwValid.value);\n\n    return { name, email, pw, nameValid, emailValid, pwValid, allValid };\n  }\n}).mount("#app");'
      },

        html: '<div class="stars">\n  <span\n    v-for="n in 5"\n    :key="n"\n    class="star"\n    :class="{on: n <= (hovered || selected)}"\n    @mouseenter="hovered = n"\n    @mouseleave="hovered = 0"\n    @click="selected = n"\n  >★</span>\n</div>\n<p>{{ selected ? selected + "점을 선택하셨습니다" : "별점을 선택해보세요" }}</p>',

        js: 'const { createApp, ref } = Vue;\ncreateApp({\n  setup() {\n    const hovered = ref(0);\n    const selected = ref(0);\n    return { hovered, selected };\n  }\n}).mount("#app");'

    REACT: [
      {
        name: 'useReducer로 장바구니 상태 관리',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 14px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-right:8px;margin-bottom:10px}\nli{margin:6px 0}',
        js: 'const { useReducer } = React;\n\n// 상태 변경 로직을 한 곳(reducer)에 모아두면, 상태가 복잡해질수록 useState를 여러 개\n// 흩어놓는 것보다 추적하기 쉬워진다(Redux와 같은 사고방식).\nfunction cartReducer(state, action) {\n  switch (action.type) {\n    case "add": return [...state, { id: Date.now(), name: action.name, price: action.price }];\n    case "remove": return state.filter(item => item.id !== action.id);\n    case "clear": return [];\n    default: return state;\n  }\n}\n\nfunction Cart() {\n  const [items, dispatch] = useReducer(cartReducer, []);\n  const total = items.reduce((sum, i) => sum + i.price, 0);\n\n  return (\n    <div>\n      <button onClick={() => dispatch({ type: "add", name: "커피", price: 4500 })}>커피 추가</button>\n      <button onClick={() => dispatch({ type: "add", name: "샌드위치", price: 6000 })}>샌드위치 추가</button>\n      <button onClick={() => dispatch({ type: "clear" })}>비우기</button>\n      <ul>\n        {items.map(item => (\n          <li key={item.id}>\n            {item.name} - {item.price}원{" "}\n            <button onClick={() => dispatch({ type: "remove", id: item.id })}>삭제</button>\n          </li>\n        ))}\n      </ul>\n      <p>합계: {total}원</p>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<Cart />);'
      },
      {
        name: '렌더링 시각화로 보는 useMemo/React.memo',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 14px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-right:8px;margin-bottom:10px}\n.flash-box{transition:background .4s;padding:10px;border-radius:8px}',
        js: '// 콘솔을 열지 않아도 눈으로 바로 보이도록, 컴포넌트가 렌더링될 때마다 배경이 잠깐\n// 주황색으로 번쩍이게 만들었다. "관계없는 카운터"를 눌러도 memo로 감싼 자식은\n// 번쩍이지 않는 걸 확인해보세요 — 그게 바로 memo가 막아주는 불필요한 렌더링이다.\nconst { useState, useMemo, memo, useRef, useEffect } = React;\n\nfunction FlashBox({ children }) {\n  const [flash, setFlash] = useState(false);\n  useEffect(() => {\n    setFlash(true);\n    const t = setTimeout(() => setFlash(false), 400);\n    return () => clearTimeout(t);\n  });\n  return <div className="flash-box" style={{ background: flash ? "#f2a93b55" : "transparent" }}>{children}</div>;\n}\n\nconst ExpensiveChild = memo(function ExpensiveChild({ value }) {\n  const renders = useRef(0);\n  renders.current++;\n  return (\n    <FlashBox>\n      <p>memo 자식 (렌더링 {renders.current}회) — value: {value}</p>\n    </FlashBox>\n  );\n});\n\nfunction heavyCompute(n) {\n  let total = 0;\n  for (let i = 0; i < n * 500000; i++) total += i % 3;\n  return total;\n}\n\nfunction App() {\n  const [count, setCount] = useState(0);\n  const [n, setN] = useState(1);\n  const result = useMemo(() => heavyCompute(n), [n]); // n이 바뀔 때만 재계산\n\n  return (\n    <FlashBox>\n      <button onClick={() => setCount(count + 1)}>관계없는 카운터: {count}</button>\n      <button onClick={() => setN(n + 1)}>무거운 계산 트리거: {n}</button>\n      <p>계산 결과: {result}</p>\n      <ExpensiveChild value={n} />\n    </FlashBox>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'
      },
      {
        name: '커스텀 훅 useDebounce + 검색',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\ninput{padding:8px;border-radius:6px;border:1px solid #2a3348;background:#161d2e;color:#eef1f8;width:100%;box-sizing:border-box}\nli{margin:4px 0}',
        js: 'const { useState, useEffect } = React;\n\n// 값이 바뀔 때마다 타이머를 다시 걸고, cleanup 함수(return)로 이전 타이머를 취소한다 —\n// useEffect의 cleanup을 이용한 디바운스의 정석적인 구현 방식\nfunction useDebounce(value, delay) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() => {\n    const t = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(t);\n  }, [value, delay]);\n  return debounced;\n}\n\nconst DATA = ["Apple", "Banana", "Cherry", "Date", "Grape", "Kiwi", "Mango", "Orange"];\n\nfunction Search() {\n  const [text, setText] = useState("");\n  const debounced = useDebounce(text, 400);\n  const results = debounced ? DATA.filter(f => f.toLowerCase().includes(debounced.toLowerCase())) : [];\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="과일 검색" />\n      <ul>\n        {results.map(f => <li key={f}>{f}</li>)}\n      </ul>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<Search />);'
      },
      {
        name: 'Portal로 모달 구현',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: 'const { useState } = React;\nconst { createPortal } = ReactDOM;\n\n// createPortal은 컴포넌트 트리(상태·이벤트 버블링)는 그대로 유지하면서\n// 실제 DOM만 다른 위치(여기서는 body)에 렌더링한다 — 모달·툴팁에 자주 쓰인다.\nfunction Modal({ onClose }) {\n  return createPortal(\n    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center" }}>\n      <div style={{ background: "#161d2e", padding: 24, borderRadius: 10 }}>\n        <p>document.body로 포탈된 모달입니다.</p>\n        <button onClick={onClose}>닫기</button>\n      </div>\n    </div>,\n    document.body\n  );\n}\n\nfunction App() {\n  const [open, setOpen] = useState(false);\n  return (\n    <div>\n      <button onClick={() => setOpen(true)}>모달 열기</button>\n      {open && <Modal onClose={() => setOpen(false)} />}\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'
      },
      {
        name: 'Error Boundary (클래스 컴포넌트)',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 16px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer}',
        js: '// Error Boundary는 아직 훅으로 만들 수 없어 클래스 컴포넌트로만 구현 가능하다(React 18 기준).\n// 자식 트리 렌더링 중 에러가 나면 전체 앱이 죽는 대신 이 컴포넌트가 대체 화면을 보여준다.\nclass ErrorBoundary extends React.Component {\n  constructor(props) {\n    super(props);\n    this.state = { hasError: false };\n  }\n  static getDerivedStateFromError() {\n    return { hasError: true };\n  }\n  render() {\n    if (this.state.hasError) {\n      return <p style={{ color: "#f88" }}>문제가 발생해서 이 부분만 대신 표시합니다.</p>;\n    }\n    return this.props.children;\n  }\n}\n\nfunction Bomb() {\n  throw new Error("의도적으로 발생시킨 에러");\n}\n\nfunction App() {\n  const [showBomb, setShowBomb] = React.useState(false);\n  return (\n    <div>\n      <button onClick={() => setShowBomb(true)}>에러 발생시키기</button>\n      <ErrorBoundary>\n        {showBomb ? <Bomb /> : <p>정상 상태입니다.</p>}\n      </ErrorBoundary>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'
      },
      {
        name: 'Context + useReducer 전역 상태 관리',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 14px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;margin-right:8px}',
        js: '// useReducer + useContext 조합은 별도 라이브러리 없이도 "전역 상태 관리"의 핵심 아이디어를\n// 그대로 구현한다 — 서로 멀리 떨어진 컴포넌트끼리 props 없이 상태를 공유·변경한다.\nconst { createContext, useContext, useReducer } = React;\n\nconst CounterContext = createContext(null);\n\nfunction counterReducer(state, action) {\n  switch (action.type) {\n    case "inc": return state + 1;\n    case "dec": return state - 1;\n    default: return state;\n  }\n}\n\nfunction CounterProvider({ children }) {\n  const [count, dispatch] = useReducer(counterReducer, 0);\n  return <CounterContext.Provider value={{ count, dispatch }}>{children}</CounterContext.Provider>;\n}\n\nfunction DisplayA() {\n  const { count } = useContext(CounterContext);\n  return <p>다른 컴포넌트(A)에서 본 값: {count}</p>;\n}\n\nfunction ButtonsB() {\n  const { dispatch } = useContext(CounterContext);\n  return (\n    <div>\n      <button onClick={() => dispatch({ type: "inc" })}>+1</button>\n      <button onClick={() => dispatch({ type: "dec" })}>-1</button>\n    </div>\n  );\n}\n\nfunction App() {\n  return (\n    <CounterProvider>\n      <DisplayA />\n      <ButtonsB />\n    </CounterProvider>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<App />);'
      },
      {
        name: 'useLocalStorage 커스텀 훅 + 할 일 목록',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 14px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;font-weight:600}',
        js: 'const { useState, useEffect } = React;\n\n// localStorage에 값을 자동 동기화하는 커스텀 훅. 이 미리보기 iframe은 보안상 저장소\n// 접근이 제한돼 있을 수 있어(sandbox 속성), try/catch로 감싸 접근이 막히면 조용히\n// 메모리 상태로만 동작하도록 했다 — 실제 배포 환경에서는 새로고침 후에도 정상적으로 유지된다.\nfunction useLocalStorage(key, initialValue) {\n  const [value, setValue] = useState(() => {\n    try {\n      const saved = window.localStorage.getItem(key);\n      return saved ? JSON.parse(saved) : initialValue;\n    } catch (e) {\n      return initialValue;\n    }\n  });\n\n  useEffect(() => {\n    try {\n      window.localStorage.setItem(key, JSON.stringify(value));\n    } catch (e) {\n      // 저장소 접근이 막힌 환경 — 이번 세션 동안 메모리 상태로만 유지된다\n    }\n  }, [key, value]);\n\n  return [value, setValue];\n}\n\nfunction TodoApp() {\n  const [todos, setTodos] = useLocalStorage("we-demo-todos", [\n    { id: 1, text: "예제 코드 살펴보기", done: false }\n  ]);\n  const [text, setText] = useState("");\n\n  function add() {\n    if (!text.trim()) return;\n    setTodos([...todos, { id: Date.now(), text: text.trim(), done: false }]);\n    setText("");\n  }\n  function toggle(id) {\n    setTodos(todos.map(t => t.id === id ? { ...t, done: !t.done } : t));\n  }\n  function remove(id) {\n    setTodos(todos.filter(t => t.id !== id));\n  }\n\n  return (\n    <div>\n      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>\n        <input value={text} onChange={e => setText(e.target.value)} onKeyUp={e => e.key === "Enter" && add()} placeholder="할 일을 입력하고 Enter" style={{ flex: 1, padding: 8, borderRadius: 6, border: "1px solid #2a3348", background: "#161d2e", color: "#eef1f8" }} />\n        <button onClick={add}>추가</button>\n      </div>\n      <ul style={{ listStyle: "none", padding: 0 }}>\n        {todos.map(t => (\n          <li key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: 8, background: "#161d2e", borderRadius: 6, marginBottom: 6 }}>\n            <input type="checkbox" checked={t.done} onChange={() => toggle(t.id)} />\n            <span style={{ textDecoration: t.done ? "line-through" : "none", color: t.done ? "#9aa4bb" : "#eef1f8" }}>{t.text}</span>\n            <button onClick={() => remove(t.id)} style={{ marginLeft: "auto", background: "transparent", border: 0, color: "#f88", cursor: "pointer" }}>✕</button>\n          </li>\n        ))}\n      </ul>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<TodoApp />);'
      },
      {
        name: '스톱워치 (useEffect cleanup)',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}\nbutton{padding:8px 18px;border-radius:8px;border:0;background:#f2a93b;cursor:pointer;font-weight:600}',
        js: 'const { useState, useRef, useEffect } = React;\n\nfunction formatTime(ms) {\n  const totalSec = Math.floor(ms / 1000);\n  const m = String(Math.floor(totalSec / 60)).padStart(2, "0");\n  const s = String(totalSec % 60).padStart(2, "0");\n  const cs = String(Math.floor((ms % 1000) / 10)).padStart(2, "0");\n  return `${m}:${s}.${cs}`;\n}\n\nfunction Stopwatch() {\n  const [elapsed, setElapsed] = useState(0);\n  const [running, setRunning] = useState(false);\n  const lastTick = useRef(0);\n  const frameRef = useRef(null);\n\n  useEffect(() => {\n    if (!running) return;\n    lastTick.current = Date.now();\n    function tick() {\n      const now = Date.now();\n      setElapsed(prev => prev + (now - lastTick.current));\n      lastTick.current = now;\n      frameRef.current = requestAnimationFrame(tick);\n    }\n    frameRef.current = requestAnimationFrame(tick);\n    // cleanup: 컴포넌트가 사라지거나 running이 바뀌기 직전에 반드시 애니메이션 프레임을\n    // 취소한다 — 안 하면 정지 버튼을 눌러도 내부적으로 계속 돌면서 리소스를 낭비한다\n    return () => cancelAnimationFrame(frameRef.current);\n  }, [running]);\n\n  return (\n    <div style={{ textAlign: "center" }}>\n      <div style={{ fontFamily: "monospace", fontSize: 42, fontWeight: 700, marginBottom: 16, letterSpacing: 2 }}>{formatTime(elapsed)}</div>\n      <button onClick={() => setRunning(r => !r)} style={{ marginRight: 8 }}>{running ? "일시정지" : "시작"}</button>\n      <button onClick={() => setElapsed(0)} style={{ background: "#243149", color: "#eef1f8" }}>리셋</button>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<Stopwatch />);'
      },
      {
        name: '별점 평가 위젯 (Hover 미리보기)',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}',
        js: 'const { useState } = React;\n\nfunction StarRating() {\n  const [hovered, setHovered] = useState(0);\n  const [selected, setSelected] = useState(0);\n  const display = hovered || selected;\n\n  return (\n    <div style={{ textAlign: "center" }}>\n      <div style={{ fontSize: 36, cursor: "pointer" }}>\n        {[1, 2, 3, 4, 5].map(n => (\n          <span\n            key={n}\n            onMouseEnter={() => setHovered(n)}\n            onMouseLeave={() => setHovered(0)}\n            onClick={() => setSelected(n)}\n            style={{ color: n <= display ? "#f2a93b" : "#2a3348", display: "inline-block", transition: "color .15s, transform .15s", transform: n <= display ? "scale(1.15)" : "scale(1)" }}\n          >★</span>\n        ))}\n      </div>\n      <p style={{ marginTop: 10, color: "#9aa4bb", fontSize: 13 }}>{selected ? `${selected}점을 선택하셨습니다` : "별점을 선택해보세요"}</p>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<StarRating />);'
      },
      {
        name: '탭 전환 UI (useState)',
        html: '<div id="root"></div>',
        css: 'body{font-family:sans-serif;padding:24px;background:#0b101b;color:#eef1f8}',
        js: 'const { useState } = React;\n\nconst CONTENT = {\n  "소개": "useState로 현재 선택된 탭 이름만 저장하고, 그 값에 따라 다른 내용을 렌더링한다.",\n  "기능": "조건부 렌더링을 여러 번 쓰는 대신 객체 조회로 깔끔하게 처리했다.",\n  "문의": "탭 UI는 React에서 가장 많이 쓰이는 패턴 중 하나 — 상태 하나로 화면 전체가 바뀐다."\n};\n\nfunction Tabs() {\n  const [current, setCurrent] = useState("소개");\n  return (\n    <div>\n      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>\n        {Object.keys(CONTENT).map(t => (\n          <button\n            key={t}\n            onClick={() => setCurrent(t)}\n            style={{\n              padding: "8px 16px", borderRadius: 8, cursor: "pointer",\n              border: "1px solid #2a3348",\n              background: current === t ? "#f2a93b" : "#161d2e",\n              color: current === t ? "#131A2A" : "#9aa4bb",\n              fontWeight: current === t ? 700 : 400\n            }}\n          >{t}</button>\n        ))}\n      </div>\n      <div style={{ background: "#161d2e", border: "1px solid #2a3348", borderRadius: 10, padding: 20, minHeight: 80 }}>\n        {CONTENT[current]}\n      </div>\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById("root")).render(<Tabs />);'
      }
    ]
  };
  const TEMPLATE_LABELS = { HTML_CSS_JS: 'JavaScript', VUE: 'Vue.js', REACT: 'React.js' };

  const App = {
    template: '#we-tpl',
    setup(){
      const template = ref('HTML_CSS_JS');
      const pane = ref('html');
      const saving = ref(false);
      const toast = ref('');
      const list = ref([]);
      const loadedFrom = ref('');
      const title = ref(''); // 저장 모달에 넘길 내부 상태(툴바에는 노출하지 않음)
      const showSaveModal = ref(false);
      const modalTitle = ref('');
      const saveError = ref(''); // 모달 바로 위에 띄우는 경고(하단 토스트 대신)
      const showExamplePanel = ref(false);

      const elHtml = ref(null), elCss = ref(null), elJs = ref(null), preview = ref(null);
      let editors = { html: null, css: null, js: null };
      let debounceTimer = null;

      const currentExamples = computed(() => EXAMPLES[template.value] || []);
      function templateLabel(t){ return TEMPLATE_LABELS[t] || t; }
      function formatDate(iso){
        try { return new Date(iso).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }); }
        catch (e) { return iso; }
      }

      function showToast(msg){
        toast.value = msg;
        setTimeout(() => { toast.value = ''; }, 2200);
      }

      /* ===== Monaco 초기화 ===== */
      async function initMonaco(){
        await window.monacoReadyPromise;
        const commonOpts = { theme: 'vs-dark', automaticLayout: true, minimap: { enabled: false }, fontSize: 13, tabSize: 2, wordWrap: 'on' };
        editors.html = monaco.editor.create(elHtml.value, { value: '', language: 'html', ...commonOpts });
        editors.css = monaco.editor.create(elCss.value, { value: '', language: 'css', ...commonOpts });
        editors.js = monaco.editor.create(elJs.value, { value: '', language: 'javascript', ...commonOpts });
        [editors.html, editors.css, editors.js].forEach(ed => {
          ed.onDidChangeModelContent(() => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(run, 600);
          });
        });
        loadExample(currentExamples.value[0] && currentExamples.value[0].name);
      }

      function setCode(html, css, js){
        if (editors.html) editors.html.setValue(html || '');
        if (editors.css) editors.css.setValue(css || '');
        if (editors.js) editors.js.setValue(js || '');
      }
      function getCode(){
        return {
          html: editors.html ? editors.html.getValue() : '',
          css: editors.css ? editors.css.getValue() : '',
          js: editors.js ? editors.js.getValue() : ''
        };
      }

      /* setCode()는 내부적으로 각 Monaco 모델의 값을 바꾸는데, 이때 onDidChangeModelContent가
         걸려 있어 600ms 뒤 run()이 자동으로 한 번 더 예약된다. 여기서 곧바로 run()을 명시적으로
         호출하면 "즉시 실행 + 600ms 뒤 예약된 실행"이 겹쳐 미리보기가 두 번 리로드되며
         깜빡이는 원인이 됐다 — 예약을 취소해 정확히 한 번만 실행되게 한다. */
      function setCodeAndRun(html, css, js){
        setCode(html, css, js);
        clearTimeout(debounceTimer);
        run();
      }

      function loadExample(name){
        const ex = currentExamples.value.find(e => e.name === name) || currentExamples.value[0];
        if (!ex) return;
        setCodeAndRun(ex.html, ex.css, ex.js);
      }

      function pickExample(name){
        loadExample(name);
        showExamplePanel.value = false;
      }

      function selectTemplate(t){
        if (template.value === t) return;
        template.value = t;
        loadedFrom.value = '';
        showExamplePanel.value = false;
        loadExample(currentExamples.value[0] && currentExamples.value[0].name);
      }

      /* ===== 실행 (미리보기 문서 생성) =====
         React는 iframe 안에서 Babel이 자동으로 <script type="text/babel">을 스캔해 변환하는
         방식 대신, 이 부모 페이지에 로드된 Babel Standalone으로 미리 순수 JS로 변환해서 넣는다
         — iframe.srcdoc을 매번 새로 그리는 환경에서는 iframe 내부 DOMContentLoaded 타이밍이
         어긋나 자동 스캔이 누락되는 경우가 있어(React 예제가 항상 빈 화면으로 보이던 원인),
         변환을 우리가 직접 제어해 항상 순수 JS만 iframe에 넘기는 쪽이 안정적이다.
         외부 라이브러리는 별도 입력창 없이 HTML 탭에 직접 <script src="...">를 적으면 되는데,
         그 태그가 이 html 문자열 안에 그대로 포함돼 body에 삽입되므로 브라우저가 알아서
         순서대로 로드·실행한다(별도 처리가 필요 없다). */
      function buildDoc(){
        const { html, css, js } = getCode();
        let frameworkScripts = '';
        let jsTag;
        if (template.value === 'VUE') {
          frameworkScripts = '<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><' + '/script>';
          jsTag = '<script>' + js + '<' + '/script>';
        } else if (template.value === 'REACT') {
          frameworkScripts =
            '<script src="https://unpkg.com/react@18/umd/react.production.min.js"><' + '/script>' +
            '<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><' + '/script>';
          let transformed;
          try {
            transformed = Babel.transform(js, { presets: ['react'] }).code;
          } catch (e) {
            const errMsg = String(e.message || e).replace(/"/g, '\\"').replace(/\n/g, ' ');
            transformed = 'document.body.innerHTML = "<pre style=\\"color:#f88;padding:16px;white-space:pre-wrap\\">JSX 문법 오류: ' + errMsg + '</pre>";';
          }
          jsTag = '<script>' + transformed + '<' + '/script>';
        } else {
          jsTag = '<script>' + js + '<' + '/script>';
        }
        return '<!DOCTYPE html><html><head><meta charset="utf-8">'
          + '<style>' + css + '</style>'
          + frameworkScripts
          + '</head><body>' + html + jsTag + '</body></html>';
      }

      function run(){
        if (!preview.value) return;
        preview.value.srcdoc = buildDoc();
      }

      function openInNewWindow(){
        const blob = new Blob([buildDoc()], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }

      /* ===== 저장 (모달) ===== */
      function openSaveModal(){
        saveError.value = '';
        modalTitle.value = title.value || '';
        showSaveModal.value = true;
      }
      function closeSaveModal(){
        showSaveModal.value = false;
      }
      async function confirmSave(){
        if (!modalTitle.value.trim()) { saveError.value = '제목을 입력해주세요.'; return; }
        saveError.value = '';
        title.value = modalTitle.value.trim();
        await save();
      }
      async function save(){
        saving.value = true;
        try {
          const { html, css, js } = getCode();
          const res = await fetch('/api/webeditor/snippets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title.value, template: template.value, html, css, js, libs: [] })
          });
          const data = await res.json();
          if (!res.ok) { saveError.value = data.error || '저장에 실패했습니다.'; return; }
          history.pushState(null, '', '/editor/' + data.id);
          loadedFrom.value = '';
          showSaveModal.value = false;
          showToast('저장되었습니다! 이 코드는 이제 공개 목록에서 누구나 볼 수 있습니다.');
          fetchList();
        } catch (e) {
          saveError.value = '저장 중 오류가 발생했습니다.';
        } finally {
          saving.value = false;
        }
      }

      /* ===== 목록/불러오기 ===== */
      async function fetchList(){
        try {
          const res = await fetch('/api/webeditor/snippets?limit=30');
          list.value = await res.json();
        } catch (e) { /* 무시 — 목록만 못 보여줄 뿐 에디터 자체는 계속 쓸 수 있음 */ }
      }

      async function loadSnippet(id){
        try {
          const res = await fetch('/api/webeditor/snippets/' + id);
          if (!res.ok) { showToast('불러오지 못했습니다.'); return; }
          const s = await res.json();
          template.value = s.template;
          await nextTick();
          setCodeAndRun(s.html, s.css, s.js);
          title.value = s.title + ' (복사본)';
          loadedFrom.value = s.title;
          history.pushState(null, '', '/editor/' + id);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          showToast('불러오는 중 오류가 발생했습니다.');
        }
      }

      onMounted(async () => {
        await initMonaco();
        fetchList();
        // URL에 슬러그(스니펫 id)가 있으면 그 스니펫을 바로 불러온다
        const parts = location.pathname.split('/').filter(Boolean); // ['editor', '42']
        if (parts[1] && /^\d+$/.test(parts[1])) {
          await loadSnippet(parts[1]);
        }
      });

      return {
        template, pane, saving, toast, list, loadedFrom, showSaveModal, modalTitle, saveError, showExamplePanel,
        elHtml, elCss, elJs, preview,
        currentExamples, templateLabel, formatDate,
        selectTemplate, loadExample, pickExample, run, openInNewWindow,
        openSaveModal, closeSaveModal, confirmSave, loadSnippet
      };
    }
  };

  createApp(App).mount('#editorApp');
})();
</script>
</body>
