<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지도 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
.map-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:4px}
.map-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.map-card:hover{border-color:var(--amber);transform:translateY(-2px)}
.map-card .icon{font-size:30px}
.map-card b{font-size:16px}
.map-card p{color:var(--mut);font-size:13.5px;line-height:1.7;flex:1}
.map-card .stack{font-family:var(--mono);font-size:11px;color:var(--dim)}
.map-card .pill{align-self:flex-start;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.pill.live{background:rgba(62,207,142,.14);color:var(--green)}
.pill.soon{background:rgba(255,255,255,.06);color:var(--dim)}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page"><h1>🗺️ 지도</h1></header>
  <p style="color:var(--mut);font-size:14px;margin-bottom:24px">네이버 지도 API 기반 위치 기능들. 아래 메뉴를 선택하세요.</p>
  <div class="map-cards">
    <a class="map-card" href="/map/food">
      <div class="icon">🍽</div>
      <b>맛집 지도</b>
      <p>키워드로 주변 맛집·카페·편의시설을 검색하고 지도에 마커로 표시합니다. 마커 클릭 시 별점·영업시간·전화번호 포함 상세 정보가 표시됩니다.</p>
      <div class="stack">카카오 Local API · 네이버 Maps</div>
      <span class="pill live">LIVE</span>
    </a>
    <div class="map-card" style="opacity:.7">
      <div class="icon">🏠</div>
      <b>부동산 시세</b>
      <p>국토부 실거래대실룰보고 API를 통해 아파트 실거래 내역을 지도에 시각화합니다.</p>
      <div class="stack">국토부 API · 네이버 Maps</div>
      <span class="pill soon">준비중</span>
    </div>
  </div>
</main>

<script src="/js/nav.js"></script>
</body>
</html>
