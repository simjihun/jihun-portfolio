<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지도 API · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
main{padding-bottom:0}
.mode-tabs{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;margin-bottom:14px}
.mode-tab{padding:8px 18px;border-radius:7px;border:0;background:transparent;color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer}
.mode-tab.on{background:var(--amber);color:#131A2A}

.map-shell{display:flex;flex-direction:column;gap:12px}
.search-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{flex:1;min-width:160px}
.search-bar button{padding:10px 18px;background:var(--amber);color:#131A2A;border:0;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
.search-bar button:hover{filter:brightness(1.1)}
.search-bar .btn-loc{background:var(--panel);border:1px solid var(--line);color:var(--mut)}
.search-bar .btn-loc.busy{opacity:.6;pointer-events:none}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-row select{flex:none;width:auto;min-width:120px}
.sort-toggle{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px;flex:none}
.sort-btn{padding:6px 12px;border-radius:6px;border:0;background:transparent;color:var(--mut);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sort-btn.on{background:var(--amber);color:#131A2A}

.map-area{display:grid;grid-template-columns:320px 1fr;gap:12px;min-height:0;height:calc(100vh - var(--navh) - 230px)}
.side-col{display:flex;flex-direction:column;gap:8px;min-height:0}
.map-wrap{position:relative;border-radius:12px;border:1px solid var(--line);overflow:hidden;min-height:320px}
.map-wrap .navermap{width:100%;height:100%}
.research-btn{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:none;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.research-btn:hover{border-color:var(--amber);color:var(--amber)}
.research-btn.show{display:block}
.result-panel{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.result-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .12s}
.result-item:hover,.result-item.on{border-color:var(--amber)}
.result-item .name{font-size:14px;font-weight:600;margin-bottom:3px}
.result-item .cat{font-size:11.5px;color:var(--amber);margin-bottom:4px}
.result-item .addr{font-size:12px;color:var(--mut)}
.result-item .phone{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:3px}
.result-item .url{font-size:11.5px;color:var(--blue);margin-top:2px;display:inline-block}
.result-item .url:hover{text-decoration:underline}
.result-item .price{font-family:var(--mono);font-weight:700;color:var(--green);font-size:14px;margin-top:4px}
.result-item .dist{font-family:var(--mono);font-size:11px;color:var(--blue);margin-top:2px}
.result-item .nogeo{color:var(--dim);font-size:11px;margin-top:3px}
.empty-msg{color:var(--dim);font-size:13px;padding:20px;text-align:center}
.paging{display:flex;gap:8px;justify-content:center;margin-top:4px;flex:none}
.paging button{padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font-size:12.5px}
.paging button:hover{color:var(--amber);border-color:var(--amber)}
.paging .cur{color:var(--amber);font-weight:700;font-family:var(--mono);line-height:2}
.api-warn{font-size:12px;color:var(--amber);padding:8px 12px;background:rgba(242,169,59,.08);border-radius:8px;border:1px solid rgba(242,169,59,.2);margin-bottom:12px}
.stat-row{display:flex;gap:16px;margin-bottom:2px;font-size:12.5px;color:var(--mut)}
.stat-row b{color:var(--ink);font-family:var(--mono)}

.iw{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:200px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.iw .name{font-weight:700;font-size:14px;margin-bottom:4px}
.iw .cat{font-size:11.5px;color:var(--amber)}
.iw .addr{font-size:12px;color:var(--mut);margin-top:4px}
.iw .price{font-family:var(--mono);font-weight:700;color:var(--green);font-size:13px;margin-top:6px}

@media (max-width:900px){
  .map-area{display:flex;flex-direction:column;height:auto}
  .map-wrap{height:300px;order:1}
  .side-col{order:2}
}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page" style="margin-bottom:10px">
    <h1>🗺️ 지도 API</h1>
  </header>
  <div class="skill-row">
    <span>Java</span><span>카카오 Local API</span><span>네이버 지도 SDK</span><span>네이버 마커 클러스터링</span><span>국토교통부 실거래가 API(XML)</span><span>카카오 지오코딩</span>
  </div>
  <div id="apiWarn" class="api-warn" style="display:none"></div>

  <div class="mode-tabs">
    <button class="mode-tab on" id="tabFood" onclick="switchMode('food')">🍽 맛집 지도</button>
    <button class="mode-tab" id="tabEstate" onclick="switchMode('estate')">🏠 부동산 시세</button>
  </div>

  <div class="map-shell">
    <!-- 맛집 검색바 -->
    <div class="search-bar" id="barFood">
      <input id="kw" placeholder="지역 + 업종 검색 (예: 화성 삼겹살, 수원 카페)" onkeydown="if(event.key==='Enter')searchFood()">
      <button onclick="searchFood()">검색</button>
      <button class="btn-loc" id="btnLoc" onclick="searchNear()">📍 현위치</button>
    </div>
    <div class="filter-row" id="filterFood">
      <select id="catSel" onchange="onFilterChange()">
        <option value="">전체 카테고리</option>
        <option value="FD6">🍴 음식점</option>
        <option value="CE7">☕ 카페</option>
        <option value="CS2">🏪 편의점</option>
        <option value="MT1">🛒 대형마트</option>
      </select>
      <div class="sort-toggle">
        <button class="sort-btn on" id="sortAccuracy" onclick="setSortMode('accuracy')">정확도순</button>
        <button class="sort-btn" id="sortDistance" onclick="setSortMode('distance')">거리순</button>
      </div>
      <span id="distRefLabel" style="font-size:11.5px;color:var(--mut)"></span>
    </div>
    <div style="font-size:11px;color:var(--dim);margin-top:-6px" id="catHintFood">카테고리만 선택하면 검색어 없이도 주변에서 찾아드려요.</div>

    <!-- 부동산 검색바 -->
    <div class="search-bar" id="barEstate" style="display:none">
      <select id="regionSel"></select>
      <select id="ymSel"></select>
      <input id="aptKw" placeholder="아파트명 (선택)" onkeydown="if(event.key==='Enter')searchEstate()">
      <button onclick="searchEstate()">조회</button>
    </div>

    <div class="map-area">
      <!-- 맛집/부동산 리스트도 지도처럼 완전히 분리된 영역으로 유지 → 탭을 옮겨다녀도 서로의 목록이 사라지지 않는다 -->
      <div class="side-col" id="colFood">
        <div class="result-panel" id="resultPanelFood">
          <div class="empty-msg">검색어를 입력하거나 현위치 버튼을 눌러보세요.</div>
        </div>
        <div class="paging" id="pagingFood"></div>
      </div>
      <div class="side-col" id="colEstate" style="display:none">
        <div id="estateStatEstate" class="stat-row" style="display:none"></div>
        <div class="result-panel" id="resultPanelEstate">
          <div class="empty-msg">지역과 년월을 선택하고 조회하세요.</div>
        </div>
      </div>

      <!-- 맛집/부동산 지도를 완전히 분리된 인스턴스로 유지 (뷰포트 독립) -->
      <div class="map-wrap" id="wrapFood">
        <div class="navermap" id="mapFood"></div>
        <button class="research-btn" id="reSearchBtn" onclick="researchHere()">🔄 이 지역에서 재검색</button>
      </div>
      <div class="map-wrap" id="wrapEstate" style="display:none">
        <div class="navermap" id="mapEstate"></div>
      </div>
    </div>
  </div>
</main>

<script src="/js/nav.js"></script>
<script>
const API = '/api/map';
let mapFood = null, mapEstate = null;      // 모드별 독립 지도 인스턴스
let markersFood = [], markersEstate = [];  // 모드별 독립 마커 목록
let map, markers;                          // 현재 활성 모드를 가리키는 참조
let infoWindow;
let curPage = 1, totalPage = 1;
let mode = 'food';
let nearCoords = null;      // 맛집 현위치/재검색 좌표 {lat,lng}
let userDragged = false;    // 사용자가 지도를 직접 움직였는지 (재검색 버튼 노출 판단)
let suppressAuto = false;   // true인 동안은 프로그램이 지도를 움직인 것으로 간주해 재검색 버튼을 띄우지 않음
const MAX_AUTO_ZOOM = 16;   // fitBounds로 자동 확대될 때의 최대 확대 단계 (지나친 확대 방지)
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// 맛집지도 필터/정렬 상태. category_group_code는 카카오 Local API 공식 코드(FD6=음식점, CE7=카페 등) —
// 평점·영업시간은 카카오 Local API 응답 자체에 없는 필드라 필터로 넣지 않는다.
let categoryFilter = '';
let sortMode = 'accuracy'; // 'accuracy' | 'distance'
let distanceRefLabel = ''; // 거리순 정렬 기준점 표시용('현위치' | '이 지역' | '지도 중심' | '')
let foodClusterer = null;  // 네이버 지도 마커 클러스터링 인스턴스(맛집 지도 전용)

/* ===== 지도별 마지막 위치 + 마지막 검색 결과 기억 (localStorage — 브라우저에 남는 쿠키 성격의 저장소) ===== */
function saveView(key, center, zoom) {
  try { localStorage.setItem('mapView:' + key, JSON.stringify({ lat: center.lat(), lng: center.lng(), zoom })); } catch (e) {}
}
function loadView(key) {
  try {
    const raw = localStorage.getItem('mapView:' + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveFoodState(kw, page, data) {
  try {
    localStorage.setItem('searchState:food', JSON.stringify({
      keyword: kw, nearCoords, page, categoryFilter, sortMode,
      pageableCount: data.meta?.pageable_count ?? 0,
      isEnd: data.meta?.is_end,
      places: data.documents || []
    }));
  } catch (e) {}
}
function loadFoodState() {
  try { const raw = localStorage.getItem('searchState:food'); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveEstateState(lawdCd, dealYmd, keyword, data) {
  try {
    localStorage.setItem('searchState:estate', JSON.stringify({
      lawdCd, dealYmd, keyword,
      items: data.items || [], count: data.count ?? 0, avgAmount: data.avgAmount ?? '-'
    }));
  } catch (e) {}
}
function loadEstateState() {
  try { const raw = localStorage.getItem('searchState:estate'); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}

/** 지도를 프로그램이 직접 옮길 때 사용. 이 안에서 일어난 이동은 "사용자가 드래그/줌 했다"로 치지 않는다. */
function moveMapSilently(fn) {
  suppressAuto = true;
  fn();
  setTimeout(() => { suppressAuto = false; }, 60);
}

/* ===== 모드 전환 ===== */
function switchMode(next){
  mode = next;
  $('tabFood').classList.toggle('on', mode === 'food');
  $('tabEstate').classList.toggle('on', mode === 'estate');
  $('barFood').style.display = mode === 'food' ? 'flex' : 'none';
  $('filterFood').style.display = mode === 'food' ? 'flex' : 'none';
  $('barEstate').style.display = mode === 'estate' ? 'flex' : 'none';
  $('wrapFood').style.display = mode === 'food' ? 'block' : 'none';
  $('wrapEstate').style.display = mode === 'estate' ? 'block' : 'none';
  $('colFood').style.display = mode === 'food' ? 'flex' : 'none';
  $('colEstate').style.display = mode === 'estate' ? 'flex' : 'none';
  $('reSearchBtn').classList.remove('show');

  // 활성 지도/마커 참조를 현재 모드로 교체 (두 모드의 지도·마커·리스트는 서로 독립적으로 유지됨 — 탭을 옮겨도 내용이 사라지지 않음)
  map = mode === 'food' ? mapFood : mapEstate;
  markers = mode === 'food' ? markersFood : markersEstate;

  history.replaceState(null, '', mode === 'estate' ? '/map/estate' : '/map/food');

  // 숨겨져 있다가 다시 보이는 지도는 컨테이너 크기 재계산이 필요함
  if (map) setTimeout(() => naver.maps.Event.trigger(map, 'resize'), 0);
}

/* ===== 지도 초기화 ===== */
async function initMap() {
  const cfg = await fetch(API + '/config').then(r => r.json());
  const health = await fetch(API + '/health').then(r => r.json());
  const warns = [];
  if (!health.kakaoKeySet) warns.push('KAKAO_API_KEY 미설정 (맛집 검색·부동산 좌표 비활성화)');
  if (!health.naverKeySet) warns.push('NAVER_MAP_CLIENT_ID 미설정 (지도 표시 불가)');
  if (!health.realEstateKeySet) warns.push('REALESTATE_API_KEY 미설정 (부동산 조회 비활성화)');
  if (warns.length) {
    $('apiWarn').style.display = 'block';
    $('apiWarn').textContent = '관리자 설정 필요 — ' + warns.join(' · ');
  }
  if (!cfg.naverMapClientId) return;

  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${cfg.naverMapClientId}&submodules=geocoder`;
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });

  // 네이버 지도 공식 마커 클러스터링 유틸(스크립트 하나짜리 유틸이라 별도 CDN에서 로드).
  // 이 라이브러리 로딩이 실패해도(CDN 장애 등) 지도 자체는 계속 정상 동작해야 하므로,
  // 여기서만 예외를 잡아 클러스터링 없이 진행한다(마커가 클러스터링 없이 개별로 표시됨).
  try {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/gh/navermaps/marker-tools.js@master/marker-clustering/src/MarkerClustering.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  } catch (e) {
    console.warn('[map] 마커 클러스터링 라이브러리를 불러오지 못해 클러스터링 없이 진행합니다.', e);
  }

  infoWindow = new naver.maps.InfoWindow({ anchorSkew: true, borderWidth: 0,
    backgroundColor: 'transparent', disableAnchor: false });

  mapFood = createMap('mapFood', 'food');
  mapEstate = createMap('mapEstate', 'estate');
  foodClusterer = createFoodClusterer();

  // 사용자가 직접 드래그 "또는 마우스 휠로 확대/축소" 했을 때만 재검색 버튼 노출 (맛집 모드 한정)
  naver.maps.Event.addListener(mapFood, 'dragstart', () => { if (!suppressAuto) userDragged = true; });
  naver.maps.Event.addListener(mapFood, 'zoom_changed', () => { if (!suppressAuto) userDragged = true; });
  naver.maps.Event.addListener(mapFood, 'idle', () => {
    saveView('food', mapFood.getCenter(), mapFood.getZoom());
    if (userDragged && mode === 'food') $('reSearchBtn').classList.add('show');
  });
  naver.maps.Event.addListener(mapEstate, 'idle', () => {
    saveView('estate', mapEstate.getCenter(), mapEstate.getZoom());
  });
}

/** 모드별 지도 생성. 이전에 보던 위치가 저장되어 있으면 그 위치로 복원한다. */
function createMap(elId, key) {
  const saved = loadView(key);
  return new naver.maps.Map(elId, {
    center: new naver.maps.LatLng(saved ? saved.lat : 37.5665, saved ? saved.lng : 126.9780),
    zoom: saved ? saved.zoom : 12,
    mapTypeControl: false
  });
}

/** 확대 단계별 클러스터 원형 아이콘(카운트 뱃지) 3단계 — 결과가 많아질수록 큰 원으로 표시 */
function buildClusterIcon(diameter, bg, fontSize) {
  return {
    content: `<div style="cursor:pointer;width:${diameter}px;height:${diameter}px;line-height:${diameter}px;text-align:center;border-radius:50%;background:${bg};color:#131A2A;font-weight:700;font-size:${fontSize}px;border:2px solid #0B101B;box-shadow:0 2px 8px rgba(0,0,0,.4)"><span class="cluster-label">0</span></div>`,
    size: new naver.maps.Size(diameter, diameter),
    anchor: new naver.maps.Point(diameter / 2, diameter / 2)
  };
}
function createFoodClusterer() {
  // 라이브러리 로딩이 실패했으면(위 try/catch) MarkerClustering 전역이 없다 — 이 경우
  // 클러스터링을 포기하고 null을 돌려주면, 마커는 renderFoodResults에서 지도에 직접 붙는다.
  if (typeof MarkerClustering === 'undefined') return null;
  return new MarkerClustering({
    minClusterSize: 2,
    maxZoom: 13,
    map: mapFood,
    markers: [],
    disableClickZoom: false,
    gridSize: 110,
    icons: [
      buildClusterIcon(38, 'rgba(242,169,59,.9)', 12),
      buildClusterIcon(50, 'rgba(242,169,59,.95)', 13),
      buildClusterIcon(62, '#F2A93B', 14)
    ],
    indexGenerator: [10, 30, 100],
    stylingFunction: function (clusterMarker, count) {
      const label = clusterMarker.getElement().querySelector('.cluster-label');
      if (label) label.innerText = count;
    }
  });
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers.length = 0; // 배열을 재할당하지 않고 비워야 mapFood/mapEstate용 배열과 동기화 유지
  if (mode === 'food' && foodClusterer) foodClusterer.setMarkers([]);
  infoWindow && infoWindow.close();
}

/** 카카오 category_group_code → 표시용 이모지 (음식점/카페/편의점/대형마트, 그 외는 핀 아이콘) */
function categoryEmoji(code) {
  switch (code) {
    case 'FD6': return '🍴';
    case 'CE7': return '☕';
    case 'CS2': return '🏪';
    case 'MT1': return '🛒';
    default: return '📍';
  }
}

/** 미터 단위 거리를 "540m" / "1.2km" 형태로 표시 (카카오 응답의 distance 필드) */
function fmtDistance(m) {
  const meters = Number(m);
  if (m == null || isNaN(meters)) return '';
  return meters >= 1000 ? (meters / 1000).toFixed(1) + 'km' : Math.round(meters) + 'm';
}

/** 맛집 지도 전용 마커 — 카테고리 이모지 원 + 리스트 순번 배지를 아래에 붙인 2단 구성 */
function addFoodMarker(pos, rank, catCode, onClick) {
  const emoji = categoryEmoji(catCode);
  const color = '#F2A93B';
  const marker = new naver.maps.Marker({
    map: foodClusterer ? null : map, // 클러스터러가 있으면 클러스터러가 표시를 전담
    position: pos,
    icon: {
      content: `<div style="display:flex;flex-direction:column;align-items:center">
        <div style="width:28px;height:28px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #0B101B">${emoji}</div>
        <div style="background:#131A2A;color:${color};font-weight:800;font-size:10px;padding:1px 6px;border-radius:999px;margin-top:2px;border:1px solid ${color};white-space:nowrap">${rank}</div>
      </div>`,
      anchor: new naver.maps.Point(14, 14)
    }
  });
  if (onClick) naver.maps.Event.addListener(marker, 'click', onClick);
  markers.push(marker);
  return marker;
}

/** 지도 마커 생성. color로 맛집(앰버)/부동산(블루)을 구분한다.
    attach=false면 지도에 직접 붙이지 않는다 — 클러스터러가 표시를 전담하는 맛집 지도용. */
function addMarker(pos, label, onClick, color, attach) {
  const marker = new naver.maps.Marker({
    map: attach === false ? null : map,
    position: pos,
    icon: {
      content: `<div style="background:${color || '#F2A93B'};color:#0B101B;font-weight:700;font-size:11px;padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);max-width:130px;overflow:hidden;text-overflow:ellipsis">${label}</div>`,
      anchor: new naver.maps.Point(14, 14)
    }
  });
  if (onClick) naver.maps.Event.addListener(marker, 'click', onClick);
  markers.push(marker);
  return marker;
}

/** panelId 안의 result-item 중 index번째만 선택 표시. 두 리스트가 항상 DOM에 함께 존재하므로 범위를 지정해야 한다. */
function highlightItem(index, panelId) {
  document.querySelectorAll('#' + panelId + ' .result-item').forEach((el, i) => el.classList.toggle('on', i === index));
}

/** 마커 클릭 이벤트를 그대로 재사용해, 지도는 움직이지 않고 정보창만 미리 보여준다 (리스트 마우스오버용). */
function previewMarker(index) {
  const marker = markers[index];
  if (marker) naver.maps.Event.trigger(marker, 'click');
}

/** 지도 범위에 맞춰 자동 확대하되, 결과가 몰려있어도 MAX_AUTO_ZOOM보다 더 확대되지 않게 제한한다. */
function fitBoundsCapped(bounds, padding) {
  moveMapSilently(() => {
    map.fitBounds(bounds, { padding });
    if (map.getZoom() > MAX_AUTO_ZOOM) map.setZoom(MAX_AUTO_ZOOM);
  });
}

/* ===== 맛집지도 필터/정렬 UI 핸들러 ===== */
function onFilterChange() {
  categoryFilter = $('catSel').value;
  triggerFoodResearchIfReady();
}
function setSortMode(next) {
  sortMode = next;
  $('sortAccuracy').classList.toggle('on', sortMode === 'accuracy');
  $('sortDistance').classList.toggle('on', sortMode === 'distance');
  triggerFoodResearchIfReady();
}
/** 검색어가 있거나(일반 검색) 카테고리만 선택되어 있으면(카테고리 전용 검색) 재검색을 트리거한다. */
function triggerFoodResearchIfReady() {
  if ($('kw').value.trim() || categoryFilter) performFoodSearch(1);
}
function updateDistRefUI(label) {
  $('distRefLabel').textContent = label ? ('📍 ' + label + ' 기준') : '';
}

/* ===================================================
   맛집 지도 (카카오 Local API)
   =================================================== */
function renderFoodResults(places, page, pageableCount, isEnd, keepView) {
  clearMarkers();
  const panel = $('resultPanelFood');
  if (!places.length) {
    panel.innerHTML = '<div class="empty-msg">검색 결과가 없습니다.</div>';
    $('pagingFood').innerHTML = '';
    return;
  }
  panel.innerHTML = places.map((p, i) => `
    <div class="result-item" onclick="focusMarker(${i})" onmouseenter="previewMarker(${i})" onmouseleave="infoWindow.close()">
      <div class="name">${categoryEmoji(p.category_group_code)} ${i + 1}. ${esc(p.place_name)}</div>
      <div class="cat">${esc(p.category_name?.split(' > ').pop() ?? '')}</div>
      <div class="addr">${esc(p.road_address_name || p.address_name)}</div>
      ${p.distance ? `<div class="dist">${fmtDistance(p.distance)}</div>` : ''}
      ${p.phone ? `<div class="phone">${esc(p.phone)}</div>` : ''}
      ${p.place_url ? `<a class="url" href="${p.place_url}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a>` : ''}
    </div>`).join('');

  places.forEach((p, i) => {
    const pos = new naver.maps.LatLng(+p.y, +p.x);
    addFoodMarker(pos, i + 1, p.category_group_code, () => {
      const html = `<div class="iw"><div class="name">${esc(p.place_name)}</div><div class="cat">${esc(p.category_name?.split(' > ').pop() ?? '')}</div><div class="addr">${esc(p.road_address_name || p.address_name)}</div></div>`;
      infoWindow.setContent(html);
      infoWindow.open(map, markers[i]);
      highlightItem(i, 'resultPanelFood');
    });
  });

  if (mode === 'food' && foodClusterer) {
    foodClusterer.setMarkers(markersFood);
    // setMarkers()만으로는 지도 뷰가 실제로 바뀌지 않으면(keepView=true인 "이 지역에서 재검색") 다시
    // 그려지지 않는 라이브러리 특성이 있어, idle 이벤트를 한 번 더 강제로 쏴서 즉시 리드로우시킨다.
    naver.maps.Event.trigger(mapFood, 'idle');
  }

  // "이 지역에서 재검색"으로 온 경우는 사용자가 잡은 화면 범위를 그대로 유지하고,
  // 그 외(첫 검색/현위치)에는 결과가 다 보이도록 자동으로 범위를 맞춘다 (단, 과도한 확대는 제한).
  if (!keepView) {
    const bounds = new naver.maps.LatLngBounds(
      new naver.maps.LatLng(Math.min(...places.map(p => +p.y)), Math.min(...places.map(p => +p.x))),
      new naver.maps.LatLng(Math.max(...places.map(p => +p.y)), Math.max(...places.map(p => +p.x)))
    );
    fitBoundsCapped(bounds, 60);
  }

  // 카카오 로컬 API는 total_count(전체 매칭 수)가 아니라 pageable_count(실제 열람 가능 건수, 최대 45페이지)로
  // 페이지네이션을 구성해야 실제 넘겨볼 수 있는 페이지 수와 일치한다.
  totalPage = Math.max(1, Math.ceil(pageableCount / 15));
  curPage = page;
  $('pagingFood').innerHTML = [
    `<button onclick="goPage(${page - 1})" ${page <= 1 ? 'disabled style="opacity:.3"' : ''}>‹ 이전</button>`,
    `<span class="cur">${page} / ${totalPage}</span>`,
    `<button onclick="goPage(${page + 1})" ${(page >= totalPage || isEnd) ? 'disabled style="opacity:.3"' : ''}>다음 ›</button>`
  ].join('');
}

function focusMarker(index) {
  const marker = markers[index];
  if (!marker) return;
  moveMapSilently(() => {
    map.setCenter(marker.getPosition());
    map.setZoom(16);
  });
  naver.maps.Event.trigger(marker, 'click');
  highlightItem(index, 'resultPanelFood');
}

/** 통합 검색 함수. nearCoords 또는 거리순 정렬/카테고리 전용 검색이면 좌표를 함께 보낸다. */
async function performFoodSearch(page = 1, keepView = false) {
  const kw = $('kw').value.trim();
  if (!kw && !categoryFilter) return; // 검색어도 카테고리도 없으면 검색할 게 없음
  let coords = nearCoords;
  let refLabel = distanceRefLabel;
  if ((sortMode === 'distance' || categoryFilter) && !coords) {
    // 거리순 정렬이거나 카테고리 전용 검색인데 기준 좌표가 없으면(현위치를 안 눌렀으면)
    // 현재 지도 중심을 기준점으로 사용한다. 카테고리 전용 검색은 위치가 필수라 이 좌표가 반드시 필요하다.
    const c = map.getCenter();
    coords = { lat: c.lat(), lng: c.lng() };
    refLabel = '지도 중심';
  }
  updateDistRefUI((sortMode === 'distance' || (categoryFilter && !kw)) ? (refLabel || '지도 중심') : '');

  let url = `${API}/search?keyword=${encodeURIComponent(kw)}&page=${page}&size=15`;
  if (coords) url += `&lat=${coords.lat}&lng=${coords.lng}`;
  if (categoryFilter) url += `&categoryGroupCode=${categoryFilter}`;
  const data = await fetch(url).then(r => r.json());
  if (data.error) {
    $('resultPanelFood').innerHTML = `<div class="empty-msg">${esc(data.error)}</div>`;
    $('pagingFood').innerHTML = '';
    return;
  }
  renderFoodResults(data.documents || [], page, data.meta?.pageable_count ?? 0, data.meta?.is_end, keepView);
  saveFoodState(kw, page, data);
  userDragged = false;
  $('reSearchBtn').classList.remove('show');
}

function searchFood(page = 1) {
  nearCoords = null; // 일반 검색은 전국 대상, 위치 제한 없음(거리순을 골랐다면 지도 중심을 기준으로 사용)
  distanceRefLabel = '';
  performFoodSearch(page);
}

function searchNear() {
  const btn = $('btnLoc');
  btn.classList.add('busy');
  btn.textContent = '위치 확인 중...';
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    nearCoords = { lat, lng };
    distanceRefLabel = '현위치';
    moveMapSilently(() => {
      map.setCenter(new naver.maps.LatLng(lat, lng));
      map.setZoom(15);
    });
    if (!$('kw').value.trim() && !categoryFilter) $('kw').value = '맛집';
    performFoodSearch(1);
    btn.classList.remove('busy');
    btn.textContent = '📍 현위치';
  }, () => {
    alert('위치 정보 접근을 허용해주세요. (브라우저 주소창 왼쪽 자물쇠 아이콘에서 위치 권한을 확인하세요)');
    btn.classList.remove('busy');
    btn.textContent = '📍 현위치';
  }, { enableHighAccuracy: true, timeout: 8000 });
}

/** "이 지역에서 재검색" — 현재 보고 있는 화면 범위를 그대로 유지한 채 그 중심 좌표로 다시 검색 */
function researchHere() {
  const center = map.getCenter();
  nearCoords = { lat: center.lat(), lng: center.lng() };
  distanceRefLabel = '이 지역';
  if (!$('kw').value.trim() && !categoryFilter) $('kw').value = '맛집';
  performFoodSearch(1, true); // keepView=true: 지도를 다시 확대/축소하지 않음
}

function goPage(page) {
  if (page < 1 || page > totalPage) return;
  if (mode === 'food') performFoodSearch(page, true); // 페이지 넘길 때도 보던 화면 유지
}

/* ===================================================
   부동산 시세 (국토부 실거래가 API)
   =================================================== */
let regions = [];

async function initEstateControls() {
  regions = await fetch(API + '/estate/regions').then(r => r.json());
  $('regionSel').innerHTML = regions.map(r => `<option value="${r.code}">${r.name}</option>`).join('');

  // 최근 6개월 옵션 (실거래가는 보통 지난달까지 집계되므로 1개월 전부터 시작)
  const now = new Date();
  now.setMonth(now.getMonth() - 1);
  const opts = [];
  for (let i = 0; i < 6; i++) {
    const y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0');
    opts.push(`<option value="${y}${m}">${y}년 ${m}월</option>`);
    now.setMonth(now.getMonth() - 1);
  }
  $('ymSel').innerHTML = opts.join('');
}

/** 짧은 가격 라벨 (지도 마커용): "11억 4,819만원" → "11억" */
function shortPrice(amountStr) {
  const m = amountStr.match(/^(\d+억)/);
  return m ? m[1] : amountStr.split(' ')[0];
}

function renderEstateResults(items, count, avgAmount, region) {
  clearMarkers();
  const panel = $('resultPanelEstate');

  if (!items.length) {
    if (region) moveMapSilently(() => { map.setCenter(new naver.maps.LatLng(region.lat, region.lng)); map.setZoom(12); });
    panel.innerHTML = '<div class="empty-msg">해당 조건의 거래 내역이 없습니다.</div>';
    $('estateStatEstate').style.display = 'none';
    return;
  }

  $('estateStatEstate').style.display = 'flex';
  $('estateStatEstate').innerHTML = `<span>거래건수 <b>${count}</b>건</span><span>평균가 <b>${avgAmount}</b></span>`;

  // 단지(아파트명+동) 단위로 마커를 만들고, 각 리스트 항목이 어느 마커에 속하는지 기록
  const complexMarkerIdx = {};   // key -> markers 배열 인덱스
  const itemMarkerIdx = [];      // items와 같은 순서로 매칭되는 마커 인덱스 (-1이면 위치 미확인)
  const positions = [];

  items.forEach(it => {
    if (it.lat == null || it.lng == null) { itemMarkerIdx.push(-1); return; }
    const key = it.dong + '|' + it.aptNm;
    if (!(key in complexMarkerIdx)) {
      const pos = new naver.maps.LatLng(it.lat, it.lng);
      const label = shortPrice(it.dealAmount);
      const marker = addMarker(pos, label, () => {
        const html = `<div class="iw"><div class="name">${esc(it.aptNm)}</div><div class="cat">${esc(it.dong)}</div><div class="price">${esc(it.dealAmount)} · ${esc(it.dealDate)}</div></div>`;
        infoWindow.setContent(html);
        infoWindow.open(map, marker);
      }, '#5AA2FF');
      complexMarkerIdx[key] = markers.length - 1;
      positions.push(pos);
    }
    itemMarkerIdx.push(complexMarkerIdx[key]);
  });

  if (positions.length) {
    const bounds = new naver.maps.LatLngBounds(positions[0], positions[0]);
    positions.forEach(p => bounds.extend(p));
    fitBoundsCapped(bounds, 90);
  } else if (region) {
    moveMapSilently(() => { map.setCenter(new naver.maps.LatLng(region.lat, region.lng)); map.setZoom(13); });
  }

  panel.innerHTML = items.map((it, i) => `
    <div class="result-item" onclick="focusEstateItem(${itemMarkerIdx[i]}, ${i})"
         onmouseenter="${itemMarkerIdx[i] >= 0 ? 'previewMarker(' + itemMarkerIdx[i] + ')' : ''}" onmouseleave="infoWindow.close()">
      <div class="name">${esc(it.aptNm)}</div>
      <div class="cat">${esc(it.dong)} · ${esc(it.area)}㎡ · ${esc(it.floor)}층 · ${esc(it.buildYear)}년건축</div>
      <div class="price">${esc(it.dealAmount)}</div>
      <div class="addr">거래일 ${esc(it.dealDate)}</div>
      ${it.lat == null ? '<div class="nogeo">지도 위치 확인 불가</div>' : ''}
    </div>`).join('');
}

function focusEstateItem(markerIdx, listIdx) {
  highlightItem(listIdx, 'resultPanelEstate');
  if (markerIdx < 0) return;
  const marker = markers[markerIdx];
  if (!marker) return;
  moveMapSilently(() => {
    map.setCenter(marker.getPosition());
    map.setZoom(16);
  });
  naver.maps.Event.trigger(marker, 'click');
}

async function searchEstate() {
  const lawdCd = $('regionSel').value;
  const dealYmd = $('ymSel').value;
  const keyword = $('aptKw').value.trim();
  const region = regions.find(r => r.code === lawdCd);

  $('resultPanelEstate').innerHTML = '<div class="empty-msg">조회 중...</div>';
  const qs = new URLSearchParams({ lawdCd, dealYmd });
  if (keyword) qs.set('keyword', keyword);
  const data = await fetch(`${API}/estate?` + qs).then(r => r.json());

  if (data.error) {
    $('resultPanelEstate').innerHTML = `<div class="empty-msg">${esc(data.error)}</div>`;
    $('estateStatEstate').style.display = 'none';
    return;
  }
  renderEstateResults(data.items || [], data.count ?? 0, data.avgAmount ?? '-', region);
  saveEstateState(lawdCd, dealYmd, keyword, data);
}

/* ===== 세션 복원: localStorage에 남아있는 마지막 검색 결과를 다시 그린다 (API 재호출 없음) ===== */
function restoreFood() {
  const saved = loadFoodState();
  if (!saved || !saved.places || !saved.places.length) return;
  $('kw').value = saved.keyword || '';
  nearCoords = saved.nearCoords || null;
  distanceRefLabel = nearCoords ? '이전 검색 위치' : '';
  categoryFilter = saved.categoryFilter || '';
  sortMode = saved.sortMode || 'accuracy';
  $('catSel').value = categoryFilter;
  $('sortAccuracy').classList.toggle('on', sortMode === 'accuracy');
  $('sortDistance').classList.toggle('on', sortMode === 'distance');
  map = mapFood; markers = markersFood;
  renderFoodResults(saved.places, saved.page || 1, saved.pageableCount || 0, saved.isEnd, true);
  updateDistRefUI((sortMode === 'distance' || (categoryFilter && !saved.keyword)) ? (distanceRefLabel || '지도 중심') : '');
}
function restoreEstate() {
  const saved = loadEstateState();
  if (!saved || !saved.items || !saved.items.length) return;
  $('regionSel').value = saved.lawdCd;
  $('ymSel').value = saved.dealYmd;
  $('aptKw').value = saved.keyword || '';
  const region = regions.find(r => r.code === saved.lawdCd);
  map = mapEstate; markers = markersEstate;
  renderEstateResults(saved.items, saved.count, saved.avgAmount, region);
}

/* ===== 초기화: URL에 따라 기본 탭 결정 ===== */
async function init() {
  await initMap();
  await initEstateControls();
  restoreFood();
  restoreEstate();
  if (location.pathname.includes('estate')) {
    switchMode('estate');
  } else {
    switchMode('food');
  }
}
init();
</script>
