<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 · hunit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/css/base.css">
<style>
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;cursor:pointer}
.tab.on{background:rgba(242,169,59,.12);border-color:var(--amber);color:var(--amber);font-weight:600}
.badge-status{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge-status.PENDING{background:rgba(242,169,59,.14);color:var(--amber)}
.badge-status.APPROVED{background:rgba(62,207,142,.14);color:var(--green)}
.badge-status.REJECTED{background:rgba(241,96,99,.14);color:var(--red)}
.row-btns{display:flex;gap:6px}
.row-btns button{padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:11.5px;cursor:pointer}
.row-btns button:hover{color:var(--amber);border-color:var(--amber)}
.crumb{color:var(--dim);font-size:12.5px;margin-bottom:6px}
.crumb a:hover{color:var(--amber)}
</style>
</head>
<body style="padding-top:0">
<div id="private-nav"></div>

<main>
  <div class="crumb"><a href="/admin">관리자</a> / 회원 관리</div>
  <header class="page"><h1>회원 관리</h1></header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-v="PENDING" onclick="selectStatus('PENDING')">승인 대기</button>
    <button class="tab" data-v="APPROVED" onclick="selectStatus('APPROVED')">승인됨</button>
    <button class="tab" data-v="REJECTED" onclick="selectStatus('REJECTED')">거절됨</button>
    <button class="tab" data-v="" onclick="selectStatus('')">전체</button>
  </div>

  <div class="panel">
    <div class="table-scroll">
      <table>
        <thead><tr><th>아이디</th><th>이름</th><th>휴대폰</th><th>이메일</th><th>권한</th><th>상태</th><th>가입일</th><th></th></tr></thead>
        <tbody id="memberBody"></tbody>
      </table>
    </div>
    <div class="empty" id="memberEmpty" style="display:none">해당 조건의 회원이 없습니다.</div>
  </div>
</main>

<script src="/js/private-nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let curStatus = 'PENDING';

loadMembers();

function selectStatus(status){
  curStatus = status;
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.v === status));
  loadMembers();
}

const fmt = t => t ? t.replace('T', ' ').substring(0, 16) : '-';

async function loadMembers(){
  const qs = curStatus ? '?status=' + curStatus : '';
  const list = await fetch('/api/admin/members' + qs).then(r => r.json());
  $('memberEmpty').style.display = list.length ? 'none' : 'block';
  $('memberBody').innerHTML = list.map(m => `
    <tr>
      <td>${esc(m.username)}</td>
      <td>${esc(m.name)}</td>
      <td>${esc(m.phone)}</td>
      <td>${esc(m.email)}</td>
      <td>${esc(m.role)}</td>
      <td><span class="badge-status ${m.status}">${m.status}</span></td>
      <td>${fmt(m.createdAt)}</td>
      <td>
        <div class="row-btns">
          ${m.status !== 'APPROVED' ? `<button onclick="updateStatus(${m.id},'approve')">승인</button>` : ''}
          ${m.status !== 'REJECTED' ? `<button onclick="updateStatus(${m.id},'reject')">거절</button>` : ''}
        </div>
      </td>
    </tr>`).join('');
}

async function updateStatus(id, action){
  await fetch(`/api/admin/members/${id}/${action}`, { method: 'POST' });
  loadMembers();
}
</script>
</body>
</html>
