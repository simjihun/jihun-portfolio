<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 뉴스 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
.fetch-info{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

.breaking{border-left:3px solid var(--red);margin-bottom:16px}
.breaking h2{color:var(--red)}
.breaking a{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;cursor:pointer}
.breaking a:last-child{border-bottom:0}
.breaking a:hover .t{color:var(--red)}
.breaking .time{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.breaking .t{color:var(--ink)}

.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.hl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s;cursor:pointer}
.hl:hover{border-color:var(--amber)}
.hl .thumb{width:100%;aspect-ratio:16/9;background:var(--panel-2) center/cover no-repeat;flex:none}
.hl .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px}
.hl .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.hl .cat{font-size:10.5px;font-weight:700;color:var(--amber);letter-spacing:.4px}
.hl .t{font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.hl .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px;cursor:pointer}
.tab:hover{color:var(--ink);border-color:var(--mut)}
.tab.on{background:rgba(242,169,59,.12);border-color:var(--amber);color:var(--amber);font-weight:600}

.brief{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none}
.brief-head{font-size:11.5px;font-weight:700;color:var(--amber);letter-spacing:.4px;margin-bottom:8px}
.brief-lines{display:flex;flex-direction:column;gap:5px}
.brief-lines span{font-size:13.5px;line-height:1.65;color:var(--ink)}
.brief-lines span::before{content:'—';color:var(--dim);margin-right:8px}
.brief-meta{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

.news-list a{display:flex;gap:12px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;flex-wrap:wrap}
.news-list a:hover .t{color:var(--amber)}
.news-list .time{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none;width:76px}
.news-list .press{font-size:11.5px;color:var(--dim);flex:none;width:60px}
.news-list .t{color:var(--ink);line-height:1.5;flex:1;min-width:0}
.news-list .bk{color:var(--red);font-weight:700;font-size:11px;margin-right:6px}

.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.72);display:none;place-items:center;z-index:300;padding:20px}
.modal-bg.show{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;overflow:hidden;position:relative;max-height:88vh;overflow-y:auto}
.modal-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer;z-index:2}
.modal-x:hover{background:rgba(0,0,0,.7)}
.modal .img-wrap{background:var(--panel-2);max-height:280px;overflow:hidden;display:none}
.modal .img-wrap img{width:100%;display:block;object-fit:cover}
.modal .body{padding:18px 20px}
.modal .cat{font-size:11px;font-weight:700;color:var(--amber)}
.modal h3{font-size:16.5px;line-height:1.5;margin:6px 0 10px}
.modal .desc{color:var(--mut);font-size:13.5px;line-height:1.8}
.modal .loading{color:var(--dim);font-size:13px;padding:30px;text-align:center}
.modal-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.modal-foot .src{color:var(--dim);flex:none}
.modal-foot a{color:var(--blue);font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-foot a:hover{text-decoration:underline}

@media (max-width:640px){
  .news-list .press{display:none}
  .news-list .time{width:60px}
}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page">
    <h1>AI 뉴스</h1>
    <div class="fetch-info">수집 <span id="footTotal">-</span>건 · 마지막 수집 <span id="lastFetch">-</span></div>
  </header>

  <div class="panel breaking" id="breakingPanel" style="display:none">
    <h2>속보</h2>
    <div id="breakingList"></div>
  </div>

  <div style="font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:0 0 12px">주요 뉴스</div>
  <div class="hl-grid" id="hlGrid"></div>

  <div class="panel">
    <div class="tabs" id="tabs"></div>

    <div class="brief" id="briefBox">
      <div class="brief-head">✨ AI 3줄 브리핑</div>
      <div class="brief-lines" id="briefLines"></div>
      <div class="brief-meta" id="briefMeta"></div>
    </div>

    <div class="news-list" id="newsList"></div>
    <div class="empty" id="newsEmpty" style="display:none">아직 수집된 기사가 없습니다. 첫 수집은 서버 시작 후 약 10초 뒤 시작됩니다.</div>
  </div>

  <p style="margin-top:14px;color:var(--dim);font-size:11.5px">기사 클릭 시 미리보기가 표시되며, 전문은 출처 링크를 통해 언론사 원문에서 볼 수 있습니다. 출처: 한국경제 · 매일경제 RSS</p>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-x" onclick="closePreview()" aria-label="닫기">✕</button>
    <div class="img-wrap" id="pvImgWrap"><img id="pvImg" alt=""></div>
    <div class="body">
      <div class="loading" id="pvLoading">미리보기 불러오는 중...</div>
      <div id="pvContent" style="display:none">
        <span class="cat" id="pvMeta"></span>
        <h3 id="pvTitle"></h3>
        <p class="desc" id="pvDesc"></p>
      </div>
    </div>
    <div class="modal-foot">
      <span class="src">출처:</span>
      <a id="pvLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="/js/nav.js"></script>
<script>
const API = '/api/news';
let curCat = 'POLITICS';
let briefings = {};
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtT = t => t ? t.replace('T',' ').substring(5,16) : '-';

async function loadTabs(){
  const cats = await fetch(API + '/categories').then(r => r.json());
  $('tabs').innerHTML = cats.map(c =>
    `<button class="tab ${c.code === curCat ? 'on' : ''}" data-cat="${c.code}" onclick="selectCat('${c.code}')">${c.label}</button>`
  ).join('');
}

function selectCat(code){
  curCat = code;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.cat === code));
  loadList();
  renderBriefing();
}

async function loadBriefings(){
  try{
    const list = await fetch(API + '/briefings').then(r => r.json());
    briefings = {};
    list.forEach(b => briefings[b.category] = b);
    renderBriefing();
  }catch(e){}
}

function renderBriefing(){
  const b = briefings[curCat];
  if(!b){ $('briefBox').style.display = 'none'; return; }
  $('briefBox').style.display = 'block';
  $('briefLines').innerHTML = b.content.split('\n').filter(l => l.trim())
    .map(l => `<span>${esc(l.trim())}</span>`).join('');
  $('briefMeta').textContent = 'Gemini 생성 · ' + fmtT(b.generatedAt) + ' · 헤드라인 기반 요약';
}

async function loadList(){
  const list = await fetch(API + '/articles?category=' + curCat).then(r => r.json());
  $('newsEmpty').style.display = list.length ? 'none' : 'block';
  $('newsList').innerHTML = list.map(a => `
    <a onclick="openPreview(${a.id})">
      <span class="time">${fmtT(a.publishedAt)}</span>
      <span class="press">${esc(a.press)}</span>
      <span class="t">${a.breaking ? '<span class="bk">속보</span>' : ''}${esc(a.title)}</span>
    </a>`).join('');
}

async function loadHighlights(){
  try{
    const h = await fetch(API + '/highlights').then(r => r.json());
    $('footTotal').textContent = h.total;
    $('lastFetch').textContent = h.lastFetchAt ? fmtT(h.lastFetchAt) : '준비 중';
    const bk = h.breaking || [];
    $('breakingPanel').style.display = bk.length ? 'block' : 'none';
    $('breakingList').innerHTML = bk.map(a => `
      <a onclick="openPreview(${a.id})">
        <span class="time">${fmtT(a.publishedAt)}</span>
        <span class="t">${esc(a.title)}</span>
      </a>`).join('');
    $('hlGrid').innerHTML = (h.latest || []).map(a => `
      <div class="hl" onclick="openPreview(${a.id})">
        ${a.image ? `<div class="thumb" style="background-image:url('${esc(a.image)}')"></div>` : `<div class="thumb empty">📰</div>`}
        <div class="body">
          <span class="cat">${a.categoryLabel}</span>
          <span class="t">${esc(a.title)}</span>
          <span class="meta">${esc(a.press)} · ${fmtT(a.publishedAt)}</span>
        </div>
      </div>`).join('');
  }catch(e){}
}

async function openPreview(id){
  $('modalBg').classList.add('show');
  $('pvLoading').style.display = 'block';
  $('pvContent').style.display = 'none';
  $('pvImgWrap').style.display = 'none';
  $('pvLink').textContent = '';
  try{
    const res = await fetch(API + '/preview?id=' + id);
    if(!res.ok) throw new Error();
    const p = await res.json();
    if(p.image){ $('pvImg').src = p.image; $('pvImgWrap').style.display = 'block'; }
    $('pvMeta').textContent = p.press + ' · ' + fmtT(p.publishedAt);
    $('pvTitle').textContent = p.title;
    $('pvDesc').textContent = p.description || '';
    $('pvDesc').style.display = p.description ? 'block' : 'none';
    $('pvLink').textContent = p.link;
    $('pvLink').href = p.link;
    $('pvLoading').style.display = 'none';
    $('pvContent').style.display = 'block';
  }catch(e){
    $('pvLoading').textContent = '미리보기를 불러오지 못했습니다. 하단 출처 링크로 원문을 확인하세요.';
  }
}

function closePreview(){
  $('modalBg').classList.remove('show');
  $('pvLoading').textContent = '미리보기 불러오는 중...';
}
$('modalBg').addEventListener('click', e => { if(e.target === $('modalBg')) closePreview(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePreview(); });

async function init(){
  await loadTabs();
  loadHighlights();
  loadList();
  loadBriefings();
}
init();
setInterval(() => { loadHighlights(); loadList(); loadBriefings(); }, 5 * 60 * 1000);
</script>
</body>
</html>
