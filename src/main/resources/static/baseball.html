<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자야구 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
.two-col{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.guess-input{display:flex;gap:8px}
.guess-input input{font-family:var(--mono);font-size:20px;letter-spacing:6px;text-align:center}
.history{margin-top:16px;display:flex;flex-direction:column-reverse;gap:6px;max-height:360px;overflow-y:auto}
.history-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px}
.history-row .no{color:var(--dim);width:26px}
.history-row .guess{letter-spacing:3px;flex:1}
.history-row .result span{padding:2px 7px;border-radius:6px;font-weight:700;margin-left:4px}
.s-badge{background:rgba(62,207,142,.14);color:var(--green)}
.b-badge{background:rgba(242,169,59,.14);color:var(--amber)}
.win-banner{display:none;background:rgba(62,207,142,.1);border:1px solid var(--green);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.win-banner.show{display:block}
.win-banner b{color:var(--green)}
.nick-row{display:flex;gap:8px;margin-top:10px}
.rank-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.rank-row:last-child{border-bottom:0}
.rank-row .no{color:var(--amber);font-family:var(--mono);width:24px}
@media (max-width:800px){ .two-col{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page">
    <h1>⚾ 숫자야구</h1>
    <button class="btn btn-ghost" onclick="newGame()">새 게임</button>
  </header>

  <div class="two-col">
    <div class="panel">
      <h2>추리하기</h2>
      <p style="color:var(--mut);font-size:13px;margin-bottom:14px">1~9 중 중복 없는 4자리 숫자를 맞추세요. 숫자와 자릿수가 모두 일치하면 스트라이크(S), 숫자만 일치하면 볼(B)입니다.</p>

      <div class="win-banner" id="winBanner">
        <b id="winText"></b>
        <div class="nick-row">
          <input id="nickname" placeholder="랭킹에 등록할 닉네임 (선택)" maxlength="12">
          <button class="btn btn-amber" onclick="saveScore()">등록</button>
        </div>
      </div>

      <div class="guess-input">
        <input id="guessInput" maxlength="4" placeholder="1234" inputmode="numeric" onkeydown="if(event.key==='Enter')submitGuess()">
        <button class="btn btn-amber" onclick="submitGuess()">제출</button>
      </div>
      <span class="msg-result" id="guessMsg" style="display:block;margin-top:8px;color:var(--mut);font-size:12.5px"></span>

      <div class="history" id="history"></div>
    </div>

    <div class="panel">
      <h2>랭킹 · 최소 시도</h2>
      <div id="ranking"><div class="empty-msg">아직 등록된 기록이 없습니다.</div></div>
    </div>
  </div>
</main>

<script src="/js/nav.js"></script>
<script>
const API = '/api/game/baseball';
let gameId = null;
let finished = false;
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function newGame(){
  const data = await fetch(API + '/new', { method: 'POST' }).then(r => r.json());
  gameId = data.id;
  finished = false;
  $('winBanner').classList.remove('show');
  $('guessMsg').textContent = '';
  $('guessInput').value = '';
  $('history').innerHTML = '';
}

async function submitGuess(){
  if (finished || !gameId) return;
  const guess = $('guessInput').value.trim();
  if (!/^[1-9]{4}$/.test(guess) || new Set(guess).size !== 4) {
    $('guessMsg').textContent = '1~9 숫자 4자리를 중복 없이 입력하세요';
    return;
  }
  const data = await fetch(`${API}/${gameId}/guess`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ guess })
  }).then(r => r.json());

  if (data.error) { $('guessMsg').textContent = data.error; return; }
  $('guessMsg').textContent = '';
  $('guessInput').value = '';
  renderHistory(data.history);

  if (data.status === 'WON') {
    finished = true;
    $('winText').textContent = `🎉 정답입니다! 총 ${data.attempts}번 만에 맞혔어요.`;
    $('winBanner').classList.add('show');
    loadRanking();
  }
}

function renderHistory(history){
  $('history').innerHTML = history.map((h, i) => {
    const [guess, result] = h.split(':');
    const s = result.match(/(\d)S/)[1];
    const b = result.match(/(\d)B/)[1];
    return `<div class="history-row">
      <span class="no">#${i + 1}</span>
      <span class="guess">${esc(guess)}</span>
      <span class="result"><span class="s-badge">${s}S</span><span class="b-badge">${b}B</span></span>
    </div>`;
  }).join('');
}

async function saveScore(){
  if (!gameId) return;
  const nickname = $('nickname').value.trim();
  await fetch(`${API}/${gameId}/score`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nickname })
  });
  $('nickname').disabled = true;
  loadRanking();
}

async function loadRanking(){
  const list = await fetch(API + '/ranking').then(r => r.json());
  if (!list.length) { $('ranking').innerHTML = '<div class="empty-msg">아직 등록된 기록이 없습니다.</div>'; return; }
  $('ranking').innerHTML = list.map((r, i) =>
    `<div class="rank-row"><span><span class="no">${i + 1}</span> ${esc(r.nickname)}</span><span>${r.metric}회</span></div>`
  ).join('');
}

newGame();
loadRanking();
</script>
</body>
</html>
