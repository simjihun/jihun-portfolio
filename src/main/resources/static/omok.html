<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오목 · hunit 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
.board-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.turn-banner{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.turn-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.turn-dot.B{background:#1a1a1a}
.turn-dot.W{background:#f2f2f2}
.board{display:grid;grid-template-columns:repeat(15,minmax(20px,28px));grid-template-rows:repeat(15,minmax(20px,28px));background:#C99B5F;border:2px solid #8a6a3f;border-radius:6px;padding:8px}
.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell::before,.cell::after{content:'';position:absolute;background:#5b4326}
.cell::before{left:0;right:0;top:50%;height:1px}
.cell::after{top:0;bottom:0;left:50%;width:1px}
.stone{width:78%;height:78%;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.4);z-index:2}
.stone.B{background:radial-gradient(circle at 35% 30%,#555,#000)}
.stone.W{background:radial-gradient(circle at 35% 30%,#fff,#ccc)}
.result-banner{font-size:18px;font-weight:700;padding:10px 20px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:none}
.result-banner.show{display:block}

@media (max-width:600px){
  .board{grid-template-columns:repeat(15,minmax(16px,22px));grid-template-rows:repeat(15,minmax(16px,22px))}
}
</style>
</head>
<body>
<div id="site-nav"></div>

<main>
  <header class="page">
    <h1>⚪️ 오목</h1>
    <button class="btn btn-ghost" onclick="newGame()">새 게임</button>
  </header>

  <div class="panel board-wrap">
    <div class="result-banner" id="resultBanner"></div>
    <div class="turn-banner">
      <span class="turn-dot" id="turnDot"></span>
      <span id="turnText">흑돌 차례입니다</span>
    </div>
    <div class="board" id="board"></div>
    <p style="color:var(--dim);font-size:12px">한 화면을 두 명이 같이 보면서 번갈아 클릭하는 항시트 방식입니다.</p>
  </div>
</main>

<script src="/js/nav.js"></script>
<script>
const API = '/api/game/omok';
const SIZE = 15;
let gameId = null;
const $ = id => document.getElementById(id);

function buildBoard(){
  const board = $('board');
  board.innerHTML = '';
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      cell.onclick = () => move(x, y);
      board.appendChild(cell);
    }
  }
}

async function newGame(){
  const data = await fetch(API + '/new', { method: 'POST' }).then(r => r.json());
  gameId = data.id;
  $('resultBanner').classList.remove('show');
  render(data);
}

async function move(x, y){
  if (!gameId) return;
  const data = await fetch(`${API}/${gameId}/move`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ x, y })
  }).then(r => r.json());
  if (data.error) return; // 빈 칸이 아니거나 게임 종료 등은 조용히 무시
  render(data);
}

function render(data){
  const board = data.board; // 문자열 배열, '.'=빈칸 'B'/'W'
  document.querySelectorAll('.cell').forEach(cell => {
    const x = +cell.dataset.x, y = +cell.dataset.y;
    const v = board[y][x];
    cell.innerHTML = v === '.' ? '' : `<div class="stone ${v}"></div>`;
  });

  const dot = $('turnDot');
  dot.className = 'turn-dot ' + data.currentPlayer;

  if (data.status === 'PLAYING') {
    $('turnText').textContent = (data.currentPlayer === 'B' ? '흑돌' : '백돌') + ' 차례입니다';
    $('resultBanner').classList.remove('show');
  } else {
    const label = data.status === 'BLACK_WIN' ? '⚫ 흑돌 승리!' : data.status === 'WHITE_WIN' ? '⚪ 백돌 승리!' : '무승부';
    $('turnText').textContent = '대국 종료';
    $('resultBanner').textContent = label + ' — 새 게임을 눌러 다시 시작하세요';
    $('resultBanner').classList.add('show');
  }
}

buildBoard();
newGame();
</script>
</body>
</html>
