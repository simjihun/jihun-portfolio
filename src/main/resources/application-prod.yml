# =========================================
# 운영(prod) 프로파일 — AWS RDS(MySQL) 연동
# 활성화: SPRING_PROFILES_ACTIVE=prod 환경변수로 실행
# 접속 정보는 코드에 넣지 않고 환경변수(conf/app.conf)로 주입받는다.
# =========================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME:msgdb}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false
